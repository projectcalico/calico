# ValidatingAdmissionPolicy that protects CNI-written Pod annotations. Since
# Felix uses these annotations when programming the dataplane, they should not be
# editable by anyone but the CNI by default.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: protect-cni-annotations.projectcalico.org
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # Annotations are writable through pods/status too, and a pods/binding create
      # copies its own annotations onto the pod. Don't widen this to pods/*:
      # pods/exec carries no metadata, so kubectl exec would be denied.
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods", "pods/status", "pods/binding"]
        operations: ["CREATE", "UPDATE"]
  variables:
    - name: newAnn
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    # oldObject is null on CREATE.
    - name: oldAnn
      expression: >-
        request.operation == 'UPDATE'
          ? (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {})
          : {}
    - name: perInterfaceKeys
      expression: >-
        variables.newAnn.filter(k,
          k.startsWith('cni.projectcalico.org/') && k.endsWith('.network-status')) +
        variables.oldAnn.filter(k,
          k.startsWith('cni.projectcalico.org/') && k.endsWith('.network-status') &&
          !(k in variables.newAnn))
    - name: protectedKeys
      expression: >-
        [
          'cni.projectcalico.org/podIP',
          'cni.projectcalico.org/podIPs',
          'cni.projectcalico.org/containerID',
          'cni.projectcalico.org/podNetns',
          'cni.projectcalico.org/network-status'
        ] + variables.perInterfaceKeys
    # Keys this write adds, changes or removes.
    - name: changed
      expression: >-
        variables.protectedKeys.filter(k,
          k in variables.newAnn
            ? !(k in variables.oldAnn) || variables.oldAnn[k] != variables.newAnn[k]
            : k in variables.oldAnn)
    - name: canWriteCNIAnnotations
      expression: >-
        authorizer.group('projectcalico.org')
          .resource('cniannotations')
          .check('write').allowed()
    # Anyone who may delete this policy could remove it anyway, so they are not refused.
    - name: canDeletePolicy
      expression: >-
        authorizer.group('admissionregistration.k8s.io')
          .resource('validatingadmissionpolicies')
          .name('protect-cni-annotations.projectcalico.org')
          .check('delete').allowed()
  validations:
    - expression: "variables.changed.size() == 0 || variables.canWriteCNIAnnotations || variables.canDeletePolicy"
      reason: Forbidden
      message: "Only identities allowed to write cniannotations.projectcalico.org, or to delete this policy, may set, change or remove these pod annotations"
      messageExpression: >-
        'Only identities allowed to write cniannotations.projectcalico.org, or to delete this policy, may set, change or remove these pod annotations: ' +
        variables.changed.join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: protect-cni-annotations.projectcalico.org
spec:
  policyName: protect-cni-annotations.projectcalico.org
  validationActions: [Deny]
