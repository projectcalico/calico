# Kubernetes AuthorizationConfiguration for Calico tier-based RBAC.
#
# Inserts the Calico authorization webhook between the Node and RBAC authorizers:
#
#   Node -> Calico Webhook -> RBAC
#
# The webhook enforces tier-based access control for reads (GET/LIST/WATCH) of tiered policy
# resources. Mutating operations are covered by the tiered RBAC admission webhook instead,
# which unlike this one can read the object body. The webhook returns Denied or NoOpinion and
# never Allowed, so base RBAC still applies to every request it lets through.
#
# --authorization-config is mutually exclusive with --authorization-mode. This file replaces
# the --authorization-mode=Node,RBAC flag entirely.
#
# See README.md in this directory for the install and break-glass procedures.
apiVersion: apiserver.config.k8s.io/v1
kind: AuthorizationConfiguration
authorizers:
  - type: Node
    name: node
  - type: Webhook
    name: calico-tiered-rbac
    webhook:
      timeout: 3s
      # We never return Allowed, so authorizedTTL is inert. unauthorizedTTL caches both
      # Denied and NoOpinion, which makes it the security-relevant knob: spec.tier is
      # mutable, so moving a policy into a restricted tier leaves a stale NoOpinion for a
      # previously authorized reader for up to this long. Lower it to shrink that window at
      # the cost of putting the webhook in front of every Calico read.
      # unauthorizedTTL is mirrored by hand as authzUnauthorizedTTL in
      # e2e/pkg/tests/policy/tiered_rbac_reads.go, which polls for longer than it. Change both
      # together or those specs start asserting against the wrong window.
      authorizedTTL: 5m
      unauthorizedTTL: 30s
      # Fail closed. If the webhook is unreachable, every request that reaches it is denied
      # rather than silently falling through to RBAC. The first matchCondition below matches
      # the whole projectcalico.org group with no verb or resource guard, so that is every
      # verb (not just reads) on every resource in the group (not just tiered policy), from
      # every identity not in the exempt list below. See the break-glass procedure in
      # README.md.
      failurePolicy: Deny
      subjectAccessReviewVersion: v1
      matchConditionSubjectAccessReviewVersion: v1
      connectionInfo:
        type: KubeConfigFile
        kubeConfigFile: /etc/kubernetes/authz/calico-authz-webhook-kubeconfig.yaml
      matchConditions:
        # Only Calico API group resource requests reach the webhook. Everything else, including
        # cluster bootstrap traffic, skips it entirely.
        - expression: has(request.resourceAttributes) && request.resourceAttributes.group == 'projectcalico.org'
        # Never gate Calico's own components. The webhook's informers read the very resources
        # it authorizes, so gating them would deadlock informer bootstrap under this failure
        # policy. Listed explicitly rather than by namespace prefix: these service accounts
        # live in kube-system, and exempting everything in kube-system would be far broader
        # than intended. Every field access is guarded so this expression cannot error,
        # because a matchConditions error counts as a webhook failure and would itself deny.
        - expression: >-
            !(has(request.user) && request.user in [
              'system:serviceaccount:kube-system:calico-webhooks',
              'system:serviceaccount:kube-system:calico-node',
              'system:serviceaccount:kube-system:calico-kube-controllers'
            ])
  - type: RBAC
    name: rbac
