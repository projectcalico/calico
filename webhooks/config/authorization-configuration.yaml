# Kubernetes AuthorizationConfiguration for Calico tier-based RBAC.
#
# This configures the kube-apiserver authorization chain to include the Calico
# authorization webhook between the Node and RBAC authorizers:
#
#   Node -> Calico Webhook -> RBAC
#
# The Calico webhook enforces tier-based access control for read operations
# (GET/LIST/WATCH) on tiered policy resources (NetworkPolicy, GlobalNetworkPolicy,
# and their staged variants). It returns NoOpinion for all other requests, allowing
# RBAC to handle them as usual.
#
# Setup:
#   1. Deploy the Calico webhooks server (calico-webhooks) in your cluster.
#   2. Create a webhook kubeconfig that tells the API server how to reach the
#      webhook (see calico-authz-webhook-kubeconfig.yaml).
#   3. Place both files on the control-plane node(s) and configure the API server:
#        kube-apiserver --authorization-config=/etc/kubernetes/authz/authorization-configuration.yaml
#
# Note: --authorization-config is mutually exclusive with --authorization-mode.
#       This file replaces the --authorization-mode=Node,RBAC flag entirely.
#
# The failurePolicy is set to NoOpinion so that if the webhook is unreachable
# (e.g. during cluster bootstrap or webhook rollout), requests fall through to
# RBAC and the cluster continues to operate normally.
#
# The matchConditions restrict the webhook to only Calico API group requests,
# so non-Calico resources (core k8s, RBAC, etc.) are never sent to the webhook.
# This avoids unnecessary latency and ensures cluster bootstrap is not delayed.
apiVersion: apiserver.config.k8s.io/v1
kind: AuthorizationConfiguration
authorizers:
  - type: Node
    name: node
  - type: Webhook
    name: calico-tiered-rbac
    webhook:
      timeout: 3s
      authorizedTTL: 5m
      unauthorizedTTL: 30s
      failurePolicy: NoOpinion
      subjectAccessReviewVersion: v1
      matchConditionSubjectAccessReviewVersion: v1
      connectionInfo:
        type: KubeConfigFile
        kubeConfigFile: /etc/kubernetes/authz/calico-authz-webhook-kubeconfig.yaml
      matchConditions:
        - expression: has(request.resourceAttributes) && request.resourceAttributes.group == 'projectcalico.org'
  - type: RBAC
    name: rbac
