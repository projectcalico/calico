# Kubeconfig for the Calico tier-based RBAC authorization webhook.
#
# This file tells the kube-apiserver how to reach the Calico webhook's /authz
# endpoint. It is referenced from the AuthorizationConfiguration file
# (authorization-configuration.yaml) via the connectionInfo.kubeConfigFile field.
#
# Before use, update the following fields:
#   - server: Substitute the ClusterIP of the calico-webhooks Service in kube-system:
#       kubectl get svc -n kube-system calico-webhooks -o jsonpath='{.spec.clusterIP}'
#     A .svc DNS name will not resolve here: kube-apiserver reads this file and dials
#     the address from its own network namespace, which has no cluster DNS and no
#     pod-network route. It must be a routable IP. Port 443 is the Service port; the
#     container's own listener is on 6443, but that is reached through the Service.
#   - certificate-authority: Path to the CA cert that signed the webhook's TLS cert. Ships
#     pointing at the same directory README.md step 3 has you place this file in, since that
#     is where the CA cert lands too.
apiVersion: v1
kind: Config
clusters:
  - name: calico-authz-webhook
    cluster:
      server: https://CLUSTER_IP:443/authz
      certificate-authority: /etc/kubernetes/authz/calico-authz-webhook-ca.crt
users:
  # If calico-webhooks runs with --client-ca-file, its listener requires a client certificate
  # from every caller, including kube-apiserver itself. Add client-certificate/client-key here
  # in that case; today the chart only sets --tls-cert-file/--tls-private-key-file, so no
  # client credential is required yet.
  - name: kube-apiserver
    user: {}
contexts:
  - name: default
    context:
      cluster: calico-authz-webhook
      user: kube-apiserver
current-context: default
