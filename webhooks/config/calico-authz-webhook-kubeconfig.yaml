# Kubeconfig for the Calico tier-based RBAC authorization webhook.
#
# This file is referenced by authorization-configuration.yaml and tells the
# Kubernetes API server how to reach the Calico webhook server's /authz endpoint.
#
# Install this file at the path specified in the AuthorizationConfiguration:
#   /etc/kubernetes/calico-authz-webhook-kubeconfig.yaml
#
# You must update the following before use:
#   - server: Set to the webhook service URL (in-cluster) or external endpoint.
#   - certificate-authority: Path to the CA cert that signed the webhook's TLS cert.
apiVersion: v1
kind: Config
clusters:
  - name: calico-authz-webhook
    cluster:
      # The webhook server's /authz endpoint. When running in-cluster, use the
      # Kubernetes service DNS name. Update the namespace and port as needed.
      server: https://calico-webhooks.calico-system.svc:6443/authz

      # Path to the CA certificate that signed the webhook server's TLS certificate.
      # Required for the API server to verify the webhook's identity.
      certificate-authority: /etc/kubernetes/pki/calico-authz-webhook-ca.crt

users:
  - name: kube-apiserver
    user: {}

contexts:
  - name: default
    context:
      cluster: calico-authz-webhook
      user: kube-apiserver

current-context: default
