version: v1.0

name: calico master - upgrade

agent:
  machine:
    type: c1-standard-1
    os_image: ubuntu2204

auto_cancel:
  queued:
    when: "true"

execution_time_limit:
  hours: 12

global_job_config:
  prologue:
    commands_file: ../scripts/global_prologue.sh
  epilogue:
    always:
      commands:
        - ~/calico/.semaphore/end-to-end/scripts/global_epilogue.sh
  secrets:
    - name: marvin-github-ssh-private-key
    - name: banzai-secrets
  env_vars:
    - name: TEST_TYPE
      value: k8s-e2e
    - name: PRODUCT
      value: calico
    - name: RELEASE_STREAM # in this context, this is the version to upgrade from
      value: v3.29
    - name: USE_HASH_RELEASE
      value: "false"
    - name: UPLEVEL_PRODUCT
      value: calico
    - name: UPLEVEL_PRE_RELEASE
      value: "true"
    - name: UPLEVEL_RELEASE_STREAM # the version under test after the upgrade
      value: master
    - name: CALICOCTL_INSTALL_TYPE
      value: "container"
    - name: FUNCTIONAL_AREA
      value: "upgrade.yml"
    - name: USE_PRIVATE_REGISTRY
      value: "true"
    - name: PRIVATE_REGISTRY
      value: "quay.io/"

blocks:
  - name: calico tests
    dependencies: []
    task:
      jobs:
        - name: AKS - BYO CNI w/ AzureLinux
          execution_time_limit:
            hours: 4
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: E2E_TEST_CONFIG
              value: "e2e/config/upgrade/aks-xtables.yaml"
            - name: PROVISIONER
              value: azr-aks
            - name: AZ_NETWORK_PLUGIN
              value: none
            - name: CLUSTER_IMAGE
              value: AzureLinux
          matrix:
            - env_var: K8S_VERSION
              values: ["stable-2"]
            - env_var: INSTALLER
              values: ["operator"]
            - env_var: DATAPLANE
              values: ["CalicoIptables"]

        - name: EKS
          execution_time_limit:
            hours: 4
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: E2E_TEST_CONFIG
              value: "e2e/config/upgrade/eks-bpf-aws-manifest.yaml"
            - name: PROVISIONER
              value: aws-eks
          matrix:
            - env_var: K8S_VERSION
              values: ["stable-1"]
            - env_var: EKS_CNI
              values: ["calico"]
            - env_var: INSTALLER
              values: ["manual"]
            - env_var: DATAPLANE
              values: ["CalicoBPF"]

        - name: kubeadm - iptables
          execution_time_limit:
            hours: 4
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: E2E_TEST_CONFIG
              value: "e2e/config/upgrade/xtables-aws.yaml"
          matrix:
            - env_var: PROVISIONER
              values: ["aws-kubeadm"]
            - env_var: K8S_VERSION
              values: ["stable-3"]
            - env_var: INSTALLER
              values: ["operator"]
            - env_var: DATAPLANE
              values: ["CalicoIptables"]

        - name: kubeadm - bpf
          execution_time_limit:
            hours: 4
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: E2E_TEST_CONFIG
              value: "e2e/config/upgrade/bpf.yaml"
          matrix:
            - env_var: PROVISIONER
              values: ["gcp-kubeadm"]
            - env_var: K8S_VERSION
              values: ["stable"]
            - env_var: INSTALLER
              values: ["operator"]
            - env_var: DATAPLANE
              values: ["CalicoBPF"]

        - name: RKE2
          execution_time_limit:
            hours: 4
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: E2E_TEST_CONFIG
              value: "e2e/config/upgrade/xtables.yaml"
            - name: PROVISIONER
              value: gcp-rke2
          matrix:
            - env_var: RKE_NETWORKING
              values: [""]
            - env_var: K8S_VERSION
              values: ["stable-2"]
            - env_var: INSTALLER
              values: ["operator"]
            - env_var: DATAPLANE
              values: ["CalicoIptables"]

  - name: calico tests - openshift
    dependencies: []
    task:
      agent:
        machine:
          type: f1-standard-2
          os_image: ubuntu2204
      jobs:
        - name: Openshift
          execution_time_limit:
            hours: 4
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: E2E_TEST_CONFIG
              value: "e2e/config/upgrade/xtables-aws.yaml"
            - name: PROVISIONER
              value: aws-openshift
          matrix:
            - env_var: OPENSHIFT_VERSION
              values: ["4.19.20"]
            - env_var: DATAPLANE
              values: ["CalicoIptables"]
            - env_var: INSTALLER
              values: ["operator"]

promotions:
  - name: Cleanup jobs
    pipeline_file: /promotions/cleanup.yml
    auto_promote:
      when: "result = 'stopped'"

after_pipeline:
  task:
    jobs:
      - name: Reports
        commands:
          - test-results gen-pipeline-report --force
