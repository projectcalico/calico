  - name: Wireguard
    dependencies: []
    task:
      jobs:
        - name: BPF + AKS w AKS CNI + Overlay
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: ENABLE_EXTERNAL_NODE # No code in banzai-core yet for external nodes on Azure
              value: "false"
            - name: NETWORK_PLUGIN_MODE
              value: "overlay"
            - name: AZ_NETWORK_PLUGIN
              value: "azure"
            - name: IPV4_POD_CIDR
              value: "10.244.0.0/16"
            - name: INSTALLER
              value: "operator"
            - name: PROVISIONER
              value: "azr-aks"
            - name: AZ_CREATE_MODE
              value: AKS
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/aks-bpf-encap-nobgp.yaml"

  # this is from the old every-week file
  - name: usage reporting with bpf
    dependencies: []
    task:
      jobs:
        - name: mainline
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: K8S_VERSION
              values: ["stable"]
          env_vars:
            - name: PROVISIONER
              value: aws-kubeadm
            - name: CLUSTER_NODES
              value: "1"
            - name: ENABLE_EXTERNAL_NODE
              value: "true"
            - name: USE_HASH_RELEASE
              value: "false"
            - name: ENABLE_USAGE
              value: "true"
            - name: TEST_TYPE
              value: usage-reporting
            - name: USAGE_REPORTING_COUNTRY
              value: "US"
      secrets:
        - name: dynamo-read-creds

  - name: KubeVirt e2e tests
    dependencies: []
    task:
      jobs:
        - name: KubeVirt IP persistence and live migration
          execution_time_limit:
            hours: 4
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: K8S_VERSION
              value: "stable-1.35"
      env_vars:
        - name: PROVISIONER
          value: "gcp-kubeadm"
        - name: NUM_KUBEVIRT_VMS
          value: "2"
        - name: E2E_TEST_CONFIG
          value: "e2e/config/gcp/kubevirt.yaml"

promotions:
  - name: Cleanup jobs
    pipeline_file: cleanup.yml
    auto_promote:
      when: "result = 'stopped'"

after_pipeline:
  task:
    jobs:
      - name: Reports
        commands:
          - test-results gen-pipeline-report --force
