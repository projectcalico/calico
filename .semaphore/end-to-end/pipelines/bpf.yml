version: v1.0

name: BPF
# This file contains e2e runs for BPF.

agent:
  machine:
    type: c1-standard-1
    os_image: ubuntu2204

execution_time_limit:
  hours: 12

global_job_config:
  prologue:
    commands_file: ../scripts/global_prologue.sh
  epilogue:
    always:
      commands:
        - ~/calico/.semaphore/end-to-end/scripts/global_epilogue.sh
  secrets:
    - name: marvin-github-ssh-private-key
    - name: banzai-secrets
  env_vars:
    - name: DATAPLANE
      value: "CalicoBPF"
    - name: INSTALLER
      value: "operator"
    - name: FUNCTIONAL_AREA
      value: "bpf.yml"
    - name: USE_PRIVATE_REGISTRY
      value: "true"
    - name: PRIVATE_REGISTRY
      value: "quay.io/"

blocks:
  # these are from the old arm64 file
  - name: ARM64 - smoke tests
    dependencies: []
    task:
      env_vars:
        - name: INSTALLER
          value: operator
        - name: STERN_CHECK
          value: DISABLED
      jobs:
        - name: Kubeadm - ARM64
          execution_time_limit:
            hours: 4
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: PROVISIONER
              value: gcp-kubeadm
            - name: GOOGLE_REGION
              value: us-central1 # Needed for arm machines
            - name: GOOGLE_ZONE
              value: us-central1-a # Needed for arm machines
            - name: GOOGLE_MACHINE_TYPE
              value: t2a-standard-2
            - name: K8S_VERSION
              value: "stable-1"
            - name: ENABLE_WIREGUARD
              value: "true"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/bpf.yaml"
          matrix:
            - env_var: CLUSTER_IMAGE
              values: ["ubuntu-2204-lts-arm64", "rocky-linux-9-arm64"]

        - name: AKS - ARM64 w/ AKS-CNI
          execution_time_limit:
            hours: 4
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: K8S_VERSION
              values: ["stable-1"]
            - env_var: CLUSTER_MODE
              values: [""]
          env_vars:
            - name: PROVISIONER
              value: azr-aks
            - name: AZ_VM_SIZE
              value: "Standard_D4plds_v5"
            - name: AZ_NETWORK_PLUGIN
              value: "azure"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/aks-bpf-nobgp.yaml"

        - name: AKS - ARM64 w/ Calico-CNI
          execution_time_limit:
            hours: 4
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: K8S_VERSION
              values: ["stable-1"]
            - env_var: CLUSTER_MODE
              values: [""]
          env_vars:
            - name: PROVISIONER
              value: azr-aks
            - name: AZ_VM_SIZE
              value: "Standard_D4plds_v5"
            - name: AZ_NETWORK_PLUGIN
              value: "none"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/aks-bpf.yaml"

  # these are from the old bpf file
  - name: BPF run matrix
    dependencies: []
    task:
      jobs:
        - name: AWS encap, VXLAN
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: PROVISIONER
              value: "aws-kubeadm"
            - name: IPAM_TEST_POOL_SUBNET
              value: "10.0.0.0/29"
            - name: USE_API_SERVER
              value: "false"
            - name: K8S_VERSION
              value: "stable-3"
            - name: USE_VXLAN
              value: "true"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/bpf-encap-v3crd-extnode-aws.yaml"

        - name: AWS encap, no VXLAN
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: PROVISIONER
              value: "aws-kubeadm"
            - name: IPAM_TEST_POOL_SUBNET
              value: "10.0.0.0/29"
            - name: USE_API_SERVER
              value: "false"
            - name: K8S_VERSION
              value: "stable-3"
            - name: USE_VXLAN
              value: "false"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/bpf-v3crd-extnode-aws.yaml"

        - name: AWS single subnet, dual IP-family
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: ENABLE_WIREGUARD
              values: ["true", "false"]
          env_vars:
            # This run picks its tests with a config rather than a focus/skip
            # pair: e2e/config/bpf-aws-single-subnet.yaml holds the same
            # selection the focus/skip used to give, Maglev tests included.
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf-aws-single-subnet.yaml"
            # Maglev needs DSR, and this is the one run whose cluster otherwise
            # suits it: BPF, an external node, one subnet, no encapsulation.
            - name: ENABLE_BPF_DSR
              value: "true"
            - name: IP_FAMILY
              value: dual
            - name: VPC_SUBNETS
              value: '["172.16.101.0/24"]'
            - name: IPAM_TEST_POOL_SUBNET
              value: "10.0.0.0/29"
            - name: PROVISIONER
              value: "aws-kubeadm"
            - name: ENCAPSULATION_TYPE
              value: "None"
            - name: BGP_STATUS
              value: Enabled
            - name: BPF_NETWORK_BOOTSTRAP
              value: "Enabled"
            - name: KUBE_PROXY_MANAGEMENT
              value: "Enabled"
            - name: CLUSTER_ROUTING_MODE
              value: Felix

        - name: AWS-Talos, no encap, DSR
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/bpf-aws.yaml"
            - name: ENABLE_EXTERNAL_NODE
              value: "false"  # No code for external nodes on Talos yet
            - name: VPC_SUBNETS
              value: '["172.16.101.0/24"]'
            - name: IPAM_TEST_POOL_SUBNET
              value: "10.0.0.0/29"
            - name: ENABLE_BPF_DSR
              value: "true"
            - name: PROVISIONER
              value: "aws-talos"
            - name: ENCAPSULATION_TYPE
              value: "None"
            - name: BGP_STATUS
              value: Enabled

        - name: GCP BPF DP, DSR
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/bpf-v3crd-extnode.yaml"
            - name: PROVISIONER
              value: "gcp-kubeadm"
            - name: ENABLE_BPF_DSR
              value: "true"
            - name: ENABLE_IP_FORWARDING
              value: "true"
            - name: BPF_NETWORK_BOOTSTRAP
              value: "Enabled"
            - name: KUBE_PROXY_MANAGEMENT
              value: "Enabled"
            - name: USE_API_SERVER
              value: "false"

        - name: GCP BPF DP encap w/ NodeLocal DNSCache, VXLAN
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: PROVISIONER
              value: "gcp-kubeadm"
            - name: CLUSTER_IMAGE
              value: "ubuntu-2204-lts"
            - name: ENABLE_NODE_LOCAL_DNS_CACHE
              value: "true"
            - name: USE_VXLAN
              value: "true"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/bpf-encap-extnode.yaml"

        - name: GCP BPF DP encap w/ NodeLocal DNSCache, no VXLAN
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: PROVISIONER
              value: "gcp-kubeadm"
            - name: CLUSTER_IMAGE
              value: "ubuntu-2204-lts"
            - name: ENABLE_NODE_LOCAL_DNS_CACHE
              value: "true"
            - name: USE_VXLAN
              value: "false"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/bpf-extnode.yaml"

        - name: AKS w/ AKS-CNI
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: PROVISIONER
              values:
                - "azr-aks"
          env_vars:
            - name: INSTALLER
              value: "operator"
            - name: ENABLE_EXTERNAL_NODE # No code in banzai-core yet for external nodes on Azure
              value: "false"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/aks-bpf-nobgp.yaml"

        - name: AKS w/ Calico-CNI
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: PROVISIONER
              value: "azr-aks"
            - name: INSTALLER
              value: "operator"
            - name: CNI_PLUGIN
              value: "Calico"
            - name: AZ_NETWORK_PLUGIN
              value: "none"
            - name: AZ_CREATE_MODE
              value: AKS
            - name: ENABLE_EXTERNAL_NODE # No code in banzai-core yet for external nodes on Azure
              value: "false"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/aks-bpf.yaml"

        - name: BPF + AKS w AKS CNI + Overlay
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: ENABLE_EXTERNAL_NODE # No code in banzai-core yet for external nodes on Azure
              value: "false"
            - name: NETWORK_PLUGIN_MODE
              value: "overlay"
            - name: AZ_NETWORK_PLUGIN
              value: "azure"
            - name: IPV4_POD_CIDR
              value: "10.244.0.0/16"
            - name: INSTALLER
              value: "operator"
            - name: PROVISIONER
              value: "azr-aks"
            - name: AZ_CREATE_MODE
              value: AKS
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/aks-bpf-encap-nobgp.yaml"

        - name: aws-kops RHEL8.2
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: PROVISIONER
              value: "aws-kops"
            - name: K8S_VERSION
              value: "stable-3"
            - name: CLUSTER_IMAGE
              value: "ami-02f147dfb8be58a10" # This is the Hourly image.  For Access image, use "ami-03cda30b7a23bda26"
            - name: USE_VENDORED_CNI
              value: "false"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/kops-bpf-extnode-aws.yaml"

        - name: aws-lb-bpf
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: ENCAPSULATION_TYPE
              values: ["IPIP", "VXLAN"]
          env_vars:
            - name: PROVISIONER
              value: "aws-eks"
            - name: EKS_CNI
              value: "calico"
            - name: IPV4_POD_CIDR
              value: "172.16.0.0/16"
            - name: IPAM_TEST_POOL_SUBNET
              value: "10.0.0.0/29"
            - name: BGP_STATUS
              value: Enabled
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/eks-bpf-encap-extnode-aws.yaml"

        - name: aws-lb-iptables
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: ENCAPSULATION_TYPE
              values: ["IPIP", "VXLAN"]
          env_vars:
            - name: PROVISIONER
              value: "aws-eks"
            - name: EKS_CNI
              value: "calico"
            - name: IPV4_POD_CIDR
              value: "172.16.0.0/16"
            - name: IPAM_TEST_POOL_SUBNET
              value: "10.0.0.0/29"
            - name: DATAPLANE
              value: "CalicoIptables"
            - name: BGP_STATUS
              value: Enabled
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/eks-xtables-encap-extnode-aws.yaml"

        - name: EKS w/ aws CNI
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: EKS_CNI
              values: ["aws"]
          env_vars:
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/bpf-nobgp-extnode-aws.yaml"
            - name: PROVISIONER
              value: "aws-eks"
            - name: INSTALLER
              value: "operator"
            - name: AWS_K8S_CNI_VERSION
              value: "NA"
            - name: NUM_ADDON_PODS
              value: "45" # there are 3 nodes, each with 3 ENIs and each ENI can have 12 IPs.

        - name: EKS w/ calico CNI
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: EKS_CNI
              values: ["calico"]
          env_vars:
            - name: ENCAPSULATION_TYPE
              value: "VXLAN"
            - name: PROVISIONER
              value: "aws-eks"
            - name: INSTALLER
              value: "operator"
            - name: IPV4_POD_CIDR
              value: "172.16.0.0/16"
            - name: IPAM_TEST_POOL_SUBNET
              value: "10.0.0.0/29"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/eks-bpf-encap-extnode-aws.yaml"

        # PAUSED (2026-08-06): this job focused Dataplane:LB, which has no specs in the in-repo
        # e2e suite (describe.WithDataplane(LB) is unused). Pointed at the new suite it
        # selects nothing and still passes, so it is paused rather than converted.
        # Uncomment when load-balancer specs land in e2e/pkg/tests, or delete this block.
        # Discussion: projectcalico/calico#13452.
        # - name: bpf-eks-aws-cni-lb
        #   execution_time_limit:
        #     hours: 7
        #   commands:
        #     - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
        #   matrix:
        #     - env_var: EKS_CNI
        #       values: ["aws"]
        #   env_vars:
        #     - name: PROVISIONER
        #       value: "aws-eks"
        #     - name: INSTALLER
        #       value: "operator"
        #     - name: K8S_E2E_FLAGS
        #       value: --ginkgo.focus=(Dataplane:LB) --ginkgo.skip=(Feature:Maglev)
        #     - name: NUM_ADDON_PODS
        #       value: "45" # there are 3 nodes, each with 3 ENIs and each ENI can have 12 IPs.

        - name: aws-kubeadm dual stack, BPF
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: IP_FAMILY
              values:
                - dual
          env_vars:
            - name: PROVISIONER
              value: "aws-kubeadm"
            - name: INSTALLER
              value: "operator"
            - name: DATAPLANE
              value: "CalicoBPF"
            - name: K8S_E2E_DOCKER_EXTRA_FLAGS
              value: --env IP_FAMILY
            - name: NAT_OUTGOING_V6
              value: "Enabled"
            - name: NAT_OUTGOING
              value: "Enabled"
            - name: ENCAPSULATION_TYPE_V6
              value: "VXLAN"
            - name: ENCAPSULATION_TYPE
              value: "VXLAN"
            - name: IPV6_POD_CIDR
              value: "fd00:10:244::/64"
            - name: IPV4_POD_CIDR
              value: "192.168.0.0/16"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/bpf-encap-extnode-aws.yaml"

        - name: aws-kubeadm dual stack, iptables
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: IP_FAMILY
              values:
                - dual
          env_vars:
            - name: PROVISIONER
              value: "aws-kubeadm"
            - name: INSTALLER
              value: "operator"
            - name: DATAPLANE
              value: "CalicoIptables"
            - name: K8S_E2E_DOCKER_EXTRA_FLAGS
              value: --env IP_FAMILY
            - name: NAT_OUTGOING_V6
              value: "Enabled"
            - name: NAT_OUTGOING
              value: "Enabled"
            - name: ENCAPSULATION_TYPE_V6
              value: "VXLAN"
            - name: ENCAPSULATION_TYPE
              value: "VXLAN"
            - name: IPV6_POD_CIDR
              value: "fd00:10:244::/64"
            - name: IPV4_POD_CIDR
              value: "192.168.0.0/16"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/xtables-encap-extnode-aws.yaml"

        - name: Kops w/ calico CNI IPv6, BPF
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: IP_FAMILY
              values:
                - ipv6
          env_vars:
            - name: PROVISIONER
              value: "aws-kops"
            - name: INSTALLER
              value: "operator"
            - name: DATAPLANE
              value: "CalicoBPF"
            - name: K8S_VERSION
              value: "stable-1"
            - name: NAT_OUTGOING_V6
              value: "Enabled"
            - name: ENCAPSULATION_TYPE_V6
              value: "VXLAN"
            - name: BGP_STATUS
              value: "Disabled"
            - name: IPV6_POD_CIDR
              value: "fd00:10:244::/64"
            - name: IPV4_POD_CIDR
              value: ""
            - name: CNI_PLUGIN
              value: "Calico"
            - name: USE_VENDORED_CNI
              value: "false"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/kops-bpf-encap-nobgp-extnode-aws.yaml"

        - name: Kops w/ calico CNI IPv6, iptables
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: IP_FAMILY
              values:
                - ipv6
          env_vars:
            - name: PROVISIONER
              value: "aws-kops"
            - name: INSTALLER
              value: "operator"
            - name: DATAPLANE
              value: "CalicoIptables"
            - name: K8S_VERSION
              value: "stable-1"
            - name: NAT_OUTGOING_V6
              value: "Enabled"
            - name: ENCAPSULATION_TYPE_V6
              value: "VXLAN"
            - name: BGP_STATUS
              value: "Disabled"
            - name: IPV6_POD_CIDR
              value: "fd00:10:244::/64"
            - name: IPV4_POD_CIDR
              value: ""
            - name: CNI_PLUGIN
              value: "Calico"
            - name: USE_VENDORED_CNI
              value: "false"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/kops-xtables-encap-nobgp-extnode-aws.yaml"

        - name: Kops w/ calico CNI IPv4, BPF
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: IP_FAMILY
              values: [ipv4]
          env_vars:
            - name: PROVISIONER
              value: "aws-kops"
            - name: INSTALLER
              value: "operator"
            - name: DATAPLANE
              value: "CalicoBPF"
            - name: NAT_OUTGOING
              value: "Enabled"
            - name: ENCAPSULATION_TYPE
              value: "VXLAN"
            - name: BGP_STATUS
              value: "Disabled"
            - name: CNI_PLUGIN
              value: "Calico"
            - name: USE_VENDORED_CNI
              value: "false"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/kops-bpf-encap-nobgp-extnode-aws.yaml"

        - name: Kops w/ calico CNI IPv4, iptables
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: IP_FAMILY
              values: [ipv4]
          env_vars:
            - name: PROVISIONER
              value: "aws-kops"
            - name: INSTALLER
              value: "operator"
            - name: DATAPLANE
              value: "CalicoIptables"
            - name: NAT_OUTGOING
              value: "Enabled"
            - name: ENCAPSULATION_TYPE
              value: "VXLAN"
            - name: BGP_STATUS
              value: "Disabled"
            - name: CNI_PLUGIN
              value: "Calico"
            - name: USE_VENDORED_CNI
              value: "false"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/kops-xtables-encap-nobgp-extnode-aws.yaml"

      env_vars:
        - name: ENABLE_EXTERNAL_NODE
          value: "true"
        - name: K8S_E2E_DOCKER_EXTRA_FLAGS
          value: --env EKS_CNI
        - name: CLUSTER_NODES
          value: "3"

  - name: BPF mini-scale runs
    dependencies: []
    task:
      jobs:
        - name: gcp-bpf - mini-scale
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: PROVISIONER
              value: "gcp-kubeadm"
            - name: TEST_TYPE
              value: "scale-test"
            - name: NUM_INFRA_NODES
              value: "3"
            - name: SCALE_TEST_TTFP50_THRESHOLD
              value: "0.006"
            - name: SCALE_TEST_TTFP99_THRESHOLD
              value: "0.6"

  - name: 9K MTU runs
    dependencies: []
    task:
      jobs:
        - name: aws-bpf - 9k MTU
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: ENCAPSULATION_TYPE
              values:
                - "None"
          env_vars:
            - name: VPC_SUBNETS
              value: '["172.16.101.0/24"]' # single subnet because no encapsulation is being used
            - name: NETWORK_MTU
              value: "9001"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/bpf-extnode-aws.yaml"

        - name: aws-iptables - 9k MTU
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: ENCAPSULATION_TYPE
              values:
                - "None"
          env_vars:
            - name: VPC_SUBNETS
              value: '["172.16.101.0/24"]' # single subnet because no encapsulation is being used
            - name: NETWORK_MTU
              value: "9001"
            - name: DATAPLANE
              value: "CalicoIptables"
            - name: E2E_TEST_CONFIG
              value: "e2e/config/bpf/xtables-extnode-aws.yaml"

      env_vars:
        - name: CLUSTER_NODES
          value: "3"
        # Single VPC only
        - name: VPC_SUBNETS
          value: '["172.16.101.0/24"]'
        - name: IPAM_TEST_POOL_SUBNET
          value: "10.0.0.0/29"
        - name: PROVISIONER
          value: aws-kubeadm
        - name: K8S_E2E_DOCKER_EXTRA_FLAGS
          value: --env NETWORK_MTU
        - name: ENABLE_EXTERNAL_NODE
          value: "true"

  # PAUSED (2026-08-06): this job focused a BPF ModeSwitch spec, which has no match in the
  # in-repo e2e suite. Pointed at the new suite it selects nothing and still
  # passes, so it is paused rather than converted. Uncomment when a mode-switch
  # spec lands in e2e/pkg/tests, or delete this block.
