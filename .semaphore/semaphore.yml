version: v1.0
name: Calico
# CI for master has moved to ArgoCI (see /.argoci).  Semaphore still triggers on
# master pushes and PRs, so this pipeline is a no-op.  Release branches keep
# their own generated pipeline.
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: No-op
    run:
      when: "false"
    dependencies: []
    task:
      jobs:
        - name: No-op
          commands:
            - echo "CI has moved to ArgoCI"
