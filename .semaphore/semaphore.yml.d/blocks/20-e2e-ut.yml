- name: "E2E unit tests"
  run:
    when: "${CHANGE_IN(e2e)}"
  execution_time_limit:
    minutes: 30
  dependencies:
    - Prerequisites
  task:
    env_vars:
      - name: BUILD_CACHE_GROUP
        value: "calico"
    prologue:
      commands:
        - cd e2e
    jobs:
      - name: "E2E unit tests: CI"
        commands:
          - ../.semaphore/run-and-monitor make-ci.log make ci
    epilogue:
      always:
        commands:
          - 'test-results publish --name "${SEMAPHORE_JOB_NAME}" ./report/*.xml || true'
