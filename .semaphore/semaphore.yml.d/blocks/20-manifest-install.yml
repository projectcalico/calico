- name: "Manifest install (KIND)"
  # Every other kind lane installs Calico through the operator, which renders
  # its own DaemonSet. Only this lane applies manifests/calico.yaml, so it is
  # the one that catches a manifest missing a piece the operator supplies.
  run:
    when: "${CHANGE_IN(third_party/cni-plugins,cni-plugin,non-go:/manifests/,non-go:/charts/calico/,non-go:/hack/test/kind/,non-go:/Makefile)}"
  dependencies:
    - Prerequisites
    - "Build: calico image"
    - "Build: node image"
    - "Build: third-party images"
  task:
    env_vars:
      - name: BUILD_CACHE_GROUP
        value: "calico"
    agent:
      machine:
        type: f1-standard-4
        os_image: ubuntu2204
    prologue:
      commands:
        - docker system prune -af
        - .semaphore/load-cached-images calico node
    jobs:
      - name: "Manifest install (KIND)"
        commands:
          - .semaphore/run-and-monitor manifest-install.log make kind-manifest-install-test
    epilogue:
      on_fail:
        commands:
          - KUBECONFIG=$(pwd)/hack/test/kind/kind-manifests-kubeconfig.yaml .semaphore/collect-kind-diags
