- name: E2E test set drift
  run:
    when: "${FORCE_RUN} or change_in(['/e2e/', '/.argoci/cron/', '/.semaphore/end-to-end/pipelines/'], {pipeline_file: 'ignore', exclude: ['/**/.gitignore', '/**/README.md', '/**/LICENSE']})"
  execution_time_limit:
    minutes: 30
  dependencies:
    - Prerequisites
  task:
    jobs:
      - name: "E2E test set drift: check-test-set"
        commands:
          - .semaphore/run-and-monitor e2e-check-test-set.log make -C e2e check-test-set
