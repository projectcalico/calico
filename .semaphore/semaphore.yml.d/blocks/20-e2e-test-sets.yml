- name: E2E test set drift
  run:
    when: "${CHANGE_IN(e2e,non-go:/e2e/config/,non-go:/.argoci/cron/,non-go:/.semaphore/end-to-end/pipelines/,non-go:/.semaphore/semaphore.yml.d/blocks/)}"
  execution_time_limit:
    minutes: 30
  dependencies:
    - Prerequisites
  task:
    env_vars:
      - name: BUILD_CACHE_GROUP
        value: calico
    jobs:
      - name: "E2E test set drift: check-test-set"
        commands:
          - .semaphore/run-and-monitor e2e-check-test-set.log make -C e2e check-test-set
