- name: Operator
  run:
    when: "${CHANGE_IN(operator)}"
  dependencies:
    - Prerequisites
  task:
    env_vars:
      - name: BUILD_CACHE_GROUP
        value: "calico"
    prologue:
      commands:
        - .semaphore/load-cached-images
        - cd operator
    jobs:
      - name: "Operator: static checks and unit tests"
        commands:
          - export TEST_SUITE_PREFIX="operator"
          - ../.semaphore/run-and-monitor make-ci.log make ci
    epilogue:
      always:
        commands:
          - 'test-results publish --ignore-missing ./report/*.xml --suite-prefix="$TEST_SUITE_PREFIX" --name "Operator" || true'

- name: "Operator: multi-arch build"
  # The operator has no cgo and no build constraints, so cross-compiling the
  # binary is the whole of the per-arch coverage. `make cd` and the release
  # build assemble the images.
  run:
    when: "${CHANGE_IN(operator)}"
  dependencies:
    - Prerequisites
  task:
    prologue:
      commands:
        - cd operator
    jobs:
      - name: "Operator: build multi-arch binaries"
        matrix:
          - env_var: ARCH
            values:
              - arm64
              - ppc64le
              - s390x
        commands:
          - ../.semaphore/run-and-monitor build-$ARCH.log make build ARCH=$ARCH

- name: "Operator FV"
  run:
    when: "${CHANGE_IN(operator)}"
  dependencies:
    - Prerequisites
    - "Build: calico image"
  task:
    env_vars:
      - name: BUILD_CACHE_GROUP
        value: "calico"
    prologue:
      commands:
        - .semaphore/load-cached-images
        - cd operator
    jobs:
      - name: "Operator: FV on kind"
        execution_time_limit:
          minutes: 60
        commands:
          - export TEST_SUITE_PREFIX="operator-fv"
          - ../.semaphore/run-and-monitor make-fv.log make fv
    epilogue:
      always:
        commands:
          - 'test-results publish --ignore-missing ./report/*.xml --suite-prefix="$TEST_SUITE_PREFIX" --name "Operator FV" || true'
