- name: confd
  run:
    when: "${CHANGE_IN(confd)}"
  dependencies:
    - Prerequisites
    - "Build: BIRD image"
  task:
    env_vars:
      - name: BUILD_CACHE_GROUP
        value: "calico"
    prologue:
      commands:
        # The FV tests check rendered configs with the BIRD in this image.
        - .argoci/scripts/load-rpms-image.sh bird amd64
        - cd confd
    jobs:
      - name: "confd: CI"
        execution_time_limit:
          minutes: 60
        commands:
          - ../.semaphore/run-and-monitor ci.log make ci
    epilogue:
      always:
        commands:
          - 'test-results publish --name "${SEMAPHORE_JOB_NAME}" ./report/*.xml || true'
