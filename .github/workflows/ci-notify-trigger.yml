# Stage 1 of the PR-approval Slack DM. Fires on review submission with zero
# permissions and no secrets. Sole purpose: fire a workflow_run event so the
# trusted stage 2 (ci-notify.yml) can do the real work from the base branch,
# where the Slack token exists.
#
# Why it takes two workflows: pull_request_review is pull-request-scoped, so
# GitHub runs the workflow file from refs/pull/N/merge — code carrying the PR
# author's own changes — and withholds every secret and repository variable
# from fork-PR runs, exactly as for pull_request. Measured on a fork PR here:
# "Secret source: None", with both the Slack token and CI_NOTIFY_MAP empty.
# Practically every calico PR comes from a fork, so a review-triggered
# workflow can never reach the token.
#
# The `if` below is a cost filter, NOT a trust boundary: this file comes from
# the PR head, so a fork PR can edit the condition away and make this job
# succeed on any review. It keeps stage 2 from starting for every comment
# review; stage 2 re-checks who approved, in trusted code, and that check is
# the one that counts.

# Referenced by name in ci-notify.yml's workflow_run trigger — renaming this
# silently stops approval DMs, with no error anywhere.
name: PR Slack notify (trigger)

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  trigger:
    # Approvals from someone with write access. Not load-bearing — see above.
    if: >-
      github.event.review.state == 'approved' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.review.author_association)
    runs-on: ubuntu-latest
    # Covers runner setup plus one echo; a slow "Set up job" must not become a
    # failed conclusion and a lost DM.
    timeout-minutes: 3
    steps:
      # Nothing downstream parses this: stage 2 re-derives the PR from the
      # triggering run's head sha and the reviewer from the API.
      # No '#' before $PR — in a plain YAML scalar " #" starts a comment and
      # would truncate the command mid-quote.
      - run: echo "Triggers PR Slack notify via workflow_run; PR $PR approved"
        env:
          PR: ${{ github.event.pull_request.number }}
