# Keep generated files in sync. Regenerates them (make generate) and opens or
# updates a single PR per branch carrying whatever drifted.
#
# Runs hourly, but a cheap drift check up front skips the heavy regen unless
# something actually changed: a recent merge or, on a release branch, an
# operator CRD update.
---
name: Sync upstream
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  discover-branches:
    if: github.repository == 'projectcalico/calico'
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
    steps:
      - name: Discover branches
        id: branches
        run: |
          # Get master + the three most recent release branches (by semver).
          # Three because the oldest of them still gets hashreleases, and those
          # gate on check-dirty.
          # Pipe to jq separately so --slurp combines all pages before filtering.
          # Using --jq with --paginate applies the filter per-page, which can
          # produce multiple JSON arrays and break $GITHUB_OUTPUT.
          branches=$(gh api repos/${{ github.repository }}/branches --paginate | jq -sc '
            [flatten[] | select(.name | test("^release-v[0-9]+\\.[0-9]+$")) | .name]
            | sort_by(ltrimstr("release-v") | split(".") | map(tonumber))
            | .[-3:]
            | ["master"] + .
          ')
          echo "branches=${branches}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  sync:
    needs: discover-branches
    runs-on: ubuntu-latest
    concurrency:
      group: sync-upstream-${{ matrix.branch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover-branches.outputs.branches) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          # Full history so generators that use git describe / changed-file
          # detection behave the same as a local checkout, and so the drift
          # check below can see recent commit timestamps.
          fetch-depth: 0

      - name: Check for drift
        id: drift
        run: |
          set -euo pipefail
          recent=false; operator=false

          force=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            force=true  # manual runs do the full work (handy for testing / forcing a sync)
          fi

          # recent: a merge could have changed generated output. The window stays
          # larger than the hourly cron interval so we never skip across a gap
          # between runs. Coarse on purpose -- we can't know what a merge touched,
          # so any merge means regenerate.
          if [ "$force" = true ] || [ -n "$(git log -1 --since='2 hours ago' --format=%H)" ]; then
            recent=true
          fi

          # operator: release branches curl the operator's CRDs from
          # tigera/operator, so they drift on the operator's schedule, not this
          # branch's. Master has no such target -- it builds them in tree. Probe
          # with SKIP_FIX_CHANGED so it stays Docker-free, then revert the
          # probe's writes; the real run redoes them.
          if grep -q '^get-operator-crds:' Makefile; then
            make get-operator-crds SKIP_FIX_CHANGED=true
            if [ "$force" = true ] || ! git diff --quiet; then
              operator=true
            fi
            git checkout -- .
          fi

          echo "drift: recent=$recent operator=$operator"
          {
            echo "recent=$recent"
            echo "operator=$operator"
          } >> "$GITHUB_OUTPUT"

      # make generate is the heavy step, so it only runs when something it
      # actually regenerates drifted.
      - name: Install tools
        if: steps.drift.outputs.recent == 'true' || steps.drift.outputs.operator == 'true'
        run: make bin/helm bin/yq

      # Only release branches have this target, and only some of them fold it
      # into generate, so run it explicitly. It has to come first either way:
      # gen-manifests reads the CRDs it writes.
      - name: Sync operator CRDs
        if: steps.drift.outputs.operator == 'true'
        run: make get-operator-crds

      - name: Regenerate
        if: steps.drift.outputs.recent == 'true' || steps.drift.outputs.operator == 'true'
        run: make generate

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.drift.outputs.recent == 'true' || steps.drift.outputs.operator == 'true'
        id: cpr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Sync upstream: generated files"
          branch: auto-sync-upstream-${{ matrix.branch }}
          base: ${{ matrix.branch }}
          title: "Auto: sync upstream into [${{ matrix.branch }}]"
          body: |
            Automated sync into `${{ matrix.branch }}`:

            - Operator CRDs pulled from `tigera/operator` (release branches only)
            - Regenerated files (`make generate`)

            Only the bits that actually drifted show up in the diff. Triggered by
            scheduled workflow.
          labels: auto-sync,docs-not-required,release-note-not-required,skip-bot-cherry-pick,merge-when-ready
          delete-branch: true

      # The PR author is github-actions[bot] (the GITHUB_TOKEN identity above), so
      # it can't approve its own PR, and the Actions token can't approve PRs anyway.
      # Approve as marvin-tigera (MARVIN_RENOVATE_PAT) so Marvin merges it once CI is
      # green. dismiss_stale_reviews is off, so one approval covers later updates.
      - name: Auto-approve so Marvin merges once CI passes
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.MARVIN_RENOVATE_PAT }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$(gh pr view "$PR" -R "$REPO" --json reviewDecision -q .reviewDecision)" = "APPROVED" ]; then
            echo "PR #$PR already approved; nothing to do."
            exit 0
          fi
          gh pr review "$PR" -R "$REPO" --approve

      # GitHub holds Actions runs on a PR pushed by github-actions[bot] in the
      # action_required state, which leaves the PR permanently unmergeable.
      # Release them as marvin-tigera.
      - name: Approve held workflow runs
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.MARVIN_RENOVATE_PAT }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(gh pr view "$PR" -R "$REPO" --json headRefOid -q .headRefOid)
          for _ in $(seq 1 6); do
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$sha" \
              --jq '.workflow_runs[] | select(.conclusion == "action_required") | .id')
            if [ -n "$runs" ]; then
              for id in $runs; do
                echo "Approving held run $id"
                gh api -X POST "repos/$REPO/actions/runs/$id/approve"
              done
              break
            fi
            echo "No held runs for $sha yet; waiting."
            sleep 10
          done
