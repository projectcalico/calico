# This workflow will perform the following checks:
# 1. Check the PR for a specific label (by default 'release-note-required'); if it's not there, exit
# 2. Check the PR body for a matching release-note code block; if missing, fail
# 3. Check the contents of the code block to ensure it's not empty or 'TBD'; otherwise, fail
# 4. Success!


#
# DO NOT EDIT THIS WORKFLOW IN ANY WAY
#
# THIS WORKFLOW USES pull_request_target, WHICH CAN BE A HUGE SECURITY GOTCHA
# AND LEAD TO LEAKED CREDENTIALS OR SUPPLY CHAIN ATTACKS. IT IS VERY DIFFICULT
# TO GUARANTEE SAFETY OF pull_request_target EVENTS.
#
# UNDER NO CIRCUMSTANCES DO ANY OF THE FOLLOWING:
#
# 1. ADD ANY OTHER SECRETS TO THIS JOB WHATSOEVER
# 2. ADD ANY OTHER PERMISSIONS TO THIS JOB WHATSOEVER
# 3. ADD ANY OTHER STEPS TO THIS JOB WHATSOEVER
#
# IF THERE IS ANYTHING THAT YOU THINK THIS WORKFLOW SHOULD ALSO DO, DO IT IN
# ANOTHER WORKFLOW! DO NOT EDIT THIS ONE EVER EVER.
#

name: Validate Release notes

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  checks: write

concurrency:
  group: release-notes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Release Notes
        uses: tigera/check-release-notes@main
        with:
          label-name: release-note-required
          github-token: ${{ secrets.GITHUB_TOKEN }}
