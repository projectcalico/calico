# Required repo secrets:
#   SEM_AI_TRIAGE_URL   — endpoint of the triage service
#   SEM_AI_TRIAGE_TOKEN — bearer token expected by the endpoint
#
# The workflow is a no-op if either secret is missing or the triage
# service is unreachable / errors out — it never fails noisily on a
# transient backend issue.
#
# Triages failed ArgoCI and Semaphore runs; Semaphore statuses are ignored where ArgoCI runs, as it is a no-op there.

name: sem-ai CI triage

on:
  status: {}
  workflow_dispatch:
    inputs:
      workflow_id:
        description: "Semaphore workflow_id (UUID); leave empty for an Argo run"
        required: false
        type: string
      argo_workflow:
        description: "ArgoCI workflow name, e.g. calico-14294-pr-lm9hx; leave empty for a Semaphore run"
        required: false
        type: string
      pr_number:
        description: "PR number to comment on"
        required: true
        type: number

# SHA-keyed for status events: a force-push gets a new SHA and runs in a
# separate group, so the old SHA's run is not cancelled. Acceptable here —
# each CI typically fires one status per (SHA, context), so the race is
# rare and a stale comment would be overwritten on the next failure anyway.
# The CI is in the key, so Semaphore's no-op status cannot cancel an ArgoCI triage.
concurrency:
  group: sem-ai-ci-triage-${{ github.event.context || (inputs.argo_workflow != '' && 'argo') || 'semaphore' }}-${{ inputs.pr_number || github.event.sha || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  triage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'status' &&
       (github.event.context == 'ci/semaphoreci/pr: Calico' ||
        github.event.context == 'continuous-integration/calico') &&
       (github.event.state == 'failure' || github.event.state == 'error'))
    runs-on: ubuntu-latest
    # argo-triage reads a run under an 8 minute budget.
    timeout-minutes: 12
    env:
      SEM_AI_TRIAGE_URL: ${{ secrets.SEM_AI_TRIAGE_URL }}
      SEM_AI_TRIAGE_TOKEN: ${{ secrets.SEM_AI_TRIAGE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Skip if secrets are not configured
        id: gate
        run: |
          if [[ -z "${SEM_AI_TRIAGE_URL}" || -z "${SEM_AI_TRIAGE_TOKEN}" ]]; then
            echo "::warning::SEM_AI_TRIAGE_URL or SEM_AI_TRIAGE_TOKEN secret missing — skipping triage"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve CI, run + pr_number from event
        id: resolve
        if: steps.gate.outputs.skip != 'true'
        env:
          INPUT_WID: ${{ inputs.workflow_id }}
          INPUT_ARGO: ${{ inputs.argo_workflow }}
          INPUT_PR: ${{ inputs.pr_number }}
          TARGET: ${{ github.event.target_url }}
          SHA: ${{ github.event.sha }}
          CONTEXT: ${{ github.event.context }}
        run: |
          # ArgoCI runs PRs into master, and branches cut from it, where it posts its own status.
          argo_runs() {
            local base argo
            base=$(gh api "repos/$REPO/pulls/$1" --jq .base.ref)
            argo=$(gh api "repos/$REPO/commits/$SHA/statuses?per_page=100" \
              --jq 'any(.[]; .context == "continuous-integration/calico")')
            [[ "$base" == master || "$argo" == true ]]
          }
          # The run id reaches the agent prompt, so it must match a strict pattern.
          UUID='^[0-9a-fA-F-]{36}$'
          ARGO_NAME='^[a-z0-9][a-z0-9.-]{0,252}$'
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "$INPUT_ARGO" && -n "$INPUT_WID" ]] || [[ -z "$INPUT_ARGO" && -z "$INPUT_WID" ]]; then
              echo "::error::set exactly one of workflow_id (Semaphore) or argo_workflow (ArgoCI)"
              exit 1
            fi
            if [[ -n "$INPUT_ARGO" ]]; then
              CI=argo RUN="$INPUT_ARGO"
            else
              CI=semaphore RUN="$INPUT_WID"
            fi
            PR="$INPUT_PR"
            SOURCE=workflow_dispatch
          else
            if [[ "$CONTEXT" == "continuous-integration/calico" ]]; then
              # ArgoCI links the run as .../public/wf/<workflow name>.
              CI=argo RUN=$(printf '%s' "$TARGET" | sed -nE 's|.*/public/wf/([a-z0-9.-]+).*|\1|p')
            else
              CI=semaphore RUN=$(printf '%s' "$TARGET" | sed -nE 's|.*/workflows/([0-9a-fA-F-]{36}).*|\1|p')
            fi
            # Use the search API rather than repos/$REPO/commits/$SHA/pulls:
            # the latter does not return PRs whose head commit lives on a
            # fork, and projectcalico/calico PRs all come from forks.
            PR=$(gh api "search/issues?q=sha:$SHA+is:pr+is:open+repo:$REPO" \
                   --jq '.items[0].number // empty')
            if [[ -z "$PR" ]]; then
              echo "::warning::no open PR for sha=$SHA — skipping (commit is likely on a branch with no open PR)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$CI" == semaphore ]] && argo_runs "$PR"; then
              echo "::notice::ArgoCI runs this PR; Semaphore's status is a no-op — skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            SOURCE="status:$CONTEXT:${{ github.event.state }}"
          fi
          PATTERN=$UUID
          [[ "$CI" == argo ]] && PATTERN=$ARGO_NAME
          if [[ ! "$RUN" =~ $PATTERN ]]; then
            echo "::warning::no valid $CI run in the dispatch input or target_url='$TARGET' — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$PR" =~ ^[0-9]+$ ]]; then
            echo "::warning::pr_number must be numeric — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "ci=$CI"
            echo "run=$RUN"
            echo "pr=$PR"
            echo "source=$SOURCE"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch PR title + body
        if: steps.gate.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true'
        run: |
          gh api "repos/$REPO/pulls/${{ steps.resolve.outputs.pr }}" \
            --jq '{title: .title, body: .body}' > pr.json
          echo "PR #${{ steps.resolve.outputs.pr }} : $(jq -r .title pr.json)"
          echo "body length: $(jq -r '.body|length' pr.json) chars"
          echo "trigger: ${{ steps.resolve.outputs.source }}"
          echo "run: ${{ steps.resolve.outputs.ci }} ${{ steps.resolve.outputs.run }}"

      - name: Call sem-ai triage service
        id: triage
        if: steps.gate.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true'
        env:
          CI: ${{ steps.resolve.outputs.ci }}
          RUN: ${{ steps.resolve.outputs.run }}
        run: |
          KIND="Semaphore workflow"
          [[ "$CI" == argo ]] && KIND="Argo workflow"
          PROMPT=$(jq -n --slurpfile pr pr.json --arg kind "$KIND" --arg wf "$RUN" '
            "Triage " + $kind + " " + $wf + ".\n\n" +
            "PR title: " + $pr[0].title + "\n\n" +
            "PR description:\n" + ($pr[0].body // "")')

          jq -n --arg p "$PROMPT" --arg mid "gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{
            jsonrpc: "2.0",
            id: 1,
            method: "message/send",
            params: {
              message: {
                messageId: $mid,
                role: "user",
                parts: [{kind: "text", text: $p}]
              },
              configuration: { returnImmediately: false }
            }
          }' > req.json

          # Soft-skip if the triage service is unreachable / errors out.
          # The PoC backend is best-effort — never fail the workflow on
          # a transient backend issue and never post a half-broken comment.
          set +e
          HTTP=$(curl -sS --max-time 600 -o resp.json -w '%{http_code}' \
            "$SEM_AI_TRIAGE_URL" \
            -H "Authorization: Bearer $SEM_AI_TRIAGE_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @req.json)
          CURL_RC=$?
          set -e
          if [[ $CURL_RC -ne 0 || "$HTTP" != "200" ]]; then
            echo "::warning::triage service unreachable or errored (curl_rc=$CURL_RC, http=$HTTP) — skipping comment for this run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tolerate non-JSON / unexpected payloads — fall through to the
          # empty-file skip below rather than aborting the step.
          set +e
          jq -r '
            .result.artifacts[0].parts[0].text //
            .result.message.parts[0].text //
            empty
          ' resp.json > triage.md
          set -e

          if [[ ! -s triage.md ]]; then
            echo "::warning::empty or malformed triage response — skipping comment for this run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "--- triage ---"
          cat triage.md

      - name: Upsert PR comment (skip on PASS)
        if: >-
          steps.gate.outputs.skip != 'true' &&
          steps.resolve.outputs.skip != 'true' &&
          steps.triage.outputs.skip != 'true'
        run: |
          BODY=$(cat triage.md)
          if [[ "$BODY" == "PASS — no comment needed" ]]; then
            echo "PASS — no comment to post"
            exit 0
          fi

          MARKER="<!-- sem-ai-ci-triage -->"
          FULL_BODY="$MARKER"$'\n'"$BODY"
          PR=${{ steps.resolve.outputs.pr }}

          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\")))][0].id")

          PAYLOAD=$(jq -n --arg b "$FULL_BODY" '{body: $b}')

          if [[ -n "$EXISTING" && "$EXISTING" != "null" ]]; then
            echo "editing existing comment $EXISTING"
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" --input - <<<"$PAYLOAD"
          else
            echo "posting new comment on PR #$PR"
            gh api -X POST "repos/$REPO/issues/$PR/comments" --input - <<<"$PAYLOAD"
          fi

  # When CI goes green, delete any stale failure-analysis comment left by an
  # earlier failed run. The triage job only ever upserts on failure/error, so
  # without this a now-passing PR keeps showing an obsolete failure report.
  # Mutually exclusive with `triage`: that job requires failure/error, this
  # one requires success, so exactly one runs per status event.
  # Semaphore's no-op pass where ArgoCI runs must not delete ArgoCI's analysis.
  cleanup:
    if: >-
      github.event_name == 'status' &&
      (github.event.context == 'ci/semaphoreci/pr: Calico' ||
       github.event.context == 'continuous-integration/calico') &&
      github.event.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.sha }}
      CONTEXT: ${{ github.event.context }}
    steps:
      - name: Resolve PR from SHA
        id: resolve
        run: |
          # Fork-aware lookup — see the triage job for the rationale.
          PR=$(gh api "search/issues?q=sha:$SHA+is:pr+is:open+repo:$REPO" \
                 --jq '.items[0].number // empty')
          if [[ -z "$PR" ]]; then
            echo "::notice::no open PR for sha=$SHA — nothing to clean up"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$CONTEXT" == "ci/semaphoreci/pr: Calico" ]]; then
            BASE=$(gh api "repos/$REPO/pulls/$PR" --jq .base.ref)
            ARGO=$(gh api "repos/$REPO/commits/$SHA/statuses?per_page=100" \
              --jq 'any(.[]; .context == "continuous-integration/calico")')
            if [[ "$BASE" == master || "$ARGO" == true ]]; then
              echo "::notice::ArgoCI runs this PR; Semaphore's pass is a no-op — skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Delete stale sem-ai-triage comment
        if: steps.resolve.outputs.skip != 'true'
        env:
          PR: ${{ steps.resolve.outputs.pr }}
        run: |
          MARKER="<!-- sem-ai-ci-triage -->"
          IDS=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\")))][].id")
          if [[ -z "$IDS" ]]; then
            echo "no sem-ai-triage comment on PR #$PR — nothing to delete"
            exit 0
          fi
          # Best-effort: a transient delete failure must not fail the workflow.
          for ID in $IDS; do
            echo "deleting stale triage comment $ID on PR #$PR"
            gh api -X DELETE "repos/$REPO/issues/comments/$ID" \
              || echo "::warning::failed to delete comment $ID (continuing)"
          done
