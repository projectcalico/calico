# Detection half of a two-workflow cascade that DMs a PR author when their
# PR is approved. Delivery lives in ci-notify.yml.
#
# Why it takes two workflows: pull_request_review is a pull-request-scoped
# event, so GitHub runs the workflow file from refs/pull/N/merge — code that
# contains the PR author's own changes — and therefore withholds every
# secret from fork-PR runs and hands out a read-only token, exactly as it
# does for pull_request. Practically every calico PR comes from a fork, so a
# review-triggered workflow can never reach the Slack bot token.
#
# This half owns the trigger and needs no secrets: all it does is finish
# successfully, which fires a workflow_run event that ci-notify.yml consumes.
# workflow_run is repository-level, like `status`, so that run uses the
# default branch's copy of the workflow and does get the repo's secrets.
#
# The conclusion is the entire output: success means "a collaborator approved
# a PR, go notify its author", skipped means "nothing to do".

name: PR approval detected

on:
  pull_request_review:
    types: [submitted]

# Nothing here reads or writes the repository. Fork-PR runs get a read-only
# token whatever this says; declaring none keeps the intent explicit.
permissions: {}

jobs:
  approved:
    # Approvals only — 'commented' and 'changes_requested' already reach the
    # author through GitHub's own notifications, and a comment review would
    # be a firehose. And only from someone with write access: on a public
    # repo any account can submit an approving review, and each one would
    # otherwise produce its own DM.
    if: >-
      github.event.review.state == 'approved' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.review.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # This line exists to make the run readable when debugging. Nothing
      # downstream parses it: ci-notify.yml re-derives the PR from the
      # triggering run's head sha and reads the reviewer from the API.
      - name: Note the approval
        env:
          PR: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ github.event.review.user.login }}
        # No '#' before $PR: this is a plain YAML scalar, where " #" would
        # start a comment and truncate the command mid-quote.
        run: echo "PR $PR approved by $REVIEWER"
