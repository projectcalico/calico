# Stage 1 of the auto-pick: a zero-permission trigger. It runs on push to
# master (never held for approval, unlike a fork's pull_request event) and does
# nothing but complete, so the privileged worker can start via workflow_run from
# the trusted default branch. The worker needs a workflow_run event because
# claude-code-action rejects a raw `push` event.
name: Auto-pick OSS PR into Enterprise (trigger)

on:
  push:
    branches: [master]

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.sha }}
    steps:
      - run: echo "master advanced to ${HEAD_SHA}; stage-2 runs via workflow_run"
