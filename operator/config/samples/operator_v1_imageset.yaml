# This sample is also the ImageSet entry in the OpenShift bundle's alm-examples
# annotation (see hack/gen-bundle/manifests.go), so OperatorHub offers it as a
# "Create instance" form. It is deliberately inert: the name below matches no
# variant the operator looks for, and the digests are placeholders.
#
# A real ImageSet is named "<variant>-<release>", where <variant> is "calico" or
# "enterprise" and <release> is the version of that variant the operator
# deploys - e.g. calico-v3.30.0. Do not name this sample that way: the operator
# would then either adopt these placeholder digests or, for any other name
# starting with the variant prefix, degrade the Installation because no ImageSet
# with the expected name exists.
apiVersion: operator.tigera.io/v1
kind: ImageSet
metadata:
  name: example-v1.23.4
spec:
  images:
    - image: calico/node
      digest: sha256:caba5b4d0e3bcf9b0d4b1b0b3b1a4a6a2c9e6f0f5d3d2c1b0a9f8e7d6c5b4a39
    - image: calico/cni
      digest: sha256:1f2e3d4c5b6a798877665544332211ffeeddccbbaa99887766554433221100ff
    - image: calico/typha
      digest: sha256:3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b
    - image: calico/kube-controllers
      digest: sha256:9a8b7c6d5e4f30211f2e3d4c5b6a79880011223344556677889900aabbccddee
    - image: calico/operator
      digest: sha256:0011223344556677889900aabbccddeeff102030405060708090a0b0c0d0e0f1
