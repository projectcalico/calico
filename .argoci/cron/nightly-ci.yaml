# Nightly run of every CI lane, whatever changed: a cron ignores its modules'
# gates, and drops the CI workflow's.
version: condensed
generateName: calico-nightly-
extends: .argoci/ciworkflow.yaml

# Off the hour, so it does not land with every other repo's.
schedule: 30 0 * * *

timeout: 6h

# Without the CI workflow's persist: a snapshot only ever seeds a PR's next run.
cache:
  strategy: shared
  size: 32Gi
  storageClass: premium-rwo
