# Condensed ArgoCI e2e workflow; cc-argoci-handler expands it into a CronWorkflow at runtime.
# Migrated from the Semaphore e2e pipeline of the same name — maintained here by hand.
version: condensed
generateName: e2e-iptables-
schedule: 10 21 * * 4
globalPrologue: |
  cd "${CI_HOME}/${CI_GIT_DIR}"
  export ARGO_WORKFLOW_NAME="{{workflow.name}}"
  export ARGO_WORKFLOW_UID="{{workflow.uid}}"
  export DATAPLANE="${DATAPLANE:-CalicoIptables}"
  export FUNCTIONAL_AREA="${FUNCTIONAL_AREA:-iptables.yml}"
  export IPV4_POD_CIDR="${IPV4_POD_CIDR:-192.168.0.0/16}"
  export PRIVATE_REGISTRY="${PRIVATE_REGISTRY:-quay.io/}"
  export USE_PRIVATE_REGISTRY="${USE_PRIVATE_REGISTRY:-true}"
  source .argoci/scripts/global_prologue.sh
globalEpilogue: |
  source "${CI_HOME}/${CI_GIT_DIR}/.argoci/scripts/global_epilogue.sh"
defaults:
  secretBundles:
    - banzai-secrets
    - {name: sandcat-nightly, keys: [{name: SANDCAT_GEMINI_KEY}]}
    - {name: sandcat-db, keys: [{name: SANDCAT_DB_URL}, {name: SANDCAT_DB_TOKEN}]}
    - {name: sandcat-download, keys: [{name: SANDCAT_BIN_DOWNLOAD_TOKEN}]}
steps:
  - name: autohep-test
    jobSize: large
    services:
      - docker
      - http-cache-proxy
    env:
      - name: E2E_TEST_CONFIG
        value: e2e/config/iptables/xtables-autohep.yaml
      - name: ENABLE_AUTOHEP
        value: "true"
      # Manifests carry admissionregistration.k8s.io/v1 MutatingAdmissionPolicy,
      # which Kubernetes serves from 1.36; the default stable-3 can't apply them.
      - name: K8S_VERSION
        value: stable-1
      - name: PROVISIONER
        value: local-kind
    commands: |
      .argoci/scripts/body_standard.sh
  - name: wireguard-regression-k8s-e2e-kdd-old
    services:
      - docker
      - http-cache-proxy
    env:
      - name: DISABLE_IPIP
        value: "true"
      - name: ENABLE_WIREGUARD
        value: "true"
      - name: IPAM_TEST_POOL_SUBNET
        value: 10.0.0.0/29
      - name: E2E_TEST_CONFIG
        value: e2e/config/iptables/xtables-v3crd-aws.yaml
      - name: PROVISIONER
        value: aws-kubeadm
      - name: USE_API_SERVER
        value: "false"
      - name: USE_HASH_RELEASE
        value: "true"
      - name: VPC_SUBNETS
        value: '["172.16.101.0/24"]'
    matrix:
      # Manifests carry admissionregistration.k8s.io/v1 MutatingAdmissionPolicy,
      # which Kubernetes serves from 1.36.
      - name: stable-1
        env:
          - name: K8S_VERSION
            value: stable-1
    commands: |
      .argoci/scripts/body_standard.sh
  - name: distro-support
    services:
      - docker
      - http-cache-proxy
    env:
      - name: E2E_TEST_CONFIG
        value: e2e/config/iptables/xtables-encap-nobgp.yaml
      - name: CLUSTER_ROUTING_MODE
        value: Felix
      # Manifests carry admissionregistration.k8s.io/v1 MutatingAdmissionPolicy,
      # which Kubernetes serves from 1.36; the default stable-3 can't apply them.
      - name: K8S_VERSION
        value: stable-1
    # Each cell pins its Calico API mode: left unset, 1.36 defaults to v3 CRD mode,
    # but the manifest installer still applies the v1-CRD calico.yaml. Ubuntu
    # covers the calicoctl-pod mode, the rest the aggregated API server.
    matrix:
      - name: ubuntu-2404-lts-gcp-kubeadm
        env:
          - name: CLUSTER_IMAGE
            value: ubuntu-2404-lts-amd64
          - name: PROVISIONER
            value: gcp-kubeadm
          - name: CALICOCTL_INSTALL_TYPE
            value: k8s-pod
          - name: E2E_TEST_CONFIG
            value: e2e/config/iptables/xtables-encap-nobgp-calicoctl.yaml
          - name: USE_API_SERVER
            value: "false"
      - name: ubuntu-2204-lts-gcp-kubeadm
        env:
          - name: CLUSTER_IMAGE
            value: ubuntu-2204-lts
          - name: PROVISIONER
            value: gcp-kubeadm
          - name: CALICOCTL_INSTALL_TYPE
            value: k8s-pod
          - name: E2E_TEST_CONFIG
            value: e2e/config/iptables/xtables-encap-nobgp-calicoctl.yaml
          - name: USE_API_SERVER
            value: "false"
      - name: rhel-10-gcp-kubeadm
        env:
          - name: CLUSTER_IMAGE
            value: rhel-10
          - name: PROVISIONER
            value: gcp-kubeadm
          - name: USE_API_SERVER
            value: "true"
      - name: centos-stream-9-gcp-kubeadm
        env:
          - name: CLUSTER_IMAGE
            value: centos-stream-9
          - name: PROVISIONER
            value: gcp-kubeadm
          - name: USE_API_SERVER
            value: "true"
      - name: rhel-9-gcp-kubeadm
        env:
          - name: CLUSTER_IMAGE
            value: rhel-9
          - name: PROVISIONER
            value: gcp-kubeadm
          - name: USE_API_SERVER
            value: "true"
      - name: rocky-linux-8-gcp-kubeadm
        env:
          - name: CLUSTER_IMAGE
            value: rocky-linux-8
          - name: PROVISIONER
            value: gcp-kubeadm
          - name: USE_API_SERVER
            value: "true"
    commands: |
      .argoci/scripts/body_standard.sh
