# Renovate for this repo. One run from master covers every branch: Renovate's
# own config names the release branches it opens PRs against.
version: condensed
generateName: renovate-

schedule: 0 1 * * 2,5

notifications:
  slack:
    channel: ci-notifications-os
    when: failure
    includeFailedSteps: true

steps:
  - name: renovate
    # Renovate runs go itself, at the version the repo builds with.
    useGoBuild: true
    timeout: 2h
    jobSize: medium
    requests: {cpu: "4", memory: 8Gi}
    secretBundles:
      - marvin-github-token
    env:
      - {name: RENOVATE_REPOSITORIES, value: projectcalico/calico}
      - {name: RENOVATE_ALLOWED_COMMANDS, value: '["^make gen-deps-files$", "^make regen-thirdparty-dep-patches$"]'}
      # Must match the author on Renovate's existing branches, or it treats them
      # as hand-edited and stops updating them.
      - {name: RENOVATE_GIT_AUTHOR, value: "marvin-tigera <marvin-tigera@users.noreply.github.com>"}
      # Renovate strips the environment its commands run with, so this is how
      # the make targets see them. GOMAXPROCS: they size -j from it, not the
      # node's cores. NATIVE_GO_BUILD: build here rather than in a nested
      # go-build container, as this pod has no docker.
      - {name: RENOVATE_CUSTOM_ENV_VARIABLES, value: '{"GOMAXPROCS": "4", "NATIVE_GO_BUILD": "true"}'}
      - {name: LOG_LEVEL, value: info}
    commands: |
      set -o pipefail

      # A release branch cut from master carries this file and deploys its own
      # copy; only master's schedule should fire, or each run is doubled. An
      # on-demand run from a PR is not a scheduled fire, so it goes ahead.
      if [ "${CI_GIT_REF_TYPE}" = NIGHTLY ] && [ "${CI_GIT_BRANCH}" != master ]; then
        echo "Renovate runs from master only; skipping on ${CI_GIT_BRANCH}."
        exit 0
      fi

      # The image has no Node.
      node_url=https://nodejs.org/dist/latest-v24.x
      cd "$(mktemp -d)"
      curl -fsSLO "${node_url}/SHASUMS256.txt"
      node_tar=$(awk '/linux-x64\.tar\.xz$/ {print $2}' SHASUMS256.txt)
      curl -fsSLO "${node_url}/${node_tar}"
      grep " ${node_tar}\$" SHASUMS256.txt | sha256sum -c -
      mkdir -p "${HOME}/node"
      tar -xJf "${node_tar}" --strip-components=1 -C "${HOME}/node"
      export PATH="${HOME}/node/bin:${PATH}"
      npm install -g renovate@43

      # A redirect on the push drops the credentials Renovate puts in the URL;
      # git still asks a helper for the redirected host.
      echo "HTTPS_PROXY=${HTTPS_PROXY:-unset} https_proxy=${https_proxy:-unset}"
      git config --global credential.https://github.com.helper store
      printf 'https://x-access-token:%s@github.com\n' "${MARVIN_GITHUB_TOKEN}" > "${HOME}/.git-credentials"
      chmod 600 "${HOME}/.git-credentials"

      RENOVATE_TOKEN="${MARVIN_GITHUB_TOKEN}" renovate --platform=github --autodiscover=false
