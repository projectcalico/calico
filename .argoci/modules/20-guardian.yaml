# guardian `make ci`.
version: condensed-module

defaults:
  timeout: 30m
  # In the build image, with NATIVE_GO_BUILD running each recipe in place rather
  # than in a nested container.
  useGoBuild: true
  # The image ships tools under /go/bin, which the default /go volume hides.
  workspaceVolumes: none

steps:
  - name: guardian-ci
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    depends: [check-go, go-cache]
    requests: {cpu: 3000m, memory: 3Gi}
    cache:
      - {name: go, mode: read, path: /cache/go}
    commands: |
      go_env=$("${CI_HOME}/${CI_GIT_DIR}/.argoci/scripts/restore-go-cache" guardian-ci) || exit 1; eval "$go_env"
      cd guardian
      make ci
    epilogue: |
      # Epilogues don't inherit the commands' `cd` or exports.
      cd "${CI_HOME}/${CI_GIT_DIR}/guardian"
      artifact push job report --destination test-results || true
