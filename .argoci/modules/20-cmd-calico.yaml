# Unit tests for the combined calico binary.
version: condensed-module

defaults:
  timeout: 1h
  # In the build image directly, saving a nested container and a second pull.
  useGoBuild: true

steps:
  - name: cmd-calico-ut
    # TEMPORARY: pins the step to the go-build cache pool until the handler does it.
    override:
      nodeSelector: {role: argoci, size: medium, go-build-version: 1.27.3-llvm21.1.8-k8s1.37.1-1}
      tolerations: [{key: argoci, operator: Exists}, {key: argoci-medium, operator: Exists}, {key: argoci-cached-images, operator: Exists}]
    env:
      # TEMPORARY: the thread pool the old 7250m request gave, while the
      # request drops to the measured average.
      - name: GOMAXPROCS
        value: "7"
      - name: BUILD_CACHE_GROUP
        value: calico
    depends: [check-go]
    requests: {cpu: 5750m, memory: 3.5Gi}
    # The image ships tools under /go/bin, which the default /go volume hides.
    workspaceVolumes: none
    commands: |
      cd cmd/calico
      # Empty wrappers run each recipe here rather than in a nested container.
      make ut DOCKER_GO_BUILD= DOCKER_RUN= CALICO_BUILD=
