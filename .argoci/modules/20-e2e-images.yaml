# CI for the e2e helper images; only rapidclient has any.
version: condensed-module

defaults:
  timeout: 1h
  # In the build image directly, saving a nested container and a second pull.
  useGoBuild: true

steps:
  - name: e2e-images-rapidclient-ci
    # TEMPORARY: pins the step to the go-build cache pool until the handler does it.
    override:
      nodeSelector: {role: argoci, spot: "false", go-build-version: 1.27.3-llvm21.1.8-k8s1.37.1-1}
      tolerations: [{key: argoci, operator: Exists}, {key: argoci-nonspot, operator: Exists}, {key: argoci-cached-images, operator: Exists}]
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
    jobSize: small
    requests: {cpu: 2750m, memory: 548Mi}
    # The image ships tools under /go/bin, which the default /go volume hides.
    workspaceVolumes: none
    commands: |
      # Empty wrappers run each recipe here rather than in a nested container.
      make -C e2e/images/rapidclient ci DOCKER_GO_BUILD= DOCKER_RUN= CALICO_BUILD=
