# envoy-proxy CI. It repackages an upstream image, so there is no binary to
# cross-build.
version: condensed-module

defaults:
  timeout: 30m
  secretBundles: [banzai-secrets]

steps:
  - name: envoy-proxy-ci
    checkout: true
    runOnVM:
      createVM:
        machineType: e2-standard-4
      source: |
        set -e
        repo="$(pwd)"
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        cd third_party/envoy-proxy
        make ci

  # The CI step already builds amd64.
  - name: envoy-proxy-image
    matrix:
      - name: arm64
        env: [{name: ARCH, value: arm64}]
    checkout: true
    runOnVM:
      createVM:
        machineType: e2-standard-4
      env: [ARCH]
      source: |
        set -e
        repo="$(pwd)"
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        cd third_party/envoy-proxy
        make image ARCH=$ARCH
