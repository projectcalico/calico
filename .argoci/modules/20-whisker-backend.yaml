# whisker-backend `make ci`.
version: condensed-module

defaults:
  timeout: 30m
  # In the build image directly, saving a nested container and a second pull.
  useGoBuild: true

steps:
  - name: whisker-backend-ci
    depends: [check-go]
    requests: {cpu: 3250m, memory: 1.5Gi}
    goCache: read
    commands: |
      cd whisker-backend
      # Empty wrappers run each recipe here rather than in a nested container.
      make ci DOCKER_GO_BUILD= DOCKER_RUN= CALICO_BUILD=
    reports: [whisker-backend/report:test-results]
