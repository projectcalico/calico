# cni-plugin CI. On a VM because the dataplane tests create netkit devices,
# which the pod nodes' image has no driver for.
version: condensed-module

defaults:
  timeout: 1h
  # The compute SA createVM, runOnVM and the teardown authenticate with.
  secretBundles: [banzai-secrets]

steps:
  - name: cni-plugin-ci
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
    depends: [build-calico-image, check-go, go-cache]
    checkout: true
    cache:
      - {name: calico-image-zst, mode: read, path: /cache/calico-image-zst}
      - {name: go, mode: read, path: /cache/go}
    runOnVM:
      createVM:
        machineType: e2-standard-8
      env: [BUILD_CACHE_GROUP]
      put:
        - /cache/calico-image-zst:prefetched
        - /cache/go/go-mod.tar.gz:.go-mod/go-mod.tar.gz
      source: |
        set -e
        .argoci/scripts/restore-go-cache cni-plugin-ci ~/.go-mod
        repo="$(pwd)"
        # There is no epilogue on a machine; results go up on the way out.
        finish() {
          rc=$?
          # Skipped specs are reported as failures otherwise.
          python3 "$repo/hack/strip-skipped-tests.py" "$repo"/cni-plugin/report/*.xml 2>/dev/null || true
          artifact push job "$repo/cni-plugin/report" --destination test-results || true
          exit $rc
        }
        trap finish EXIT
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        export PREFETCHED_ARTIFACTS="${HOME}/prefetched"
        .argoci/scripts/load-cached-images calico
        cd cni-plugin
        make ci-no-prereqs
