# cni-plugin CI. On a VM because the dataplane tests create netkit devices,
# which the pod nodes' image has no driver for.
version: condensed-module

defaults:
  timeout: 1h

steps:
  - name: cni-plugin-ci
    depends: [build-calico-image, check-go]
    cache:
      - {name: calico-image, mode: read, path: /cache/calico-image}
    checkout: true
    goCache: read
    reports: [cni-plugin/report:test-results]
    runOnVM:
      createVM:
        # The cache disk's project and zone: a disk attaches only to a machine
        # in both. A stockout there falls back across families.
        machineTypes: [e2-standard-8, n2d-standard-8, n2-standard-8, c2d-standard-8]
        project: tigera-cc-dev
        zones: [us-central1-a]
        vmImageProject: unique-caldron-775
      project: tigera-cc-dev
      put:
        - /cache/calico-image/calico.tar:calico-build/calico.tar
      source: |
        set -euo pipefail
        # Before the reports are pushed: skipped specs are reported as failures
        # otherwise.
        strip_skipped() {
          python3 "${repo:-.}/hack/strip-skipped-tests.py" "${repo:-.}"/cni-plugin/report/*.xml 2>/dev/null || true
        }
        trap strip_skipped EXIT
        go_env=$(.argoci/scripts/vm-go-cache cni-plugin-ci) || exit 1
        eval "$go_env"
        repo=$PWD
        export CALICO_IMAGE_TAR="$HOME/calico-build/calico.tar"
        .argoci/scripts/load-cached-images calico
        cd cni-plugin
        make ci-no-prereqs
