# goldmane `make ci`.
version: condensed-module

defaults:
  timeout: 30m
  # In the build image directly, saving a nested container and a second pull.
  useGoBuild: true
  # The image ships tools under /go/bin, which the default /go volume hides.
  workspaceVolumes: none

steps:
  - name: goldmane-ci
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
      - name: NATIVE_GO_BUILD
        value: "true"
    depends: [check-go]
    requests: {cpu: 4000m, memory: 2.75Gi}
    commands: |
      # The protobuf recipe can wrongly judge this stale; the pre-flight checks
      # already prove it is not.
      touch goldmane/proto/api.pb.go
      cd goldmane
      make ci
    epilogue: |
      # Epilogues don't inherit the commands' `cd` or exports.
      cd "${CI_HOME}/${CI_GIT_DIR}/goldmane"
      artifact push job report --destination test-results || true
