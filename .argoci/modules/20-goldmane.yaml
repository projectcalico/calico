# goldmane `make ci`.
version: condensed-module

defaults:
  timeout: 30m
  # In the build image, with NATIVE_GO_BUILD running each recipe in place rather
  # than in a nested container.
  useGoBuild: true

steps:
  - name: goldmane-ci
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    depends: [check-go]
    requests: {cpu: 4000m, memory: 3.5Gi}
    goCache: read
    commands: |
      # The protobuf recipe can wrongly judge this stale; the pre-flight checks
      # already prove it is not.
      touch goldmane/proto/api.pb.go
      cd goldmane
      make ci
    reports: [goldmane/report:test-results]
