# calicoctl `make ci`.
version: condensed-module

defaults:
  timeout: 1h
  services:
    - docker

steps:
  - name: calicoctl-ci
    env:
      # TEMPORARY: the thread pool the old 3000m request gave, while the
      # request drops to the measured average.
      - name: GOMAXPROCS
        value: "3"
      - name: BUILD_CACHE_GROUP
        value: calico
    depends: [check-go]
    requests: {cpu: 2000m, memory: 3.5Gi}
    commands: |
      cd calicoctl
      make ci
    epilogue: |
      # Epilogues don't inherit the commands' `cd` or exports.
      cd "${CI_HOME}/${CI_GIT_DIR}/calicoctl"
      artifact push job report --destination test-results || true
