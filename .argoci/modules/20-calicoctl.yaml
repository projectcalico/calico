# calicoctl `make ci`.
version: condensed-module

defaults:
  timeout: 1h
  services:
    - docker

steps:
  - name: calicoctl-ci
    depends: [check-go]
    requests: {cpu: 3000m, memory: 3.5Gi}
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      cd calicoctl
      make ci
    epilogue: |
      # Epilogues don't inherit the commands' `cd` or exports.
      cd "${CI_HOME}/${CI_GIT_DIR}/calicoctl"
      artifact push job report --destination test-results || true
