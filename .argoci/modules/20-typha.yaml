# Typha CI, and its FVs again on a UBI-minimal base. On VMs because the k8sfv
# run loads ip6_tables, which a pod cannot.
version: condensed-module

defaults:
  timeout: 1h
  # The compute SA createVM, runOnVM and the teardowns authenticate with.
  secretBundles: [banzai-secrets]

steps:
  - name: typha-ci
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
    depends: [build-calico-image, check-go, go-cache]
    checkout: true
    cache:
      - {name: calico-image-zst, mode: read, path: /cache/calico-image-zst}
      - {name: go, mode: read, path: /cache/go}
    runOnVM:
      createVM:
        machineType: e2-standard-8
      env: [BUILD_CACHE_GROUP]
      put:
        - /cache/calico-image-zst:prefetched
        - /cache/go/go-mod.tar.gz:.go-mod/go-mod.tar.gz
      source: |
        set -e
        .argoci/scripts/restore-go-cache typha-ci ~/.go-mod
        repo="$(pwd)"
        # There is no epilogue on a machine; results go up on the way out.
        finish() {
          rc=$?
          artifact push job "$repo/typha/report" --destination test-results || true
          artifact push job "$repo/felix/report" --destination test-results-felix || true
          exit $rc
        }
        trap finish EXIT
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        export PREFETCHED_ARTIFACTS="${HOME}/prefetched"
        .argoci/scripts/load-cached-images calico
        cd typha
        make ci-no-prereqs

  # Depends on the producer only to skip a commit whose first build failed;
  # `clean` discards the cached image anyway.
  - name: typha-fv-ubi
    tiers: []
    depends: [build-calico-image, check-go, go-cache]
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
      - name: USE_UBI_AS_CALICO_BASE
        value: "1"
    checkout: true
    cache:
      - {name: go, mode: read, path: /cache/go}
    runOnVM:
      createVM:
        machineType: e2-standard-8
      env: [BUILD_CACHE_GROUP, USE_UBI_AS_CALICO_BASE]
      put:
        - /cache/go/go-mod.tar.gz:.go-mod/go-mod.tar.gz
      source: |
        set -e
        .argoci/scripts/restore-go-cache typha-fv-ubi ~/.go-mod
        repo="$(pwd)"
        # There is no epilogue on a machine; results go up on the way out.
        finish() {
          rc=$?
          artifact push job "$repo/typha/report" --destination test-results-ubi || true
          artifact push job "$repo/felix/report" --destination test-results-ubi-felix || true
          exit $rc
        }
        trap finish EXIT
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        make -C cmd/calico clean image
        cd typha
        make fv-no-prereqs
