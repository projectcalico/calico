# Typha CI, and its FVs again on a UBI-minimal base. On VMs because the k8sfv
# run loads ip6_tables, which a pod cannot.
version: condensed-module

defaults:
  timeout: 1h

steps:
  - name: typha-ci
    depends: [build-calico-image, check-go]
    cache:
      - {name: calico-image, mode: read, path: /cache/calico-image}
    checkout: true
    goCache: read
    reports: [typha/report:test-results, felix/report:test-results-felix]
    runOnVM:
      createVM:
        # The cache disk's project and zone: a disk attaches only to a machine
        # in both. A stockout there falls back across families.
        machineTypes: [e2-standard-8, n2d-standard-8, n2-standard-8, c2d-standard-8]
        project: tigera-cc-dev
        zones: [us-central1-a]
        vmImageProject: unique-caldron-775
      project: tigera-cc-dev
      put:
        - /cache/calico-image/calico.tar:calico-build/calico.tar
      source: |
        set -euo pipefail
        go_env=$(.argoci/scripts/vm-go-cache typha-ci) || exit 1
        eval "$go_env"
        export CALICO_IMAGE_TAR="$HOME/calico-build/calico.tar"
        .argoci/scripts/load-cached-images calico
        cd typha
        make ci-no-prereqs

  # Depends on the producer only to skip a commit whose first build failed;
  # `clean` discards the cached image anyway.
  - name: typha-fv-ubi
    tiers: []
    depends: [build-calico-image, check-go]
    env:
      - name: USE_UBI_AS_CALICO_BASE
        value: "1"
    checkout: true
    goCache: read
    reports: [typha/report:test-results-ubi, felix/report:test-results-ubi-felix]
    runOnVM:
      createVM:
        # The cache disk's project and zone: a disk attaches only to a machine
        # in both. A stockout there falls back across families.
        machineTypes: [e2-standard-8, n2d-standard-8, n2-standard-8, c2d-standard-8]
        project: tigera-cc-dev
        zones: [us-central1-a]
        vmImageProject: unique-caldron-775
      project: tigera-cc-dev
      source: |
        set -euo pipefail
        go_env=$(.argoci/scripts/vm-go-cache typha-fv-ubi) || exit 1
        eval "$go_env"
        make -C cmd/calico clean image
        cd typha
        make fv-no-prereqs
