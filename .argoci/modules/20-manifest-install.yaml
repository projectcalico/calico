# Installs Calico from the generated manifests rather than the operator, which
# catches a manifest missing a piece the operator supplies, then upgrades to the
# operator, the one place the migration out of kube-system runs against the
# manifests we ship. On a VM for the kernel modules the datapath specs need.
version: condensed-module

defaults:
  tiers: []
  # Longer than the default hour: a cluster plus its suite.
  timeout: 1h30m

steps:
  - name: manifest-install-kind
    depends:
      - build-calico-image
      - build-node-image
      - build-operator-image
      - build-third-party-images
      - build-e2e-binaries
      - check-go
    cache:
      - {name: calico-image, mode: read, path: /cache/calico-image}
    checkout: true
    goCache: read
    reports: [report:test-results]
    runOnVM:
      createVM:
        # The cache disk's project and zone: a disk attaches only to a machine
        # in both. A stockout there falls back across families.
        machineTypes: [e2-standard-8, n2d-standard-8, n2-standard-8, c2d-standard-8]
        diskType: pd-ssd
        diskSize: 200GB
        project: tigera-cc-dev
        zones: [us-central1-a]
        vmImageProject: unique-caldron-775
      project: tigera-cc-dev
      put:
        - /cache/calico-image/calico.tar:calico-build/calico.tar
      source: |
        set -euo pipefail
        finish() {
          local rc=$?
          if [ "$rc" != 0 ]; then
            # The script pushes its own bundle. This lane's kubeconfig is not the
            # one the script would find.
            KUBECONFIG="$(pwd)/hack/test/kind/kind-manifests-kubeconfig.yaml" .semaphore/collect-kind-diags || true
          fi
        }
        trap finish EXIT
        go_env=$(.argoci/scripts/vm-go-cache manifest-install-kind) || exit 1
        eval "$go_env"
        # The Makefiles call the kubectl they download by full path; the deploy
        # script and the tests' connection tester call it by name.
        export PATH="$(pwd)/hack/test/kind:${PATH}"
        export CALICO_IMAGE_TAR="$HOME/calico-build/calico.tar"
        .argoci/scripts/load-cached-images calico node
        .argoci/scripts/load-e2e-binaries
        export E2E_PREBUILT=true
        make kind-manifest-install-test
