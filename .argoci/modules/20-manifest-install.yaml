# Installs Calico from the generated manifests rather than the operator, which
# catches a manifest missing a piece the operator supplies. On a VM for the
# kernel modules the datapath specs need.
version: condensed-module

defaults:
  # Longer than the default hour: a cluster plus its suite.
  timeout: 1h30m
  runOn: vm
  services:
    - docker

steps:
  - name: manifest-install-kind
    vm:
      machineType: e2-standard-8
      diskType: pd-ssd
      diskSize: 200GB
    depends:
      - build-calico-image
      - build-node-image
      - build-third-party-images
      - build-e2e-binaries
      - check-go
    commands: |
      sudo apt-get update -y && sudo apt-get install -y make
      # The Makefiles call the kubectl they download by full path; the deploy
      # script and the tests' connection tester call it by name.
      export PATH="$(pwd)/hack/test/kind:${PATH}"
      .argoci/scripts/load-cached-images calico node
      .argoci/scripts/load-e2e-binaries
      export E2E_PREBUILT=true
      make kind-manifest-install-test
    epilogue: |
      copyFromVirtualMachine "${CI_HOME}/${CI_GIT_DIR}/report" report || true
      artifact push job report --destination test-results || true
      if [ "$CI_STEP_EXIT_CODE" != 0 ]; then
        # Collected where the cluster is; the script pushes its own bundle. This
        # lane's kubeconfig is not the one the script would find.
        sshOnVirtualMachine 'cd "${CI_HOME}/${CI_GIT_DIR}" && KUBECONFIG="$(pwd)/hack/test/kind/kind-manifests-kubeconfig.yaml" .semaphore/collect-kind-diags' || true
      fi
