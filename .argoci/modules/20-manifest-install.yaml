# Installs Calico from the generated manifests rather than the operator, which
# catches a manifest missing a piece the operator supplies, then upgrades to the
# operator, the one place the migration out of kube-system runs against the
# manifests we ship. On a VM for the kernel modules the datapath specs need.
#
# TEMPORARY: fed from the volume cache rather than the artifact store.
version: condensed-module

defaults:
  tiers: []
  # The compute SA createVM, runOnVM and the teardown authenticate with.
  secretBundles:
    - banzai-secrets

steps:
  - name: manifest-install-kind
    timeout: 1h30m
    depends:
      - build-node-image
      - build-whisker-image
      - operator-image-buildkit
      - envoy-gateway-image-buildkit
      - envoy-proxy-image-buildkit
      - envoy-ratelimit-image-buildkit
      - cni-plugins-image-buildkit
      - build-e2e-binaries
      - calico-image-buildkit
      - check-go
    checkout: true
    cache:
      - {name: calico-image-tar, mode: read, path: /cache/calico-image-tar}
      - {name: node-image, mode: read, path: /cache/node-image}
      - {name: whisker-image, mode: read, path: /cache/whisker-image}
      - {name: operator-image, mode: read, path: /cache/operator-image}
      - {name: envoy-gateway-image, mode: read, path: /cache/envoy-gateway-image}
      - {name: envoy-proxy-image, mode: read, path: /cache/envoy-proxy-image}
      - {name: envoy-ratelimit-image, mode: read, path: /cache/envoy-ratelimit-image}
      - {name: cni-plugins-image, mode: read, path: /cache/cni-plugins-image}
      - {name: e2e-binaries, mode: read, path: /cache/e2e-binaries}
    runOnVM:
      # Booted once the images are ready rather than alongside their builds, so the
      # machine lives only as long as the step.
      createVM:
        machineType: e2-standard-8
        diskType: pd-ssd
        diskSize: 200GB
        maxRunDuration: 2h
      put:
        - /cache/calico-image-tar/calico-image.tar:prefetched/calico-image.tar
        - /cache/node-image/node-image.tar:prefetched/node-image.tar
        - /cache/whisker-image/whisker-image.tar.zst:prefetched/whisker-image.tar.zst
        - /cache/operator-image/operator-image.tar:prefetched/operator-image.tar
        - /cache/envoy-gateway-image/envoy-gateway-image.tar:prefetched/envoy-gateway-image.tar
        - /cache/envoy-proxy-image/envoy-proxy-image.tar:prefetched/envoy-proxy-image.tar
        - /cache/envoy-ratelimit-image/envoy-ratelimit-image.tar:prefetched/envoy-ratelimit-image.tar
        - /cache/cni-plugins-image/cni-plugins-image.tar:prefetched/cni-plugins-image.tar
        - /cache/e2e-binaries/e2e-binaries.tar.zst:prefetched/e2e-binaries.tar.zst
      get:
        - manifest-install:/tmp/manifest-install
      source: |
        set -euo pipefail
        out="${HOME}/manifest-install"
        mkdir -p "$out"
        # There is no epilogue on a machine, so the report and, on a failure, the
        # cluster's diagnostics are gathered on the way out for `get` to fetch.
        collect() {
          rc=$?
          [ "$rc" = 0 ] || KUBECONFIG="$(pwd)/hack/test/kind/kind-manifests-kubeconfig.yaml" .semaphore/collect-kind-diags || true
          tar -czf "$out/manifest-install.tgz" report artifacts 2>/dev/null || true
        }
        trap collect EXIT
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        command -v zstd >/dev/null || { sudo apt-get update -y && sudo apt-get install -y zstd; }
        export PATH="$(pwd)/hack/test/kind:${PATH}"
        export PREFETCHED_ARTIFACTS="${HOME}/prefetched"
        .argoci/scripts/load-cached-images calico node whisker
        .argoci/scripts/load-e2e-binaries
        export E2E_PREBUILT=true
        make kind-manifest-install-test
    outputs:
      - {name: manifest-install, path: /tmp/manifest-install/manifest-install.tgz, optional: true}
