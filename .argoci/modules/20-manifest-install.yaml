# Every other kind lane installs Calico through the operator, which renders its
# own DaemonSet. Only this one applies the generated manifests, so it is the
# one that catches a manifest missing a piece the operator supplies.
#
# On a machine rather than in a pod for the same reason as the other kind lanes:
# the datapath specs reach for kernel modules the container-optimised node image
# does not ship, and a cluster's disk churn outgrows what a pod sustains.
version: condensed-module

defaults:
  # A cluster plus the suite it exists to run does not fit the hour the lighter
  # lanes get.
  timeout: 1h30m
  runOn: vm
  services:
    - docker

steps:
  - name: manifest-install-kind
    vm:
      machineType: e2-standard-8
      diskType: pd-ssd
      diskSize: 200GB
    depends:
      - build-calico-image
      - build-node-image
      - build-third-party-images
      - check-go
    commands: |
      sudo apt-get update -y && sudo apt-get install -y make
      # The Makefiles call the kubectl they download by full path; the deploy
      # script and the tests' connection tester call it by name.
      export PATH="$(pwd)/hack/test/kind:${PATH}"
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      .argoci/scripts/load-cached-images calico node
      make kind-manifest-install-test
    epilogue: |
      copyFromVirtualMachine report report || true
      artifact push job report --destination test-results || true
      if [ "$CI_STEP_EXIT_CODE" != 0 ]; then
        # Collected where the cluster is; the script pushes its own bundle. The
        # cluster this lane builds keeps its kubeconfig apart from the one the
        # script would otherwise find.
        sshOnVirtualMachine 'cd "${CI_HOME}/${CI_GIT_DIR}" && KUBECONFIG="$(pwd)/hack/test/kind/kind-manifests-kubeconfig.yaml" .semaphore/collect-kind-diags' || true
      fi
