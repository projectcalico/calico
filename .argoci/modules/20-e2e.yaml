# The Kubernetes e2e suites, run against a kind cluster built from the images
# the producers cached. Four variants of the same lane: the routing mode and the
# suite differ, nothing else does.
#
# On a machine rather than in a pod: the suites exercise SCTP, whose protocol
# module the container-optimised node image does not ship at all — so it cannot
# be loaded from anywhere in a pod. A lane this size takes most of a node
# regardless, so an instance of its own costs little.
version: condensed-module

defaults:
  # A conformance suite plus the cluster it needs does not fit the hour the
  # lighter lanes get.
  timeout: 1h30m
  runOn: vm
  services:
    - docker

steps:
  - name: e2e-kind
    vm:
      # Third-generation family, which is what hyperdisk needs.
      machineType: c3-standard-8
      # Same region as the artifact store the cached images come from.
      zone: us-central1-b
      # kind's churn wants tens of thousands of IOPS, and 200GB of pd-ssd caps at
      # 6000 — reaching them that way would mean paying for a terabyte.
      diskType: hyperdisk-balanced
      diskSize: 200GB
      provisionedIops: 10000
      provisionedThroughput: 200
    depends:
      - build-calico-image
      - build-node-image
      - build-whisker-image
      - build-operator-image
      - build-third-party-images
      - check-go
    matrix:
      # Pinned rather than defaulted: from v3.33 the default gives Felix the
      # IPIP routes, and these tests need BGP to be the only routing mechanism.
      - name: conformance-bird
        env:
          - name: E2E_TARGET
            value: e2e-test
          - name: EXTRA_VALUES_FILES
            value: hack/test/kind/infra/values-bird-routing.yaml
      - name: conformance-felix
        env:
          - name: E2E_TARGET
            value: e2e-test
          - name: EXTRA_VALUES_FILES
            value: hack/test/kind/infra/values-felix-routing.yaml
          - name: KIND_CALICO_API_GROUP
            value: crd.projectcalico.org/v1
          - name: E2E_TEST_CONFIG
            value: e2e/config/kind/felix-routing.yaml
      - name: clusternetworkpolicy-felix
        env:
          - name: E2E_TARGET
            value: e2e-test-clusternetworkpolicy
          - name: EXTRA_VALUES_FILES
            value: hack/test/kind/infra/values-felix-routing.yaml
          - name: KIND_CALICO_API_GROUP
            value: projectcalico.org/v3
          - name: E2E_TEST_CONFIG
            value: e2e/config/kind/felix-routing.yaml
      - name: sig-calico-bpf
        env:
          - name: E2E_TARGET
            value: e2e-test-bpf
    commands: |
      sudo apt-get update -y && sudo apt-get install -y make
      sudo modprobe sctp
      # The Makefiles call the kubectl they download by full path; the deploy
      # script and the tests' connection tester call it by name.
      export PATH="$(pwd)/hack/test/kind:${PATH}"
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      .argoci/scripts/load-cached-images calico node whisker
      make ${E2E_TARGET}
    epilogue: |
      copyFromVirtualMachine "${CI_HOME}/${CI_GIT_DIR}/report" report || true
      artifact push job report --destination test-results || true
      if [ "$CI_STEP_EXIT_CODE" != 0 ]; then
        # Collected where the cluster is; the script pushes its own bundle.
        sshOnVirtualMachine 'cd "${CI_HOME}/${CI_GIT_DIR}" && .semaphore/collect-kind-diags' || true
        # The snapshot tool ships in the CI image rather than on the machine, and
        # the machine has no registry credentials of its own. Worth the pull: the
        # cluster is gone once this returns.
        sshOnVirtualMachine 'docker login -u _json_key --password-stdin https://gcr.io < "${CI_ARTIFACT_SA_KEY_FILE}"' || true
        sshOnVirtualMachine 'cd "${CI_HOME}/${CI_GIT_DIR}" && docker run --rm --network host -v "$PWD:/w" -w /w gcr.io/tigera-cc-dev/ci-base/calico-ci:v0.2 kubectl-snapshot create --kubeconfig hack/test/kind/kind-kubeconfig.yaml -o kind-snapshot.tar.gz' || true
        copyFromVirtualMachine "${CI_HOME}/${CI_GIT_DIR}/kind-snapshot.tar.gz" kind-snapshot.tar.gz || true
        artifact push job kind-snapshot.tar.gz --destination kind-snapshot.tar.gz || true
      fi
