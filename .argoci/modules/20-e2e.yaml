# Kubernetes e2e suites on a kind cluster, one lane per routing mode and suite.
# On a VM because the suites exercise SCTP, which the pod nodes' image lacks.
version: condensed-module

defaults:
  tiers: []
  # A cluster plus a suite that may itself take 90m (E2E_TIMEOUT): the margin is
  # what lets the script's own failure handling run before the deadline.
  timeout: 2h

steps:
  - name: e2e-kind
    env:
      - name: E2E_RUN_WRAPPER
        value: .argoci/scripts/sandcat/with-inline-diag.sh
      - name: SANDCAT_TOTAL_BUDGET
        value: 10m
    secretBundles:
      - name: sandcat-nightly
        keys:
          - name: SANDCAT_GEMINI_KEY
      - name: sandcat-download
        keys:
          - name: SANDCAT_BIN_DOWNLOAD_TOKEN
      - name: sandcat-db
        keys:
          - name: SANDCAT_DB_URL
          - name: SANDCAT_DB_TOKEN
    depends:
      - build-calico-image
      - build-node-image
      - build-whisker-image
      - build-operator-image
      - build-third-party-images
      - build-e2e-binaries
      - check-go
      - sandcat-pr-context
    matrix:
      # Pinned rather than defaulted: from v3.33 the default gives Felix the
      # IPIP routes, and these tests need BGP to be the only routing mechanism.
      - name: conformance-bird
        env:
          - name: E2E_TARGET
            value: e2e-test
          - name: EXTRA_VALUES_FILES
            value: hack/test/kind/infra/values-bird-routing.yaml
      - name: conformance-felix
        env:
          - name: E2E_TARGET
            value: e2e-test
          - name: EXTRA_VALUES_FILES
            value: hack/test/kind/infra/values-felix-routing.yaml
          - name: KIND_CALICO_API_GROUP
            value: crd.projectcalico.org/v1
          - name: E2E_TEST_CONFIG
            value: e2e/config/kind/felix-routing.yaml
      - name: clusternetworkpolicy-felix
        env:
          - name: E2E_TARGET
            value: e2e-test-clusternetworkpolicy
          # A go test binary with no ginkgo report, so sandcat would record every failure as a build failure.
          - name: SANDCAT_SKIP
            value: "true"
          - name: EXTRA_VALUES_FILES
            value: hack/test/kind/infra/values-felix-routing.yaml
          - name: KIND_CALICO_API_GROUP
            value: projectcalico.org/v3
          - name: E2E_TEST_CONFIG
            value: e2e/config/kind/felix-routing.yaml
      - name: sig-calico-bpf
        env:
          - name: E2E_TARGET
            value: e2e-test-bpf
    cache:
      - {name: calico-image, mode: read, path: /cache/calico-image}
    checkout: true
    goCache: read
    reports: [report:test-results]
    runOnVM:
      createVM:
        # The cache disk's zone, since a disk attaches only to a machine in its
        # project and zone. C3 and C3D are the families that boot from a hyperdisk
        # and can also attach the cache's pd-ssd; N4 and C4 take hyperdisk only.
        machineTypes:
          - c3d-standard-8
          - c3-standard-8
        # kind wants tens of thousands of IOPS, which pd-ssd only reaches at about
        # a terabyte.
        diskType: hyperdisk-balanced
        diskSize: 200GB
        provisionedIops: 10000
        provisionedThroughput: 200
        project: tigera-cc-dev
        zones: [us-central1-a]
        vmImageProject: unique-caldron-775
      project: tigera-cc-dev
      # The secrets; the step's and each lane's own env goes across by itself.
      env:
        - SANDCAT_GEMINI_KEY
        - SANDCAT_BIN_DOWNLOAD_TOKEN
        - SANDCAT_DB_URL
        - SANDCAT_DB_TOKEN
      put:
        - /cache/calico-image/calico.tar:calico-build/calico.tar
      source: |
        set -euo pipefail
        finish() {
          local rc=$?
          if [ "$rc" != 0 ]; then
            # The script pushes its own bundle.
            .semaphore/collect-kind-diags || true
            snapshot_kind_cluster || true
          fi
        }
        # The snapshot tool is only in the CI image.
        snapshot_kind_cluster() {
          docker run --rm --network host -v "$PWD:/w" -w /w gcr.io/tigera-cc-dev/ci-base/calico-ci:v0.4 \
            kubectl-snapshot create --kubeconfig hack/test/kind/kind-kubeconfig.yaml -o kind-snapshot.tar.gz
          artifact push job kind-snapshot.tar.gz --destination kind-snapshot.tar.gz
        }
        trap finish EXIT
        sudo modprobe sctp
        go_env=$(.argoci/scripts/vm-go-cache e2e-kind) || exit 1
        eval "$go_env"
        # The Makefiles call the kubectl they download by full path; the deploy
        # script and the tests' connection tester call it by name.
        export PATH="$(pwd)/hack/test/kind:${PATH}"
        export CALICO_IMAGE_TAR="$HOME/calico-build/calico.tar"
        .argoci/scripts/load-cached-images calico node whisker
        .argoci/scripts/load-e2e-binaries
        export E2E_PREBUILT=true
        mkdir -p artifacts
        rc=0
        make ${E2E_TARGET} 2>&1 | tee artifacts/e2e.log || rc=$?
        if [ "${SANDCAT_SKIP:-}" != true ]; then
          .argoci/scripts/sandcat/sandcat.sh push-specs --spec-dir report/sandcat || true
          SANDCAT_REPORT=report/report.json
          [ -f "${SANDCAT_REPORT}" ] || SANDCAT_REPORT=$(ls -t report/*.xml 2>/dev/null | head -1) || true
          if [ -n "${SANDCAT_REPORT}" ]; then
            .argoci/scripts/sandcat/sandcat.sh analyze --report "${SANDCAT_REPORT}" --source-dir "$(pwd)" \
              --log-file artifacts/e2e.log || true
          elif [ "${rc}" != 0 ]; then
            .argoci/scripts/sandcat/sandcat.sh build-failure --logs-dir artifacts --source-dir "$(pwd)" || true
          fi
        fi
        exit "${rc}"
