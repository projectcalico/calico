# Kubernetes e2e suites on a kind cluster, one lane per routing mode and suite.
# On a VM because the suites exercise SCTP, which the pod nodes' image lacks.
version: condensed-module

defaults:
  # Longer than the default hour: a cluster plus a conformance suite.
  timeout: 1h30m
  runOn: vm
  services:
    - docker

steps:
  - name: e2e-kind
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
      # Diagnoses each failing spec while its namespace and pods are still up.
      # Applied around the ginkgo run, the one point where the cluster exists
      # and the suite has not started.
      - name: E2E_RUN_WRAPPER
        value: .semaphore/end-to-end/scripts/with-inline-diag.sh
    secretBundles:
      - name: sandcat-upload
        keys:
          - name: SANDCAT_UPLOAD_URL
          - name: SANDCAT_INGEST_TOKEN
      - name: sandcat-nightly
        keys:
          - name: GH_TOKEN
          - name: SANDCAT_GEMINI_KEY
      - name: sandcat-db
        keys:
          - name: SANDCAT_DB_URL
          - name: SANDCAT_DB_TOKEN
    vm:
      # Cheapest first, all families that can attach a hyperdisk. A region can run
      # short of any one of them.
      machineTypes:
        - n4d-standard-8
        - n4-standard-8
        - c3d-standard-8
        - c4d-standard-8
        - c4-standard-8
        - c3-standard-8
      # The artifact store's region, in any zone: capacity runs out zone by zone.
      zone: us-central1
      # kind wants tens of thousands of IOPS, which pd-ssd only reaches at about
      # a terabyte.
      diskType: hyperdisk-balanced
      diskSize: 200GB
      provisionedIops: 10000
      provisionedThroughput: 200
    depends:
      - build-calico-image
      - build-node-image
      - build-whisker-image
      - build-operator-image
      - build-third-party-images
      - build-e2e-binaries
      - check-go
    matrix:
      # Pinned rather than defaulted: from v3.33 the default gives Felix the
      # IPIP routes, and these tests need BGP to be the only routing mechanism.
      - name: conformance-bird
        env:
          - name: E2E_TARGET
            value: e2e-test
          - name: EXTRA_VALUES_FILES
            value: hack/test/kind/infra/values-bird-routing.yaml
      - name: conformance-felix
        env:
          - name: E2E_TARGET
            value: e2e-test
          - name: EXTRA_VALUES_FILES
            value: hack/test/kind/infra/values-felix-routing.yaml
          - name: KIND_CALICO_API_GROUP
            value: crd.projectcalico.org/v1
          - name: E2E_TEST_CONFIG
            value: e2e/config/kind/felix-routing.yaml
      - name: clusternetworkpolicy-felix
        env:
          - name: E2E_TARGET
            value: e2e-test-clusternetworkpolicy
          - name: EXTRA_VALUES_FILES
            value: hack/test/kind/infra/values-felix-routing.yaml
          - name: KIND_CALICO_API_GROUP
            value: projectcalico.org/v3
          - name: E2E_TEST_CONFIG
            value: e2e/config/kind/felix-routing.yaml
      - name: sig-calico-bpf
        env:
          - name: E2E_TARGET
            value: e2e-test-bpf
    commands: |
      sudo apt-get update -y && sudo apt-get install -y make jq
      sudo modprobe sctp
      # The Makefiles call the kubectl they download by full path; the deploy
      # script and the tests' connection tester call it by name.
      export PATH="$(pwd)/hack/test/kind:${PATH}"
      .argoci/scripts/load-cached-images calico node whisker
      .argoci/scripts/load-e2e-binaries
      export E2E_PREBUILT=true
      # sandcat.sh downloads its binary from the private tigera/sandcat releases.
      export GITHUB_ACCESS_TOKEN="${GH_TOKEN:-}"
      mkdir -p artifacts
      set -o pipefail
      rc=0
      make ${E2E_TARGET} 2>&1 | tee artifacts/e2e.log || rc=$?
      # Here rather than in the epilogue: the cluster and the report are on the VM.
      SANDCAT_REPORT=report/report.json
      [ -f "${SANDCAT_REPORT}" ] || SANDCAT_REPORT=$(ls -t report/*.xml 2>/dev/null | head -1)
      if [ -n "${SANDCAT_REPORT}" ]; then
        .semaphore/end-to-end/scripts/sandcat.sh analyze --report "${SANDCAT_REPORT}" --source-dir "$(pwd)" || true
      elif [ "${rc}" != 0 ]; then
        .semaphore/end-to-end/scripts/sandcat.sh build-failure --logs-dir artifacts --source-dir "$(pwd)" || true
      fi
      exit "${rc}"
    epilogue: |
      copyFromVirtualMachine "${CI_HOME}/${CI_GIT_DIR}/report" report || true
      artifact push job report --destination test-results || true
      if [ "$CI_STEP_EXIT_CODE" != 0 ]; then
        # Collected where the cluster is; the script pushes its own bundle.
        sshOnVirtualMachine 'cd "${CI_HOME}/${CI_GIT_DIR}" && .semaphore/collect-kind-diags' || true
        # The snapshot tool is only in the CI image, and the VM has no registry
        # credentials of its own.
        sshOnVirtualMachine 'docker login -u _json_key --password-stdin https://gcr.io < "${CI_ARTIFACT_SA_KEY_FILE}"' || true
        sshOnVirtualMachine 'cd "${CI_HOME}/${CI_GIT_DIR}" && docker run --rm --network host -v "$PWD:/w" -w /w gcr.io/tigera-cc-dev/ci-base/calico-ci:v0.4 kubectl-snapshot create --kubeconfig hack/test/kind/kind-kubeconfig.yaml -o kind-snapshot.tar.gz' || true
        copyFromVirtualMachine "${CI_HOME}/${CI_GIT_DIR}/kind-snapshot.tar.gz" kind-snapshot.tar.gz || true
        artifact push job kind-snapshot.tar.gz --destination kind-snapshot.tar.gz || true
      fi
