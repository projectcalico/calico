# Kubernetes e2e suites on a kind cluster, one lane per routing mode and suite.
# On a VM because the suites exercise SCTP, which the pod nodes' image lacks.
#
# TEMPORARY: on createVM machines, booted while the images build, and fed from
# the producers' caches rather than the artifact store.
version: condensed-module

defaults:
  tiers: []
  # The compute SA createVM, runOnVM and the teardowns authenticate with.
  secretBundles:
    - banzai-secrets

steps:
  - name: e2e-kind-vm
    createVM:
      # TEMPORARY: a test build of scratch-utils v0.6, for the machine-type list
      # and the provisioned hyperdisk.
      image: gcr.io/unique-caldron-775/scratch-utils:v0.6-test-190c538
      # Cheapest first, all families that can attach a hyperdisk. A region can run
      # short of any one of them.
      machineTypes:
        - n4d-standard-8
        - n4-standard-8
        - c3d-standard-8
        - c4d-standard-8
        - c4-standard-8
        - c3-standard-8
      # kind wants tens of thousands of IOPS, which pd-ssd only reaches at about
      # a terabyte.
      diskType: hyperdisk-balanced
      diskSize: 200GB
      provisionedIops: 10000
      provisionedThroughput: 200
      # The run's own timeout plus the wait for the images.
      maxRunDuration: 2h
    matrix:
      - name: conformance-bird
      - name: conformance-felix
      - name: clusternetworkpolicy-felix
      - name: sig-calico-bpf

  - name: e2e-kind
    # Longer than the default hour: a cluster plus a conformance suite.
    timeout: 1h30m
    depends:
      - e2e-kind-vm
      - build-node-image
      - build-whisker-image
      - build-operator-image
      - build-third-party-images
      - build-e2e-binaries
      - calico-image-buildkit
      - check-go
    checkout: true
    # What the run needs from other steps comes from their caches, shipped across
    # with `put`.
    cache:
      - {name: calico-image-tar, mode: read, path: /cache/calico-image-tar}
      - {name: node-image, mode: read, path: /cache/node-image}
      - {name: whisker-image, mode: read, path: /cache/whisker-image}
      - {name: operator-image, mode: read, path: /cache/operator-image}
      - {name: third-party-images, mode: read, path: /cache/third-party-images}
      - {name: e2e-binaries, mode: read, path: /cache/e2e-binaries}
    matrix:
      # Pinned rather than defaulted: from v3.33 the default gives Felix the
      # IPIP routes, and these tests need BGP to be the only routing mechanism.
      - name: conformance-bird
        env:
          - name: E2E_TARGET
            value: e2e-test
          - name: EXTRA_VALUES_FILES
            value: hack/test/kind/infra/values-bird-routing.yaml
      - name: conformance-felix
        env:
          - name: E2E_TARGET
            value: e2e-test
          - name: EXTRA_VALUES_FILES
            value: hack/test/kind/infra/values-felix-routing.yaml
          - name: KIND_CALICO_API_GROUP
            value: crd.projectcalico.org/v1
          - name: E2E_TEST_CONFIG
            value: e2e/config/kind/felix-routing.yaml
      - name: clusternetworkpolicy-felix
        env:
          - name: E2E_TARGET
            value: e2e-test-clusternetworkpolicy
          - name: EXTRA_VALUES_FILES
            value: hack/test/kind/infra/values-felix-routing.yaml
          - name: KIND_CALICO_API_GROUP
            value: projectcalico.org/v3
          - name: E2E_TEST_CONFIG
            value: e2e/config/kind/felix-routing.yaml
      - name: sig-calico-bpf
        env:
          - name: E2E_TARGET
            value: e2e-test-bpf
    runOnVM:
      image: gcr.io/unique-caldron-775/scratch-utils:v0.6-test-190c538
      vm: e2e-kind-vm
      # An entry's unset ones are skipped.
      env: [E2E_TARGET, EXTRA_VALUES_FILES, KIND_CALICO_API_GROUP, E2E_TEST_CONFIG]
      put:
        - /cache/calico-image-tar/calico-image.tar:prefetched/calico-image.tar
        - /cache/node-image/node-image.tar.zst:prefetched/node-image.tar.zst
        - /cache/whisker-image/whisker-image.tar.zst:prefetched/whisker-image.tar.zst
        - /cache/operator-image/operator-image.tar.zst:prefetched/operator-image.tar.zst
        - /cache/third-party-images/third-party-images.tar.zst:prefetched/third-party-images.tar.zst
        - /cache/e2e-binaries/e2e-binaries.tar.zst:prefetched/e2e-binaries.tar.zst
      get:
        - e2e-kind:/tmp/e2e-kind
      source: |
        set -euo pipefail
        out="${HOME}/e2e-kind"
        mkdir -p "$out"
        # There is no epilogue on a machine, so the report and, on a failure, the
        # cluster's diagnostics are gathered on the way out for `get` to fetch.
        collect() {
          rc=$?
          [ "$rc" = 0 ] || .semaphore/collect-kind-diags || true
          tar -czf "$out/e2e-kind.tgz" report artifacts 2>/dev/null || true
        }
        trap collect EXIT
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        command -v zstd >/dev/null || { sudo apt-get update -y && sudo apt-get install -y zstd; }
        sudo modprobe sctp
        # The Makefiles call the kubectl they download by full path; the deploy
        # script and the tests' connection tester call it by name.
        export PATH="$(pwd)/hack/test/kind:${PATH}"
        export PREFETCHED_ARTIFACTS="${HOME}/prefetched"
        .argoci/scripts/load-cached-images calico node whisker
        .argoci/scripts/load-e2e-binaries
        export E2E_PREBUILT=true
        make ${E2E_TARGET}
    outputs:
      - {name: e2e-kind, path: /tmp/e2e-kind/e2e-kind.tgz, optional: true}
