# Other gates trust the dependency files to decide what to re-test, and a stale
# one under-fires in silence — nothing else would ever report it.
version: condensed-module

defaults:
  # Minutes of CPU-bound work, well short of the hour the default would allow.
  timeout: 20m

  # Walking the import graph is just Go, so it runs in the build image directly
  # and needs no daemon or second pull.
  image: calico/go-build:1.27.1-llvm21.1.8-k8s1.37.0-1

steps:
  - name: check-generated-deps
    # The image ships the Go toolchain under /go, which the default emptyDir
    # over that path hides — as `command not found`, minutes in.
    workspaceVolumes: none
    commands: |
      # Emptying the wrappers runs each recipe here instead of in a nested
      # container; the tools they call are already on PATH.
      make gen-deps-files DOCKER_GO_BUILD= DOCKER_RUN= CALICO_BUILD=
      make check-dirty
