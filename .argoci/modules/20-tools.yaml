# In-repo tooling (hack/) `make ci`.
version: condensed-module

defaults:
  timeout: 1h
  services:
    - docker

steps:
  - name: tools-ci
    depends: [check-go]
    requests: {cpu: 3750m, memory: 2.25Gi}
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      cd hack
      make ci
