# The e2e suite's own unit tests. Needs docker: building the test binary splices
# its own flags into a nested `docker run`, so the step runs on a VM.
version: condensed-module

defaults:
  timeout: 30m
  secretBundles: [banzai-secrets]

steps:
  - name: e2e-ut
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
    depends: [check-go, go-mod-cache]
    checkout: true
    cache:
      - {name: go-mod, mode: read, path: /cache/go-mod}
    runOnVM:
      createVM:
        machineType: e2-standard-8
      env: [BUILD_CACHE_GROUP]
      put:
        - /cache/go-mod/go-mod.tar.gz:.go-mod/go-mod.tar.gz
      source: |
        set -e
        .argoci/scripts/restore-go-cache e2e-ut ~/.go-mod
        repo="$(pwd)"
        # There is no epilogue on a machine; results go up on the way out.
        finish() {
          rc=$?
          artifact push job "$repo/e2e/report" --destination test-results || true
          exit $rc
        }
        trap finish EXIT
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        cd e2e
        make ci
