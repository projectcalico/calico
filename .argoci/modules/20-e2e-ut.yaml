# The e2e suite's own unit tests.
version: condensed-module

defaults:
  timeout: 30m
  # In the build image, with NATIVE_GO_BUILD running each recipe in place rather
  # than in a nested container.
  useGoBuild: true

steps:
  - name: e2e-ut
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    depends: [check-go]
    requests: {cpu: 4250m, memory: 5Gi}
    goCache: read
    commands: |
      cd e2e
      make ci
    reports: [e2e/report:test-results]
