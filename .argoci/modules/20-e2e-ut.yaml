# The e2e suite's own unit tests — not the e2e runs themselves, which are crons.
#
# Building the test binary splices its own `-e` flags into a nested
# `docker run`, which emptying the wrappers would leave behind as a bare
# command.
version: condensed-module

defaults:
  timeout: 30m
  services:
    - docker

steps:
  - name: e2e-ut
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      cd e2e
      make ci
    epilogue: |
      # Runs in the parent shell, so it inherits neither the `cd` above nor
      # anything the commands exported.
      cd "${CI_HOME}/${CI_GIT_DIR}/e2e"
      artifact push job report --destination test-results || true
