# The e2e suite's own unit tests. Needs docker: building the test binary splices
# its own flags into a nested `docker run`.
version: condensed-module

defaults:
  timeout: 30m
  services:
    - docker

steps:
  - name: e2e-ut
    depends: [check-go]
    requests: {cpu: 4250m, memory: 4.75Gi}
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      cd e2e
      make ci
    epilogue: |
      # Epilogues don't inherit the commands' `cd` or exports.
      cd "${CI_HOME}/${CI_GIT_DIR}/e2e"
      artifact push job report --destination test-results || true
