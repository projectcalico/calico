# Upstream CNI plugins CI and cross-architecture builds.
version: condensed-module

defaults:
  timeout: 30m

steps:
  - name: third-party-cni-plugins-ci
    services: [docker]
    requests: {cpu: 2000m, memory: 1.25Gi}
    commands: |
      cd third_party/cni-plugins
      make ci

  # go-cache's builds are amd64, so these take only its modules.
  - name: third-party-cni-plugins-build
    useGoBuild: true
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    requests: {cpu: 2750m, memory: 2Gi}
    goCache: read
    matrix:
      - name: arm64
        env: [{name: ARCH, value: arm64}]
      - name: ppc64le
        env: [{name: ARCH, value: ppc64le}]
      - name: s390x
        env: [{name: ARCH, value: s390x}]
    commands: |
      cd third_party/cni-plugins
      make build ARCH=$ARCH
