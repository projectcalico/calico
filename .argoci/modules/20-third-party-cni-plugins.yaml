# Upstream CNI plugins CI and cross-architecture builds, on VMs for docker.
version: condensed-module

defaults:
  timeout: 30m
  # The compute SA createVM, runOnVM and the teardowns authenticate with.
  secretBundles: [banzai-secrets]

steps:
  - name: third-party-cni-plugins-ci
    checkout: true
    runOnVM:
      createVM:
        machineType: e2-standard-4
      source: |
        set -e
        repo="$(pwd)"
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        cd third_party/cni-plugins
        make ci

  - name: third-party-cni-plugins-build
    checkout: true
    matrix:
      - name: arm64
        env: [{name: ARCH, value: arm64}]
      - name: ppc64le
        env: [{name: ARCH, value: ppc64le}]
      - name: s390x
        env: [{name: ARCH, value: s390x}]
    runOnVM:
      createVM:
        machineType: e2-standard-8
      env: [ARCH]
      source: |
        set -e
        repo="$(pwd)"
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        cd third_party/cni-plugins
        make build ARCH=$ARCH
