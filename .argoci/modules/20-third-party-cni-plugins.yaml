# Upstream CNI plugins tests and cross-architecture builds. The amd64 image is
# built by cni-plugins-image-buildkit.
version: condensed-module

defaults:
  timeout: 30m

steps:
  - name: third-party-cni-plugins-ci
    depends: [go-cache]
    # TEMPORARY: pins the step to the go-build cache pool until the handler does it.
    override:
      nodeSelector: {role: argoci, size: medium, go-build-version: 1.27.3-llvm21.1.8-k8s1.37.1-1}
      tolerations: [{key: argoci, operator: Exists}, {key: argoci-medium, operator: Exists}, {key: argoci-cached-images, operator: Exists}]
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    requests: {cpu: 1000m, memory: 2Gi}
    useGoBuild: true
    # The image ships tools under /go/bin, which the default /go volume hides.
    workspaceVolumes: none
    cache:
      - {name: go, mode: read, path: /cache/go}
    commands: |
      "${CI_HOME}/${CI_GIT_DIR}/.argoci/scripts/restore-go-cache" third-party-cni-plugins-ci
      make -C third_party/cni-plugins ut

  # Cross-compiles only, so it needs no daemon.
  - name: third-party-cni-plugins-build
    # TEMPORARY: pins the step to the go-build cache pool until the handler does it.
    override:
      nodeSelector: {role: argoci, size: medium, go-build-version: 1.27.3-llvm21.1.8-k8s1.37.1-1}
      tolerations: [{key: argoci, operator: Exists}, {key: argoci-medium, operator: Exists}, {key: argoci-cached-images, operator: Exists}]
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    requests: {cpu: 3000m, memory: 3Gi}
    useGoBuild: true
    # The image ships tools under /go/bin, which the default /go volume hides.
    workspaceVolumes: none
    matrix:
      - name: arm64
        env: [{name: ARCH, value: arm64}]
      - name: ppc64le
        env: [{name: ARCH, value: ppc64le}]
      - name: s390x
        env: [{name: ARCH, value: s390x}]
    commands: |
      cd third_party/cni-plugins
      make build ARCH=$ARCH
