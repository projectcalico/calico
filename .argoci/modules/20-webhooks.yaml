# webhooks `make ci`.
version: condensed-module

defaults:
  timeout: 1h
  # In the build image directly, saving a nested container and a second pull.
  useGoBuild: true

steps:
  - name: webhooks-ci
    depends: [check-go, go-cache]
    requests: {cpu: 5500m, memory: 1.75Gi}
    # The image ships tools under /go/bin, which the default /go volume hides.
    workspaceVolumes: none
    cache:
      - {name: go, mode: read, path: /cache/go}
    commands: |
      go_env=$("${CI_HOME}/${CI_GIT_DIR}/.argoci/scripts/restore-go-cache" webhooks-ci) || exit 1; eval "$go_env"
      cd webhooks
      # Empty wrappers run each recipe here rather than in a nested container.
      make ci DOCKER_GO_BUILD= DOCKER_RUN= CALICO_BUILD=
    epilogue: |
      # Epilogues don't inherit the commands' `cd` or exports.
      cd "${CI_HOME}/${CI_GIT_DIR}/webhooks"
      artifact push job report --destination test-results || true
