# kube-controllers CI, per API group.
version: condensed-module

defaults:
  timeout: 1h
  services:
    - docker

steps:
  - name: kube-controllers-ci
    env:
      - name: CALICO_IMAGE_TAR
        value: /cache/calico-image/calico.tar
      - name: CALICO_BUILD_DIR
        value: /cache/calico-build
      - name: BUILD_CACHE_GROUP
        value: calico
    requests: {cpu: 5750m, memory: 5.5Gi}
    depends: [build-calico-image, check-go]
    matrix:
      - name: crd-v1
        env:
          - name: KC_TARGET
            value: ci-no-prereqs
      # The v3 API group is covered by the unit tests alone: the FVs underneath
      # `ci` exercise the backend, which the group does not reach.
      - name: v3
        env:
          - name: KC_TARGET
            value: ut-no-prereqs
          - name: CALICO_API_GROUP
            value: projectcalico.org/v3
    cache:
      - {name: calico-build, mode: read, path: /cache/calico-build}
      - {name: calico-image, mode: read, path: /cache/calico-image}
    commands: |
      .argoci/scripts/load-cached-images calico
      cd kube-controllers
      make ${KC_TARGET}
    reports: [kube-controllers/report:test-results]
