# kube-controllers CI, per API group. On VMs for docker.
version: condensed-module

defaults:
  timeout: 1h
  secretBundles: [banzai-secrets]

steps:
  - name: kube-controllers-ci
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
    depends: [build-calico-image, check-go, go-cache]
    matrix:
      - name: crd-v1
        env:
          - name: KC_TARGET
            value: ci-no-prereqs
      # The v3 API group is covered by the unit tests alone: the FVs underneath
      # `ci` exercise the backend, which the group does not reach.
      - name: v3
        env:
          - name: KC_TARGET
            value: ut-no-prereqs
          - name: CALICO_API_GROUP
            value: projectcalico.org/v3
    checkout: true
    cache:
      - {name: calico-image-zst, mode: read, path: /cache/calico-image-zst}
      - {name: go, mode: read, path: /cache/go}
    runOnVM:
      createVM:
        machineType: e2-standard-8
      env: [BUILD_CACHE_GROUP, KC_TARGET, CALICO_API_GROUP]
      put:
        - /cache/calico-image-zst:prefetched
        - /cache/go/go-mod.tar.gz:.go-mod/go-mod.tar.gz
      source: |
        set -e
        .argoci/scripts/restore-go-cache kube-controllers-ci ~/.go-mod
        repo="$(pwd)"
        # There is no epilogue on a machine; results go up on the way out.
        finish() {
          rc=$?
          artifact push job "$repo/kube-controllers/report" --destination test-results || true
          exit $rc
        }
        trap finish EXIT
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        command -v zstd >/dev/null || { sudo apt-get update -y && sudo apt-get install -y zstd; }
        export PREFETCHED_ARTIFACTS="${HOME}/prefetched"
        .argoci/scripts/load-cached-images calico
        cd kube-controllers
        make ${KC_TARGET}
