# app-policy `make ci`.
version: condensed-module

defaults:
  timeout: 1h
  # In the build image, with NATIVE_GO_BUILD running each recipe in place rather
  # than in a nested container.
  useGoBuild: true

steps:
  - name: app-policy-ci
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    depends: [check-go]
    requests: {cpu: 4500m, memory: 4.5Gi}
    goCache: read
    commands: |
      cd app-policy
      make ci
    reports: [app-policy/report:test-results]
