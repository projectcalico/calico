# app-policy `make ci`.
version: condensed-module

defaults:
  timeout: 1h

steps:
  - name: app-policy-ci
    # TEMPORARY: pins the step to the go-build cache pool until the handler does it.
    override:
      nodeSelector: {role: argoci, size: large, spot: "false", go-build-version: 1.27.3-llvm21.1.8-k8s1.37.1-1}
      tolerations: [{key: argoci, operator: Exists}, {key: argoci-nonspot, operator: Exists}, {key: argoci-large, operator: Exists}, {key: argoci-cached-images, operator: Exists}]
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
      - name: NATIVE_GO_BUILD
        value: "true"
    depends: [check-go, go-cache]
    cache:
      - {name: go, mode: read, path: /cache/go}
    requests: {cpu: 4500m, memory: 3.5Gi}
    useGoBuild: true
    # The image ships tools under /go/bin, which the default /go volume hides.
    workspaceVolumes: none
    commands: |
      "${CI_HOME}/${CI_GIT_DIR}/.argoci/scripts/restore-go-cache" app-policy-ci
      cd app-policy
      make ci
    epilogue: |
      # Epilogues don't inherit the commands' `cd` or exports.
      cd "${CI_HOME}/${CI_GIT_DIR}/app-policy"
      artifact push job report --destination test-results || true
