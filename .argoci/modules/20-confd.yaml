# confd `make ci`.
version: condensed-module

defaults:
  timeout: 1h
  services:
    - docker

steps:
  - name: confd-ci
    depends: [check-go]
    requests: {cpu: 2750m, memory: 3.25Gi}
    commands: |
      cd confd
      make ci
    epilogue: |
      # Epilogues don't inherit the commands' `cd` or exports.
      cd "${CI_HOME}/${CI_GIT_DIR}/confd"
      artifact push job report --destination test-results || true
