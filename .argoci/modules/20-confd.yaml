# confd `make ci`.
version: condensed-module

defaults:
  timeout: 1h
  # In the build image, with NATIVE_GO_BUILD running each recipe in place rather
  # than in a nested container.
  useGoBuild: true

steps:
  - name: confd-ci
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    depends: [check-go]
    requests: {cpu: 2750m, memory: 4Gi}
    goCache: read
    commands: |
      cd confd
      make ci
    reports: [confd/report:test-results]
