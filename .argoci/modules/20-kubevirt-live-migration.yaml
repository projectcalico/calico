# Live migration against a kind cluster with KubeVirt in simulation mode.
#
# On a machine rather than in a pod: the suites exercise SCTP, whose protocol
# module the container-optimised node image does not ship at all.
version: condensed-module

defaults:
  timeout: 1h30m
  runOn: vm
  services:
    - docker

steps:
  - name: kubevirt-live-migration
    vm:
      machineType: e2-standard-8
      diskType: pd-ssd
      diskSize: 200GB
    depends:
      - build-calico-image
      - build-node-image
      - build-operator-image
      - build-third-party-images
      - prerequisites
    env:
      - name: E2E_TEST_CONFIG
        value: e2e/config/kind/kubevirt.yaml
      # Route-priority propagation here is built on confd and BIRD programming
      # the cluster routes, and IPIP will not gain Felix-programmed live
      # migration — so the mode is pinned rather than defaulted.
      - name: EXTRA_VALUES_FILES
        value: hack/test/kind/infra/values-bird-routing.yaml
      - name: KUBEVIRT_RELEASE_URL
        value: https://github.com/tigera/kubevirt/releases/download/mockvirt-v1.8.1
      - name: BIRD_BGPPEER_CONTAINER_NAME
        value: bird-bgp-peer
    commands: |
      sudo apt-get update -y && sudo apt-get install -y make
      sudo modprobe sctp
      # The Makefiles call the kubectl they download by full path; the deploy
      # script and the tests' connection tester call it by name.
      export PATH="$(pwd)/hack/test/kind:${PATH}"
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      .argoci/scripts/load-cached-images calico node
      make -C e2e build
      make kind-up
      for f in ci-deploy-kind.sh kubevirt-operator.yaml kubevirt-cr.yaml; do
        hack/fetch-file "${KUBEVIRT_RELEASE_URL}/${f}" "/tmp/kubevirt-manifests/${f}"
      done
      chmod +x /tmp/kubevirt-manifests/ci-deploy-kind.sh
      MOCKVIRT_KUBECONFIG="$(pwd)/hack/test/kind/kind-kubeconfig.yaml" \
        MOCKVIRT_MANIFESTS_DIR=/tmp/kubevirt-manifests \
        /tmp/kubevirt-manifests/ci-deploy-kind.sh
      # The tests find this peer by name on the kind network.
      docker run -d --name "${BIRD_BGPPEER_CONTAINER_NAME}" --privileged --network kind calico/bird:v0.3.3-211-g9111ec3c
      make e2e-run KUBECONFIG="$(pwd)/hack/test/kind/kind-kubeconfig.yaml"
    epilogue: |
      copyFromVirtualMachine report report || true
      artifact push job report --destination test-results || true
      if [ "$CI_STEP_EXIT_CODE" != 0 ]; then
        # Collected where the cluster is; the script pushes its own bundle.
        sshOnVirtualMachine 'cd "${CI_HOME}/${CI_GIT_DIR}" && .semaphore/collect-kind-diags' || true
        # The snapshot tool ships in the CI image rather than on the machine, and
        # the machine has no registry credentials of its own. Worth the pull: the
        # cluster is gone once this returns.
        sshOnVirtualMachine 'docker login -u _json_key --password-stdin https://gcr.io < "${CI_ARTIFACT_SA_KEY_FILE}"' || true
        sshOnVirtualMachine 'cd "${CI_HOME}/${CI_GIT_DIR}" && docker run --rm --network host -v "$PWD:/w" -w /w gcr.io/tigera-cc-dev/ci-base/calico-ci:v0.2 kubectl-snapshot create --kubeconfig hack/test/kind/kind-kubeconfig.yaml -o kind-snapshot.tar.gz' || true
        copyFromVirtualMachine kind-snapshot.tar.gz kind-snapshot.tar.gz || true
        artifact push job kind-snapshot.tar.gz --destination kind-snapshot.tar.gz || true
      fi
