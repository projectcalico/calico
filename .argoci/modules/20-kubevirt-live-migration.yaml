# Live migration against a kind cluster with KubeVirt in simulation mode. On a
# VM because the suites exercise SCTP, which the pod nodes' image lacks.
version: condensed-module

defaults:
  tiers: []
  timeout: 1h30m
  # The compute SA createVM, runOnVM and the teardown authenticate with.
  secretBundles: [banzai-secrets]

steps:
  - name: kubevirt-live-migration
    depends:
      - build-calico-image
      - build-node-image
      - build-operator-image
      - build-third-party-images
      - build-e2e-binaries
      - check-go
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
      - name: E2E_TEST_CONFIG
        value: e2e/config/kind/kubevirt.yaml
      # Route-priority propagation here is built on confd and BIRD programming
      # the cluster routes, and IPIP will not gain Felix-programmed live
      # migration — so the mode is pinned rather than defaulted.
      - name: EXTRA_VALUES_FILES
        value: hack/test/kind/infra/values-bird-routing.yaml
      - name: KUBEVIRT_RELEASE_URL
        value: https://github.com/tigera/kubevirt/releases/download/mockvirt-v1.8.1
      - name: BIRD_BGPPEER_CONTAINER_NAME
        value: bird-bgp-peer
    checkout: true
    cache:
      - {name: calico-image-zst, mode: read, path: /cache/calico-image-zst}
      - {name: node-image, mode: read, path: /cache/node-image}
    runOnVM:
      createVM:
        machineType: e2-standard-8
        diskType: pd-ssd
        diskSize: 200GB
        maxRunDuration: 2h
      env:
        - BUILD_CACHE_GROUP
        - E2E_TEST_CONFIG
        - EXTRA_VALUES_FILES
        - KUBEVIRT_RELEASE_URL
        - BIRD_BGPPEER_CONTAINER_NAME
      put:
        - /cache/calico-image-zst:prefetched
        - /cache/node-image:prefetched
      source: |
        set -e
        repo="$(pwd)"
        # There is no epilogue on a machine; results go up on the way out.
        finish() {
          rc=$?
          cd "$repo"
          artifact push job "$repo/report" --destination test-results || true
          if [ "$rc" != 0 ]; then
            # The script pushes its own bundle.
            .semaphore/collect-kind-diags || true
            # The snapshot tool is only in the CI image; the shipped artifact key
            # pulls it.
            docker login -u _json_key --password-stdin https://gcr.io < "$HOME/.argoci/artifacts-sa.json" || true
            docker run --rm --network host -v "$repo:/w" -w /w gcr.io/tigera-cc-dev/ci-base/calico-ci:v0.4 kubectl-snapshot create --kubeconfig hack/test/kind/kind-kubeconfig.yaml -o kind-snapshot.tar.gz || true
            artifact push job "$repo/kind-snapshot.tar.gz" --destination kind-snapshot.tar.gz || true
          fi
          exit $rc
        }
        trap finish EXIT
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        sudo modprobe sctp
        # The Makefiles call the kubectl they download by full path; the deploy
        # script and the tests' connection tester call it by name.
        export PATH="$(pwd)/hack/test/kind:${PATH}"
        export PREFETCHED_ARTIFACTS="${HOME}/prefetched"
        .argoci/scripts/load-cached-images calico node
        .argoci/scripts/load-e2e-binaries
        make kind-up
        for f in ci-deploy-kind.sh kubevirt-operator.yaml kubevirt-cr.yaml; do
          hack/fetch-file "${KUBEVIRT_RELEASE_URL}/${f}" "/tmp/kubevirt-manifests/${f}"
        done
        chmod +x /tmp/kubevirt-manifests/ci-deploy-kind.sh
        MOCKVIRT_KUBECONFIG="$(pwd)/hack/test/kind/kind-kubeconfig.yaml" \
          MOCKVIRT_MANIFESTS_DIR=/tmp/kubevirt-manifests \
          /tmp/kubevirt-manifests/ci-deploy-kind.sh
        # The tests find this peer by name on the kind network.
        docker run -d --name "${BIRD_BGPPEER_CONTAINER_NAME}" --privileged --network kind calico/bird:v0.3.3-211-g9111ec3c
        make e2e-run KUBECONFIG="$(pwd)/hack/test/kind/kind-kubeconfig.yaml"
