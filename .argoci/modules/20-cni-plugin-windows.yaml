# Windows CNI FV against a kubeadm cluster of Azure VMs. On a machine of its own,
# since the Azure Service Operator that builds that cluster runs in a local kind
# cluster.
version: condensed-module

defaults:
  tiers: []
  timeout: 1h
  # The compute SA createVM, runOnVM and the teardowns authenticate with, and
  # the Azure service principal.
  secretBundles:
    - banzai-secrets

steps:
  - name: cni-plugin-windows-fv
    depends: [check-go, go-cache]
    cache:
      - {name: go, mode: read, path: /cache/go}
    matrix:
      - name: overlay
        env:
          - name: BACKEND
            value: overlay
      - name: l2bridge
        env:
          - name: BACKEND
            value: l2bridge
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
      - name: AZURE_LOCATION
        value: eastus2
      - name: KUBE_VERSION
        value: v1.34.13
      # Outside the checkout so the results push can find it without depending
      # on where the FV script left off.
      - name: LOGS_DIR
        value: /tmp/winfv-logs
    checkout: true
    runOnVM:
      createVM:
        machineType: e2-standard-4
      env: [BACKEND, BUILD_CACHE_GROUP, AZURE_LOCATION, KUBE_VERSION, LOGS_DIR, ARGOCI_RESOURCE_PREFIX, CI_WORKFLOW_NAME,
            AZ_SUBSCRIPTION_ID, AZ_TENANT_ID, AZ_SP_ID, AZ_SP_PASSWORD]
      put:
        - /cache/go/go-mod.tar.gz:.go-mod/go-mod.tar.gz
      source: |
        set -e
        .argoci/scripts/restore-go-cache cni-plugin-windows-fv ~/.go-mod
        repo="$(pwd)"
        for t in make python3; do command -v $t >/dev/null || { sudo apt-get update -y && sudo apt-get install -y $t; }; done
        command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        export AZURE_SUBSCRIPTION_ID="$AZ_SUBSCRIPTION_ID"
        export AZURE_TENANT_ID="$AZ_TENANT_ID"
        export AZURE_CLIENT_ID="$AZ_SP_ID"
        export AZURE_CLIENT_SECRET="$AZ_SP_PASSWORD"
        export AZURE_RESOURCE_GROUP="${ARGOCI_RESOURCE_PREFIX}-win-cni-${CI_WORKFLOW_NAME}-${BACKEND}-rg"
        az login --service-principal -u "$AZ_SP_ID" -p "$AZ_SP_PASSWORD" --tenant "$AZ_TENANT_ID" --output none
        # There is no epilogue on a machine: results go up, and the cluster comes
        # down, on the way out. cleanup-cloud-resources sweeps whatever a killed
        # machine leaves.
        finish() {
          rc=$?
          cd "$repo"
          # Skipped specs are reported as failures otherwise.
          python3 hack/strip-skipped-tests.py process/testing/winfv-cni-plugin/report/*.xml 2>/dev/null || true
          artifact push job "$repo/process/testing/winfv-cni-plugin/report" --destination test-results || true
          artifact push job "${LOGS_DIR}" --destination logs || true
          ( cd process/testing/aso && make dist-clean ) || true
          exit $rc
        }
        trap finish EXIT
        cd cni-plugin
        make bin/windows/calico.exe bin/windows/win-fv.exe
        ../process/testing/winfv-cni-plugin/run-win-fv.sh
