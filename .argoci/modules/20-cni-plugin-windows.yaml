# The Windows CNI FV, which cross-compiles the Windows binaries here and runs
# them against a kubeadm cluster of Azure VMs driven by Azure Service Operator.
#
# In a pod, not on a machine: the only local container work is the kind cluster
# that hosts the operator, and the CI image already carries `az` and an ssh
# client for the rest. The cluster itself is remote, so the step spends most of
# its hour waiting on Azure.
version: condensed-module

defaults:
  timeout: 1h
  services:
    - docker
  secretBundles:
    - banzai-secrets

steps:
  - name: cni-plugin-windows-fv
    depends: [check-go]
    requests: {cpu: 3, memory: 6Gi}
    matrix:
      - name: overlay
        env:
          - name: BACKEND
            value: overlay
      - name: l2bridge
        env:
          - name: BACKEND
            value: l2bridge
    env:
      - name: AZURE_LOCATION
        value: eastus2
      - name: KUBE_VERSION
        value: v1.33.7
      # Outside the checkout so the epilogue can find it without depending on
      # where the FV script left off.
      - name: LOGS_DIR
        value: /tmp/winfv-logs
    commands: |
      export AZURE_SUBSCRIPTION_ID="$AZ_SUBSCRIPTION_ID"
      export AZURE_TENANT_ID="$AZ_TENANT_ID"
      export AZURE_CLIENT_ID="$AZ_SP_ID"
      export AZURE_CLIENT_SECRET="$AZ_SP_PASSWORD"
      export AZURE_RESOURCE_GROUP="calico-win-cni-${CI_GIT_SHA:0:4}-pr${CI_GIT_PR_NUMBER:-merge}-${BACKEND}-rg"
      az login --service-principal -u "$AZ_SP_ID" -p "$AZ_SP_PASSWORD" --tenant "$AZ_TENANT_ID" --output none
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      cd cni-plugin
      make bin/windows/calico.exe bin/windows/win-fv.exe
      ../process/testing/winfv-cni-plugin/run-win-fv.sh
    epilogue: |
      cd "${CI_HOME}/${CI_GIT_DIR}"
      # Skipped specs are reported as failures otherwise.
      python3 hack/strip-skipped-tests.py process/testing/winfv-cni-plugin/report/*.xml 2>/dev/null || true
      artifact push job process/testing/winfv-cni-plugin/report --destination test-results || true
      artifact push job "${LOGS_DIR}" --destination logs || true
      # Azure resources outlive the step, so this runs even when the login above
      # is still valid from the commands.
      export AZURE_SUBSCRIPTION_ID="$AZ_SUBSCRIPTION_ID"
      export AZURE_TENANT_ID="$AZ_TENANT_ID"
      export AZURE_CLIENT_ID="$AZ_SP_ID"
      export AZURE_CLIENT_SECRET="$AZ_SP_PASSWORD"
      export AZURE_RESOURCE_GROUP="calico-win-cni-${CI_GIT_SHA:0:4}-pr${CI_GIT_PR_NUMBER:-merge}-${BACKEND}-rg"
      az login --service-principal -u "$AZ_SP_ID" -p "$AZ_SP_PASSWORD" --tenant "$AZ_TENANT_ID" --output none || true
      cd process/testing/aso && make dist-clean || true
