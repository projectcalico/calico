# Mock node test tool: lint, tests and image.
version: condensed-module

defaults:
  timeout: 1h

steps:
  - name: mock-node-ci
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
      - name: NATIVE_GO_BUILD
        value: "true"
    depends: [check-go, go-cache]
    # TEMPORARY: pins the step to the go-build cache pool until the handler does it.
    override:
      nodeSelector: {role: argoci, size: medium, go-build-version: 1.27.3-llvm21.1.8-k8s1.37.1-1}
      tolerations: [{key: argoci, operator: Exists}, {key: argoci-medium, operator: Exists}, {key: argoci-cached-images, operator: Exists}]
    requests: {cpu: 3000m, memory: 4Gi}
    useGoBuild: true
    # The image ships tools under /go/bin, which the default /go volume hides.
    workspaceVolumes: none
    cache:
      - {name: go, mode: read, path: /cache/go}
      - {name: mock-node-image-context, mode: write, path: /cache/mock-node-image-context}
    commands: |
      "${CI_HOME}/${CI_GIT_DIR}/.argoci/scripts/restore-go-cache" mock-node-ci
      make -C test-tools/mocknode test static-checks image-context
      cp -a test-tools/mocknode/bin/image-context-amd64/. /cache/mock-node-image-context/

  - name: mock-node-image-buildkit
    depends: [mock-node-ci]
    cache:
      - {name: mock-node-image-context, mode: read, path: /cache/mock-node-image-context}
      - {name: mock-node-image, mode: write, path: /cache/mock-node-image}
    buildkit:
      tag: mock-node:latest-amd64
      context: /cache/mock-node-image-context
      buildArgsFile: build-args
      tar: /cache/mock-node-image/mock-node-image.tar
