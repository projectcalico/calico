# key-cert-provisioner `make ci`.
version: condensed-module

defaults:
  timeout: 1h
  services:
    - docker

steps:
  - name: key-cert-provisioner-ci
    depends: [check-go]
    requests: {cpu: 3750m, memory: 2Gi}
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      cd key-cert-provisioner
      make ci
    epilogue: |
      # Epilogues don't inherit the commands' `cd` or exports.
      cd "${CI_HOME}/${CI_GIT_DIR}/key-cert-provisioner"
      artifact push job report --destination test-results || true
