# key-cert-provisioner `make ci`.
version: condensed-module

defaults:
  timeout: 1h
  # In the build image, with NATIVE_GO_BUILD running each recipe in place rather
  # than in a nested container.
  useGoBuild: true

steps:
  - name: key-cert-provisioner-ci
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    depends: [check-go]
    requests: {cpu: 3750m, memory: 3Gi}
    goCache: read
    commands: |
      cd key-cert-provisioner
      make ci
    reports: [key-cert-provisioner/report:test-results]
