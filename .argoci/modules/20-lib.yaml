# Step names share one flat namespace across every module, which is what lets
# `depends:` cross files unqualified — prefix them by component to avoid a
# collision, which is a hard error.
#
# Nothing here depends on the pre-flight checks: a dropped dependency cascades,
# so depending on a gated check would drop this too.
version: condensed-module

defaults:
  # Enough for lint plus tests across every submodule.
  timeout: 30m

  # Nothing here builds an image or needs a cluster, so the work runs in the
  # build image directly and needs no daemon or second pull.
  image: calico/go-build:1.27.1-llvm21.1.8-k8s1.37.0-1

steps:
  - name: lib-ci
    requests: {cpu: 3700m, memory: 2Gi}
    # The image ships ginkgo, gotestsum and the codegen tools under /go/bin,
    # which the default emptyDir over /go hides — as `command not found`,
    # minutes in.
    workspaceVolumes: none
    commands: |
      cd lib
      # Emptying the wrappers runs each recipe here instead of in a nested
      # container; the tools they call are already on PATH.
      make ci DOCKER_GO_BUILD= DOCKER_RUN= CALICO_BUILD=
    epilogue: |
      # Runs in the parent shell, so it inherits neither the `cd` above nor
      # anything the commands exported.
      cd "${CI_HOME}/${CI_GIT_DIR}/lib"
      artifact push job report --destination test-results || true
