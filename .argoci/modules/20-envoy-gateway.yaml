# envoy-gateway CI and cross-architecture builds.
version: condensed-module

defaults:
  timeout: 30m
  secretBundles: [banzai-secrets]

steps:
  - name: envoy-gateway-ci
    checkout: true
    runOnVM:
      createVM:
        machineType: e2-standard-8
      source: |
        set -e
        repo="$(pwd)"
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        cd third_party/envoy-gateway
        make ci

  # Cross-compiles only, so it needs no daemon.
  - name: envoy-gateway-build
    # TEMPORARY: pins the step to the go-build cache pool until the handler does it.
    override:
      nodeSelector: {role: argoci, size: medium, go-build-version: 1.27.3-llvm21.1.8-k8s1.37.1-1}
      tolerations: [{key: argoci, operator: Exists}, {key: argoci-medium, operator: Exists}, {key: argoci-cached-images, operator: Exists}]
    requests: {cpu: 5250m, memory: 4.5Gi}
    useGoBuild: true
    workspaceVolumes: none
    matrix:
      - name: arm64
        env: [{name: ARCH, value: arm64}]
      - name: ppc64le
        env: [{name: ARCH, value: ppc64le}]
      - name: s390x
        env: [{name: ARCH, value: s390x}]
    commands: |
      cd third_party/envoy-gateway
      # Empty wrappers run each recipe here rather than in a nested container.
      make build ARCH=$ARCH DOCKER_GO_BUILD= DOCKER_RUN= CALICO_BUILD=
