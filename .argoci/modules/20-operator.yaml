# The operator's own CI, plus a cross-architecture build of its binary.
#
# Both shell out to a nested build container: unauthenticated pulls are
# rate-limited, and it inherits only what is spliced in explicitly.
version: condensed-module

defaults:
  timeout: 1h
  services:
    - docker

steps:
  - name: operator-ci
    depends: [check-go]
    requests: {cpu: 5000m, memory: 6Gi}
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      cd operator
      make ci
    epilogue: |
      # Runs in the parent shell, so it inherits neither the `cd` above nor
      # anything the commands exported.
      cd "${CI_HOME}/${CI_GIT_DIR}/operator"
      artifact push job report --destination test-results || true

  # No cgo and no build constraints, so cross-compiling the binary is the whole
  # of the per-architecture coverage — the images are assembled at release.
  - name: operator-build
    depends: [check-go]
    requests: {cpu: 5000m, memory: 8Gi}
    matrix:
      - name: arm64
        env: [{name: ARCH, value: arm64}]
      - name: ppc64le
        env: [{name: ARCH, value: ppc64le}]
      - name: s390x
        env: [{name: ARCH, value: s390x}]
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      cd operator
      make build ARCH=$ARCH

  # The FV stands up a kind cluster and a local registry inside the docker
  # sidecar, then installs the components from this commit through the real
  # operator. Every image its operator resolves has to be in that registry, so a
  # producer missing here becomes calico-node stuck in Init rather than a build
  # error.
  - name: operator-fv
    depends: [build-calico-image, build-node-image, build-whisker-image, check-go]
    timeout: 1h
    requests: {cpu: 3500m, memory: 7Gi}
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      # The Makefiles call the kubectl they download by full path; the scripts
      # underneath call it by name.
      export PATH="$(pwd)/hack/test/kind:${PATH}"
      .argoci/scripts/load-cached-images calico node whisker
      cd operator
      make fv
    epilogue: |
      cd "${CI_HOME}/${CI_GIT_DIR}/operator"
      artifact push job report --destination test-results || true
