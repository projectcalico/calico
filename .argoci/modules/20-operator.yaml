# Operator CI, cross-architecture builds and FV.
version: condensed-module

defaults:
  timeout: 1h
  # The compute SA createVM, runOnVM and the teardowns authenticate with.
  secretBundles:
    - banzai-secrets

steps:
  - name: operator-ci
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
    depends: [check-go, go-cache]
    checkout: true
    cache:
      - {name: go, mode: read, path: /cache/go}
    runOnVM:
      createVM:
        machineType: e2-standard-8
      env: [BUILD_CACHE_GROUP]
      put:
        - /cache/go/go-mod.tar.gz:.go-mod/go-mod.tar.gz
      source: |
        set -e
        .argoci/scripts/restore-go-cache operator-ci ~/.go-mod
        repo="$(pwd)"
        finish() {
          rc=$?
          artifact push job "$repo/operator/report" --destination test-results || true
          exit $rc
        }
        trap finish EXIT
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        cd operator
        make ci

  # Pure Go, so cross-compiling is all the per-architecture coverage it needs,
  # and the build image can do it without docker.
  - name: operator-build
    # TEMPORARY: pins the step to the go-build cache pool until the handler does it.
    override:
      nodeSelector: {role: argoci, size: medium, go-build-version: 1.27.3-llvm21.1.8-k8s1.37.1-1}
      tolerations: [{key: argoci, operator: Exists}, {key: argoci-medium, operator: Exists}, {key: argoci-cached-images, operator: Exists}]
    depends: [check-go]
    requests: {cpu: 5000m, memory: 6Gi}
    useGoBuild: true
    workspaceVolumes: none
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    matrix:
      - name: arm64
        env: [{name: ARCH, value: arm64}]
      - name: ppc64le
        env: [{name: ARCH, value: ppc64le}]
      - name: s390x
        env: [{name: ARCH, value: s390x}]
    commands: |
      cd operator
      make build ARCH=$ARCH

  # Every image the FV installs must reach the local registry first; a missing
  # producer shows up as calico-node stuck in Init.
  - name: operator-fv
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
    depends: [build-calico-image, build-node-image, build-whisker-image, check-go, go-cache]
    checkout: true
    cache:
      - {name: calico-image-zst, mode: read, path: /cache/calico-image-zst}
      - {name: node-image, mode: read, path: /cache/node-image}
      - {name: whisker-image, mode: read, path: /cache/whisker-image}
      - {name: go, mode: read, path: /cache/go}
    runOnVM:
      createVM:
        machineType: e2-standard-8
      env: [BUILD_CACHE_GROUP]
      put:
        - /cache/calico-image-zst:prefetched
        - /cache/node-image:prefetched
        - /cache/whisker-image:prefetched
        - /cache/go/go-mod.tar.gz:.go-mod/go-mod.tar.gz
      source: |
        set -e
        .argoci/scripts/restore-go-cache operator-fv ~/.go-mod
        repo="$(pwd)"
        finish() {
          rc=$?
          artifact push job "$repo/operator/report" --destination test-results || true
          exit $rc
        }
        trap finish EXIT
        for t in make zstd; do command -v $t >/dev/null || { sudo apt-get update -y && sudo apt-get install -y $t; }; done
        # The Makefiles call the kubectl they download by full path; the scripts
        # underneath call it by name.
        export PATH="$(pwd)/hack/test/kind:${PATH}"
        export PREFETCHED_ARTIFACTS="${HOME}/prefetched"
        .argoci/scripts/load-cached-images calico node whisker
        cd operator
        make fv
