# node checks and UTs, plus its non-amd64 and Windows builds.
version: condensed-module

defaults:
  timeout: 1h

steps:
  - name: node-static-checks
    env:
      # TEMPORARY: the thread pool the old 6000m request gave, while the
      # request drops to the measured average.
      - name: GOMAXPROCS
        value: "6"
    # TEMPORARY: pins the step to the go-build cache pool until the handler does it.
    override:
      nodeSelector: {role: argoci, size: medium, go-build-version: 1.27.3-llvm21.1.8-k8s1.37.1-1}
      tolerations: [{key: argoci, operator: Exists}, {key: argoci-medium, operator: Exists}, {key: argoci-cached-images, operator: Exists}]
    depends: [check-go, go-cache]
    cache:
      - {name: go, mode: read, path: /cache/go}
    requests: {cpu: 5500m, memory: 5.5Gi}
    useGoBuild: true
    # The image ships tools under /go/bin, which the default /go volume hides.
    workspaceVolumes: none
    commands: |
      "${CI_HOME}/${CI_GIT_DIR}/.argoci/scripts/restore-go-cache" node-static-checks
      make -C node static-checks DOCKER_GO_BUILD= DOCKER_RUN= CALICO_BUILD=

  # On VMs for docker.
  - name: node-ut
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
    depends: [check-go, go-cache]
    # The compute SA createVM, runOnVM and the teardown authenticate with.
    secretBundles: [banzai-secrets]
    checkout: true
    cache:
      - {name: go, mode: read, path: /cache/go}
    runOnVM:
      createVM:
        machineType: e2-standard-8
      env: [BUILD_CACHE_GROUP]
      put:
        - /cache/go/go-mod.tar.gz:.go-mod/go-mod.tar.gz
      source: |
        set -e
        .argoci/scripts/restore-go-cache node-ut ~/.go-mod
        repo="$(pwd)"
        # There is no epilogue on a machine; results go up on the way out.
        finish() {
          rc=$?
          artifact push job "$repo/node/report" --destination test-results || true
          exit $rc
        }
        trap finish EXIT
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        cd node
        make ut

  # Emulated, so each of these is closer to twenty minutes than two.
  - name: node-build
    depends: [build-nft-rpms, check-go, go-cache]
    secretBundles: [banzai-secrets]
    checkout: true
    cache:
      - {name: go, mode: read, path: /cache/go}
    matrix:
      - name: arm64
        env: [{name: ARCH, value: arm64}]
      - name: ppc64le
        env: [{name: ARCH, value: ppc64le}]
      - name: s390x
        env: [{name: ARCH, value: s390x}]
    runOnVM:
      createVM:
        machineType: e2-standard-4
      env: [ARCH]
      put:
        - /cache/go/go-mod.tar.gz:.go-mod/go-mod.tar.gz
      source: |
        set -e
        .argoci/scripts/restore-go-cache node-build ~/.go-mod
        repo="$(pwd)"
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        command -v zstd >/dev/null || { sudo apt-get update -y && sudo apt-get install -y zstd; }
        # Resolves the Dockerfile's nft-rpms build context locally, so BuildKit
        # does not go back to the registry for it.
        .argoci/scripts/load-nft-rpms.sh "${ARCH}"
        cd node
        make image ARCH=$ARCH
