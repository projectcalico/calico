# node checks and UTs, plus its non-amd64 and Windows builds.
version: condensed-module

defaults:
  timeout: 1h

steps:
  - name: node-static-checks
    depends: [check-go]
    requests: {cpu: 6000m, memory: 3.75Gi}
    image: calico/go-build:1.27.1-llvm21.1.8-k8s1.37.0-1
    # The image ships tools under /go/bin, which the default /go volume hides.
    workspaceVolumes: none
    commands: |
      make -C node static-checks DOCKER_GO_BUILD= DOCKER_RUN= CALICO_BUILD=

  - name: node-ut
    depends: [check-go]
    requests: {cpu: 4250m, memory: 3Gi}
    services:
      - docker
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      cd node
      make ut
    epilogue: |
      # Epilogues don't inherit the commands' `cd` or exports.
      cd "${CI_HOME}/${CI_GIT_DIR}/node"
      artifact push job report --destination test-results || true

  # Emulated, so each of these is closer to twenty minutes than two.
  - name: node-build
    depends: [build-nft-rpms, check-go]
    requests: {cpu: 2000m, memory: 4Gi}
    services:
      - docker
    matrix:
      - name: arm64
        env: [{name: ARCH, value: arm64}]
      - name: ppc64le
        env: [{name: ARCH, value: ppc64le}]
      - name: s390x
        env: [{name: ARCH, value: s390x}]
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      # Resolves the Dockerfile's nft-rpms build context locally, so BuildKit
      # does not go back to the registry for it.
      .argoci/scripts/load-nft-rpms.sh "${ARCH}"
      cd node
      make image ARCH=$ARCH

  # Nothing else in CI builds these, so a break surfaces here or at release.
  - name: node-build-windows
    depends: [check-go]
    requests: {cpu: 2000m, memory: 4Gi}
    services:
      - docker
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      cd node
      make build-windows-archive
      make image-windows
