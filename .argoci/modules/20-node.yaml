# The checks unique to node/, plus the architectures the amd64 producer does
# not cover. The amd64 image itself is built once for the whole workflow, as a
# prerequisite the test lanes consume.
version: condensed-module

defaults:
  timeout: 1h

steps:
  - name: node-static-checks
    depends: [check-go]
    requests: {cpu: 6000m, memory: 3.75Gi}
    image: calico/go-build:1.27.1-llvm21.1.8-k8s1.37.0-1
    # The image ships the linters under /go/bin, which the default emptyDir over
    # /go hides — as `command not found`, minutes in.
    workspaceVolumes: none
    commands: |
      make -C node static-checks DOCKER_GO_BUILD= DOCKER_RUN= CALICO_BUILD=

  - name: node-ut
    depends: [check-go]
    requests: {cpu: 4250m, memory: 3Gi}
    services:
      - docker
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      cd node
      make ut
    epilogue: |
      # Runs in the parent shell, so it inherits neither the `cd` above nor
      # anything the commands exported.
      cd "${CI_HOME}/${CI_GIT_DIR}/node"
      artifact push job report --destination test-results || true

  # Emulated, so each of these is closer to twenty minutes than two.
  - name: node-build
    depends: [build-nft-rpms, check-go]
    requests: {cpu: 2000m, memory: 4Gi}
    services:
      - docker
    matrix:
      - name: arm64
        env: [{name: ARCH, value: arm64}]
      - name: ppc64le
        env: [{name: ARCH, value: ppc64le}]
      - name: s390x
        env: [{name: ARCH, value: s390x}]
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      # Resolves the Dockerfile's nft-rpms build context locally, so BuildKit
      # does not go back to the registry for it.
      .argoci/scripts/load-nft-rpms.sh "${ARCH}"
      cd node
      make image ARCH=$ARCH

  # The archive is what the Windows installer ships; the image is what a Windows
  # node pulls. Neither is exercised anywhere else in the workflow, so a break in
  # either surfaces here or at release.
  - name: node-build-windows
    depends: [check-go]
    requests: {cpu: 2000m, memory: 4Gi}
    services:
      - docker
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      cd node
      make build-windows-archive
      make image-windows
