# Calico's OpenStack integration: the plugin's own tests, and a mainline run
# against a DevStack the job builds from scratch.
version: condensed-module

defaults:
  timeout: 1h
  # The compute SA createVM, runOnVM and the teardowns authenticate with.
  secretBundles: [banzai-secrets]

steps:
  # On a VM for docker.
  - name: openstack-tox
    depends: [check-python]
    checkout: true
    runOnVM:
      createVM:
        machineType: e2-standard-4
      source: |
        set -e
        repo="$(pwd)"
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        cd networking-calico
        # Separate invocations: named as two targets, a parallel make would run
        # them at once and have both tox runs share one .tox/ tree.
        make tox-caracal
        make tox-fv-caracal

  # DevStack installs OpenStack over the machine it runs on — uninstalling
  # system packages as it goes — so it gets one of its own.
  - name: openstack-devstack
    tiers: []
    depends: [check-python]
    # Longer than the default hour: DevStack installs the whole control plane.
    timeout: 2h
    checkout: true
    runOnVM:
      createVM:
        # e2, like the other machines, because the hyperdisk families ran out of
        # capacity across the whole region.
        machineType: e2-standard-8
        diskSize: 100GB
        maxRunDuration: 2h30m
        # This DevStack release needs Ubuntu 22.04's Python; the CI base image is newer.
        vmFamily: ubuntu-2204-lts
        vmImageProject: ubuntu-os-cloud
      env: [LENS_ELASTICSEARCH_USER, LENS_ELASTICSEARCH_TOKEN]
      source: |
        set -e
        repo="$(pwd)"
        # There is no epilogue on a machine; results go up on the way out.
        finish() {
          rc=$?
          mkdir -p ~/logs && sudo journalctl > ~/logs/journalctl.txt || true
          artifact push job ~/logs --destination logs || true
          # Keep the perf documents, so they can be inspected even when Lens did
          # not get them.
          artifact push job "$repo/artifacts/perf" -d perf -f || true
          exit $rc
        }
        trap finish EXIT
        # Launchpad's PPA returns 503s in bursts, and apt's default three retries
        # are spent in under half a minute; ten back off for about three.
        echo 'Acquire::Retries "10";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
        sudo apt-get remove -y python3-wrapt || true
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        # The stock image has no docker, which the perf results uploader builds with.
        command -v docker >/dev/null || { curl -fsSL https://get.docker.com | sudo sh && sudo chmod 666 /var/run/docker.sock; }
        # The default is not where this checkout lands.
        export CALICO_REPO_DIR="$repo"
        cd networking-calico
        # DevStack installs the plugin from a ref, so the commit under test needs
        # to be one rather than a detached head.
        git checkout -b devstack-test
        export NC_PLUGIN_REPO=$(dirname $(pwd))
        export NC_PLUGIN_REF=$(git rev-parse --abbrev-ref HEAD)
        sudo git config --system --add safe.directory ${NC_PLUGIN_REPO}/.git
        # A single-node setup does not need BGP, and ours logs errors without it.
        export CALICO_BGP_MODE=none
        # Enough rungs to show scaling is still linear; the nightly runs more.
        export RESYNC_SCALES=100,1000
        # RESYNC_SKIP_FINAL_CLEANUP does not belong here: Tempest runs against
        # this same DevStack afterwards, and the fake agents the benchmark leaves
        # behind break instance networking for it.
        # The user comes from the secret too, so rotating to another account keeps
        # publishing.
        export ELASTICSEARCH_URL=https://banzai-lens-es.dev-tools.tigera.net:9200
        export ELASTICSEARCH_USER=${LENS_ELASTICSEARCH_USER}
        export ELASTICSEARCH_TOKEN=${LENS_ELASTICSEARCH_TOKEN}
        # A failed stack.sh leaves its log filter and an async FIFO reader holding
        # this SSH session's output, so the step would wait out its timeout.
        rc=0
        TEMPEST=true OPENSTACK_RELEASE=caracal ./devstack/bootstrap.sh || rc=$?
        # Bracketed so the patterns don't match the sudo running pkill.
        sudo pkill -f '/opt/stack/devstack/tools/[o]utfilter\.py' || true
        sudo pkill -f '^[c]at /opt/stack/async/' || true
        exit $rc
