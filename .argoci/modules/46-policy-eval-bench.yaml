# Pending-policy evaluation benchmarks, engine and collector, on PRs. The numbers
# go to the log and the job's artifacts only: publishing to Lens happens on merge,
# in .argoci/publish/policy-eval-bench.yaml, so the Lens credentials never meet a
# PR's code.
version: condensed-module

defaults:
  timeout: 45m
  # In the build image, with NATIVE_GO_BUILD running each recipe in place rather
  # than in a nested container.
  useGoBuild: true
  # The image ships tools under /go/bin, which the default /go volume hides.
  workspaceVolumes: none

steps:
  - name: policy-eval-bench
    # Merges run the publishing workflow instead.
    when: GIT_REF_TYPE == 'PR'
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
      - name: NATIVE_GO_BUILD
        value: "true"
    depends: [check-go]
    # The benchmarks run on one CPU; a fixed request keeps the numbers free of steps
    # that come from the node rather than the code.
    requests: {cpu: 2000m, memory: 4Gi}
    commands: |
      make -C app-policy bench-policy-eval
      make -C felix bench-policy-eval
    epilogue: |
      # Epilogues don't inherit the commands' `cd` or exports.
      cd "${CI_HOME}/${CI_GIT_DIR}"
      artifact push job artifacts/perf || true
