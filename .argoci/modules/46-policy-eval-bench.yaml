# Pending-policy evaluation benchmarks, engine and collector, published for trend
# tracking rather than as a gate.
version: condensed-module

defaults:
  timeout: 45m
  # In the build image, with NATIVE_GO_BUILD running each recipe in place rather
  # than in a nested container.
  useGoBuild: true
  # The image ships tools under /go/bin, which the default /go volume hides.
  workspaceVolumes: none

steps:
  - name: policy-eval-bench
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
      - name: NATIVE_GO_BUILD
        value: "true"
    depends: [check-go]
    # The benchmarks run on one CPU; a fixed request keeps the trend free of steps
    # that come from the node rather than the code.
    requests: {cpu: 2000m, memory: 4Gi}
    secretBundles:
      - name: banzai-secrets
        keys:
          - name: LENS_ELASTICSEARCH_USER
          - name: LENS_ELASTICSEARCH_TOKEN
    commands: |
      make -C app-policy bench-policy-eval
      make -C felix bench-policy-eval
      make bin/send-perf-results
      # The user comes from the secret too, so rotating to another account keeps
      # publishing.
      export ELASTICSEARCH_URL=https://banzai-lens-es.dev-tools.tigera.net:9200
      export ELASTICSEARCH_USER=${LENS_ELASTICSEARCH_USER}
      export ELASTICSEARCH_TOKEN=${LENS_ELASTICSEARCH_TOKEN}
      # No-ops if the credentials are unset.
      ./bin/send-perf-results --dir artifacts/perf
    epilogue: |
      # Epilogues don't inherit the commands' `cd` or exports.
      cd "${CI_HOME}/${CI_GIT_DIR}"
      artifact push job artifacts/perf || true
