# Release tooling CI, and the release binary the promotions use.
version: condensed-module

defaults:
  timeout: 30m
  useGoBuild: true

steps:
  - name: release-ci
    depends: [check-go]
    requests: {cpu: 4000m, memory: 2Gi}
    image: gcr.io/tigera-cc-dev/ci-base/calico-ci:v0.4
    services:
      - docker
    commands: |
      # A fork carries no tags, and the tests parse a version from them.
      git fetch --tags --quiet "https://github.com/${CI_GIT_REPO_SLUG}.git" || true
      cd release
      make ci
    epilogue: |
      # Epilogues don't inherit the commands' `cd` or exports.
      cd "${CI_HOME}/${CI_GIT_DIR}/release"
      artifact push job report --destination test-results || true

  # Needs docker: `bin/release` splices its own flags into a nested `docker run`.
  - name: release-build
    depends: [check-go]
    requests: {cpu: 2750m, memory: 2Gi}
    image: gcr.io/tigera-cc-dev/ci-base/calico-ci:v0.4
    services:
      - docker
    commands: |
      cd release
      make build
      # A promotion is a separate run with its own artifact namespace, so the
      # commit is what ties the two together.
      artifact cache store "release-${CI_GIT_SHA}" bin

  - name: release-st
    depends: [check-go, release-build]
    timeout: 2h
    requests: {cpu: 3500m, memory: 8Gi}
    image: gcr.io/tigera-cc-dev/ci-base/calico-ci:v0.4
    services:
      - docker
    secretBundles:
      - iss-image-scanning
      - releasebot-slack
      - name: argoci-hashrelease-publisher
        keys:
          - name: argoci-hashrelease-publisher.json
            as: HASHRELEASE_PUBLISHER_KEY
            localFile: /root/secrets/hashrelease-publisher.json
    env:
      - name: HASHRELEASE_SERVER_BUCKET
        value: hashreleaseserver-static
    commands: |
      # A fork carries no tags, and the version comes from them.
      git fetch --tags --quiet "https://github.com/${CI_GIT_REPO_SLUG}.git" || true
      $(command -v sudo) apt-get update -qq && $(command -v sudo) apt-get install -y -qq --no-install-recommends rsync
      # Kept out of the epilogue, whose artifact push needs the CI account.
      export CLOUDSDK_CONFIG="$(mktemp -d)"
      export GOOGLE_APPLICATION_CREDENTIALS=/root/secrets/hashrelease-publisher.json
      gcloud auth activate-service-account --key-file="${GOOGLE_APPLICATION_CREDENTIALS}"
      cd release
      make st
    epilogue: |
      artifact push job "${CI_HOME}/${CI_GIT_DIR}/release/_logs" --destination release-st-logs || true
