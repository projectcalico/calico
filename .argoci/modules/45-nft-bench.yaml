# nftables dataplane benchmark, published for trend tracking rather than as a
# gate. On a VM because it programs a real nftables table.
version: condensed-module

defaults:
  tiers: []

steps:
  - name: nft-bench
    # The test binary builds cold: the go cache disk attaches in one zone only,
    # and one machine type in one zone stocks out.
    timeout: 45m
    secretBundles:
      - name: banzai-secrets
        keys:
          - name: LENS_ELASTICSEARCH_USER
          - name: LENS_ELASTICSEARCH_TOKEN
    checkout: true
    runOnVM:
      createVM:
        # Two vCPUs, matching what this has always been measured on. Any fixed
        # size works; changing it puts a step in the trend that is not a code
        # change.
        machineType: e2-standard-2
      env: [LENS_ELASTICSEARCH_USER, LENS_ELASTICSEARCH_TOKEN]
      source: |
        set -euo pipefail
        # Kept even when the run fails, so a bad number can be looked at.
        trap 'artifact push job artifacts/perf || true' EXIT
        sudo apt-get update -y && sudo apt-get install -y nftables
        make -C felix bin/nft.test
        make bin/send-perf-results
        mkdir -p artifacts/perf
        # A few iterations is enough for a stable steady-state number.
        sudo env NFT_BENCH_PERF_ARTIFACTS_DIR="$(pwd)/artifacts/perf" \
          felix/bin/nft.test -test.run='^$' -test.bench=. -test.benchmem -test.benchtime=6x
        # The user comes from the secret too, so rotating to another account keeps
        # publishing.
        export ELASTICSEARCH_URL=https://banzai-lens-es.dev-tools.tigera.net:9200
        export ELASTICSEARCH_USER=${LENS_ELASTICSEARCH_USER}
        export ELASTICSEARCH_TOKEN=${LENS_ELASTICSEARCH_TOKEN}
        # No-ops if the credentials are unset.
        ./bin/send-perf-results --dir artifacts/perf
