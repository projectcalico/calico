# Calico's Istio integration images, built from upstream Istio sources. On VMs
# for docker.
version: condensed-module

defaults:
  timeout: 1h
  secretBundles: [banzai-secrets]

steps:
  - name: istio-ci
    depends: [build-nft-rpms]
    checkout: true
    runOnVM:
      createVM:
        machineType: e2-standard-8
      source: |
        set -e
        repo="$(pwd)"
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        command -v zstd >/dev/null || { sudo apt-get update -y && sudo apt-get install -y zstd; }
        # Resolves the install-cni Dockerfile's nft-rpms base locally.
        .argoci/scripts/load-nft-rpms.sh amd64
        cd istio
        make ci

  # Binaries only, so no nft-rpms dependency. ztunnel cross-compiles, so no
  # arm64 runner either.
  - name: istio-build
    matrix:
      - name: arm64
        env:
          - name: ARCH
            value: arm64
    checkout: true
    runOnVM:
      createVM:
        machineType: e2-standard-8
      env: [ARCH]
      source: |
        set -e
        repo="$(pwd)"
        command -v make >/dev/null || { sudo apt-get update -y && sudo apt-get install -y make; }
        cd istio
        make build ARCH=$ARCH
