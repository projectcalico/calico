# Felix's own checks, and the FV fleet.
#
# The FVs do not run here: they need a real kernel per dataplane and per Ubuntu
# release, so a lane brings up a fleet of GCE VMs, runs a batch of specs on each
# and tears them down. This step orchestrates that from a pod — it compiles
# nothing and spends its hour on ssh.
version: condensed-module

defaults:
  timeout: 1h
  env:
    # A cold build would re-clone libbpf, re-exposing the github.com/libbpf HTTP
    # 500 flake. The tarball the calico-image producer ships is the only source
    # any of these steps should need.
    - name: NO_LIBBPF_CLONE
      value: "true"

steps:
  # Producer for the FV fleet: everything a test VM unpacks comes from here, so
  # a lane whose batches all fail to configure usually failed in this step.
  - name: felix-build
    depends: [build-calico-image, check-go]
    timeout: 40m
    requests: {cpu: 4000m, memory: 8Gi}
    services:
      - docker
    secretBundles:
      - name: google-service-account-for-gce
        keys:
          - name: google-service-account-for-gce-key.json
            as: GCE_SERVICE_ACCOUNT_KEY
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      source .argoci/scripts/vm-fleet-setup.sh
      .argoci/scripts/load-cached-images calico
      .semaphore/scripts/load-felix-prereqs.sh
      cd felix
      # REMOTE_DEPS= keeps this from rebuilding the calico image and race binary
      # the producer already shipped. `make build` is skipped with it: on amd64
      # that also cross-compiles the Windows binary, which has its own step and
      # which nothing in the Linux FV path consumes.
      make REMOTE_DEPS= bin/calico-felix image ut-bpf-prereqs fv-prereqs
      ./.semaphore/cache-test-artifacts

  - name: felix-static-checks
    depends: [build-calico-image, check-go]
    timeout: 30m
    requests: {cpu: 4000m, memory: 6Gi}
    services:
      - docker
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      .argoci/scripts/load-cached-images calico
      .semaphore/scripts/load-felix-prereqs.sh
      cd felix
      make static-checks

  # Produces nothing the FV fleet consumes, so it runs alongside rather than
  # ahead of it.
  - name: felix-ut
    depends: [build-calico-image, check-go]
    timeout: 45m
    requests: {cpu: 4000m, memory: 6Gi}
    services:
      - docker
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      .argoci/scripts/load-cached-images calico
      .semaphore/scripts/load-felix-prereqs.sh
      cd felix
      make ut
    epilogue: |
      cd "${CI_HOME}/${CI_GIT_DIR}/felix"
      artifact push job report --destination test-results || true

  # k8sfv runs the combined binary as `component typha`, so it needs the same
  # preloaded image the FVs do.
  - name: felix-k8sfv
    depends: [build-calico-image, check-go]
    timeout: 30m
    requests: {cpu: 3000m, memory: 6Gi}
    services:
      - docker
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      .argoci/scripts/load-cached-images calico
      .semaphore/scripts/load-felix-prereqs.sh
      cd felix
      make REMOTE_DEPS= k8sfv-test JUST_A_MINUTE=true USE_TYPHA=true
      make REMOTE_DEPS= k8sfv-test JUST_A_MINUTE=true USE_TYPHA=false
    epilogue: |
      cd "${CI_HOME}/${CI_GIT_DIR}/felix"
      artifact push job report --destination test-results || true

  # FELIX_TEST_GROUP is the whole configuration: fv-prologue reads the Ubuntu
  # release, the dataplane, whether UTs come along and how many batches to split
  # into out of this one string.
  #
  # The step outlives JOB_TIMEOUT_MINUTES on purpose. That is the fleet's own
  # watchdog, which captures a hung VM's serial console and pushes it before
  # killing the batch; a step deadline reached first would take the diagnostics
  # with it.
  - name: felix-fv
    depends: [felix-build]
    timeout: 1h15m
    requests: {cpu: 2000m, memory: 4Gi}
    secretBundles:
      - name: google-service-account-for-gce
        keys:
          - name: google-service-account-for-gce-key.json
            as: GCE_SERVICE_ACCOUNT_KEY
    env:
      - name: JOB_TIMEOUT_MINUTES
        value: "60"
    matrix:
      - name: iptables-2204
        env:
          - name: FELIX_TEST_GROUP
            value: 22.04-ipt
          - name: NUM_FV_BATCHES
            value: "16"
      - name: nftables-2204
        env:
          - name: FELIX_TEST_GROUP
            value: 22.04-nft
          - name: NUM_FV_BATCHES
            value: "16"
      - name: bpf-2404-iptables
        env:
          - name: FELIX_TEST_GROUP
            value: bpf-24.04-ipt-with-ut
          - name: NUM_FV_BATCHES
            value: "60"
      - name: bpf-2204-nftables
        env:
          - name: FELIX_TEST_GROUP
            value: bpf-22.04-nft-with-ut
          - name: FELIX_FV_BPFATTACHTYPE
            value: tc
          # Conntrack only, to keep the lane inside its hour.
          - name: FV_FOCUS
            value: _BPF_.*ct=true
          - name: NUM_FV_BATCHES
            value: "10"
      - name: bpf-2604-netkit
        env:
          - name: FELIX_TEST_GROUP
            value: bpf-26.04-nft-no-fv-with-ut
          # No FELIX_FV_BPFATTACHTYPE: this lane covers netkit attachment, which
          # the default selects for netkit workload devices. Naming one
          # mechanism would opt the node out of netkit entirely.
          - name: FELIX_FV_NETKIT
            value: Enabled
          - name: NUM_FV_BATCHES
            value: "60"
      - name: bpf-2604-jitharden
        env:
          - name: FELIX_TEST_GROUP
            value: bpf-26.04-nft-with-ut-jitharden
          - name: FELIX_FV_BPFATTACHTYPE
            value: tc
          # TCP and conntrack only, to keep the lane inside its hour.
          - name: FV_FOCUS
            value: _BPF_.*tcp.*ct=true
          - name: NUM_FV_BATCHES
            value: "16"
    commands: |
      source .argoci/scripts/vm-fleet-setup.sh
      source felix/.semaphore/fv-prologue
      .semaphore/vms/run-tests-on-vms "${VM_PREFIX}"
    epilogue: |
      # The commands ran in a subshell, so none of what fv-prologue derived —
      # VM_PREFIX above all — survives to here. Re-deriving it is what makes the
      # VM teardown below reach the fleet this lane created.
      cd "${CI_HOME}/${CI_GIT_DIR}"
      source .argoci/scripts/vm-fleet-setup.sh
      source felix/.semaphore/fv-prologue
      source felix/.semaphore/fv-epilogue

  # The Windows binaries the FV installs. Built here rather than in felix-build
  # because nothing in the Linux FV path consumes them.
  - name: felix-build-windows
    depends: [check-go]
    requests: {cpu: 4250m, memory: 5.5Gi}
    services:
      - docker
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      cd felix
      make bin/calico-felix.exe fv/win-fv.exe

  # A kubeadm cluster of Azure VMs driven by Azure Service Operator, installed
  # from the images this commit built rather than a published hashrelease.
  - name: felix-windows-fv
    depends: [felix-build-windows, build-calico-image, build-node-image]
    timeout: 1h30m
    requests: {cpu: 3000m, memory: 6Gi}
    services:
      - docker
    secretBundles:
      - banzai-secrets
    env:
      - name: FV_TYPE
        value: calico-felix
      - name: RELEASE_STREAM
        value: local-build
      - name: HASH_RELEASE
        value: "false"
      - name: CONTAINERD_VERSION
        value: 1.7.28
      # Outside the checkout so the epilogue finds it wherever the FV script
      # left off.
      - name: LOGS_DIR
        value: /tmp/winfv-felix-logs
    commands: |
      export AZURE_SUBSCRIPTION_ID="$AZ_SUBSCRIPTION_ID"
      export AZURE_TENANT_ID="$AZ_TENANT_ID"
      export AZURE_CLIENT_ID="$AZ_SP_ID"
      export AZURE_CLIENT_SECRET="$AZ_SP_PASSWORD"
      export AZURE_RESOURCE_GROUP="calico-win-felix-${CI_GIT_SHA:0:4}-pr${CI_GIT_PR_NUMBER:-merge}-rg"
      export REPORT_DIR="${CI_HOME}/${CI_GIT_DIR}/process/testing/winfv-felix/report"
      az login --service-principal -u "$AZ_SP_ID" -p "$AZ_SP_PASSWORD" --tenant "$AZ_TENANT_ID" --output none
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      .argoci/scripts/load-cached-images calico node
      ./process/testing/winfv-felix/run-win-fv.sh
    epilogue: |
      cd "${CI_HOME}/${CI_GIT_DIR}"
      # Skipped specs are reported as failures otherwise.
      python3 hack/strip-skipped-tests.py process/testing/winfv-felix/report/*.xml 2>/dev/null || true
      artifact push job process/testing/winfv-felix/report --destination test-results || true
      artifact push job "${LOGS_DIR}" --destination logs || true
      # Azure resources outlive the step, so this logs in again rather than
      # relying on the session the commands opened.
      export AZURE_SUBSCRIPTION_ID="$AZ_SUBSCRIPTION_ID"
      export AZURE_TENANT_ID="$AZ_TENANT_ID"
      export AZURE_CLIENT_ID="$AZ_SP_ID"
      export AZURE_CLIENT_SECRET="$AZ_SP_PASSWORD"
      export AZURE_RESOURCE_GROUP="calico-win-felix-${CI_GIT_SHA:0:4}-pr${CI_GIT_PR_NUMBER:-merge}-rg"
      az login --service-principal -u "$AZ_SP_ID" -p "$AZ_SP_PASSWORD" --tenant "$AZ_TENANT_ID" --output none || true
      cd process/testing/aso && make dist-clean || true
