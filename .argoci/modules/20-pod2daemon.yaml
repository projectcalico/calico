# pod2daemon `make ci`. Through docker, not natively in go-build: the CSI
# driver tests mount filesystems, which needs a privileged container.
version: condensed-module

defaults:
  timeout: 1h
  services:
    - docker

steps:
  - name: pod2daemon-ci
    env:
      - name: BUILD_CACHE_GROUP
        value: calico
    depends: [check-go]
    requests: {cpu: 2750m, memory: 2Gi}
    commands: |
      cd pod2daemon
      make ci
    reports: [pod2daemon/report:test-results]
