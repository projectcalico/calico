# pod2daemon `make ci`.
version: condensed-module

defaults:
  timeout: 1h
  useGoBuild: true

steps:
  - name: pod2daemon-ci
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    depends: [check-go]
    requests: {cpu: 2750m, memory: 2Gi}
    goCache: read
    commands: |
      cd pod2daemon
      make ci
    reports: [pod2daemon/report:test-results]
