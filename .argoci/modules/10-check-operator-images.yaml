# Fails when an image is built but missing from the operator's component list.
# BUILD_IMAGES lives in the component Makefiles, hence those triggers.
version: condensed-module

defaults:
  timeout: 1h
  # In the build image, with NATIVE_GO_BUILD running each recipe in place rather
  # than in a nested container.
  useGoBuild: true
  # The image ships tools under /go/bin, which the default /go volume hides.
  workspaceVolumes: none

steps:
  - name: check-operator-images
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    requests: {cpu: 2250m, memory: 3Gi}
    commands: |
      cd release
      make check-operator-images
