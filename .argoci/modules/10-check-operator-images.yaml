# Fails when an image is built but missing from the operator's component list.
# BUILD_IMAGES lives in the component Makefiles, hence those triggers.
version: condensed-module

defaults:
  timeout: 1h
  services:
    - docker

steps:
  - name: check-operator-images
    requests: {cpu: 2250m, memory: 2Gi}
    commands: |
      cd release
      make check-operator-images
