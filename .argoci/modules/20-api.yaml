# api `make ci`, and the offline validation tests under test/.
version: condensed-module

defaults:
  timeout: 30m
  services:
    - docker

steps:
  - name: api-ci
    depends: [check-manifests]
    requests: {cpu: 2750m, memory: 2.25Gi}
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      cd api
      make ci
    epilogue: |
      cd "${CI_HOME}/${CI_GIT_DIR}/api"
      artifact push job report --destination test-results || true

  - name: api-validation
    depends: [check-manifests]
    requests: {cpu: 3000m, memory: 2.25Gi}
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      cd test
      make ci
    epilogue: |
      cd "${CI_HOME}/${CI_GIT_DIR}/test"
      artifact push job report --destination test-results || true
