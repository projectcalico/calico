# The `api` step stands up a kind cluster inside the docker sidecar: the nodes
# and the local registry become containers there, and their published ports land
# on the pod loopback the step shares. Both steps bind-mount into the nested
# build container, which only resolves because the paths sit under /src.
#
# That container is also why each step logs in and forwards the proxy itself:
# unauthenticated pulls are rate-limited, and it inherits only what is spliced
# into the run explicitly.
version: condensed-module

defaults:
  timeout: 30m
  services:
    - docker

steps:
  - name: api-ci
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      cd api
      make ci
    epilogue: |
      cd "${CI_HOME}/${CI_GIT_DIR}/api"
      artifact push job report --destination test-results || true

  - name: api-validation
    commands: |
      echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"
      cd test
      make ci
    epilogue: |
      cd "${CI_HOME}/${CI_GIT_DIR}/test"
      artifact push job report --destination test-results || true
