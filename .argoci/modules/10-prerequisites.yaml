# Pre-flight checks, and the artifacts later lanes consume. Each step gates
# itself, and a lane that runs brings back any producer it depends on, so a
# producer gates only on what makes it interesting in its own right.
version: condensed-module

defaults:
  timeout: 1h

steps:
  - name: check-yaml
    env:
      - name: NATIVE_PYTHON
        value: "true"
    jobSize: medium
    requests: {cpu: 3500m, memory: 1Gi}
    useGoBuild: true
    changes:
      in:
        - ^.*\.ya?ml$
        - ^Makefile$
        - ^lib\.Makefile$
        - ^metadata\.mk$
        - ^\.argoci/modules/10-prerequisites\.yaml$
    commands: |
      make yaml-lint

  # go vet fans out across every package, so it scales with the cores it gets.
  - name: check-go
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    useGoBuild: true
    # go-cache compiles exactly what go vet does, so the vet is mostly cache hits.
    jobSize: large
    requests: {cpu: 14000m, memory: 16Gi}
    goCache: read
    changes:
      in:
        - ^go\.mod$
        - ^go\.sum$
        - ^.*\.go$
        - ^.*deps\.txt$
        - ^Makefile$
        - ^lib\.Makefile$
        - ^metadata\.mk$
        - ^\.argoci/depstree\.yaml$
        - ^\.argoci/config\.yaml$
        - ^\.argoci/modules/10-prerequisites\.yaml$
    commands: |
      # `useGoBuild` steps take their image tag from config.yaml rather than from
      # the toolchain the Makefiles build with.
      want=$(make --no-print-directory -s -f metadata.mk --eval 'print: ; @echo $(GO_BUILD_VER)' print)
      have=$(awk '/^goBuildVersion:/ {print $2}' .argoci/config.yaml)
      if [ "${want}" != "${have}" ]; then
        echo "goBuildVersion in .argoci/config.yaml is ${have}, but metadata.mk builds with ${want}"
        exit 1
      fi
      make check-ginkgo-v2
      make check-go-mod
      make verify-go-mods
      make gen-deps-files
      make go-vet
      # A cron or tag has no range to diff against, so it reformats everything.
      if [ "${CI_GIT_REF_TYPE}" = PR ] || [ "${CI_GIT_REF_TYPE}" = MERGE ]; then make fix-changed; else make fix-all; fi
      make check-dirty

  # Every module's downloads and a compile of every package, written straight to
  # the shared go cache disk, where the `goCache: read` steps read them in place.
  - name: go-cache
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    useGoBuild: true
    jobSize: large
    # Nearly every Go step waits on this one, and the compile scales with cores.
    requests: {cpu: 9000m, memory: 10Gi}
    changes:
      in:
        - ^\.argoci/scripts/vm-go-cache$
        - ^\.argoci/modules/10-prerequisites\.yaml$
    goCache: write
    commands: |
      # Built at the go-build container's repo path, which is in every build
      # output's cache key. goBuildCheckoutDir puts the repo there.
      if [ "$PWD" != /go/src/github.com/projectcalico/calico ]; then
        echo "go-cache: checked out at $PWD, not the go-build path; readers will miss its build cache" >&2
      fi
      s=$(date +%s)
      # Alongside the compile, which fetches what it needs itself: the other
      # modules are for the steps that build in them. go locks each module it
      # downloads.
      (
        set -e
        for mod in $(git ls-files '*go.mod' | grep -v -e '^third_party/' -e '/vendor/'); do
          echo "go-cache: go mod download in $(dirname "$mod")"
          ( cd "$(dirname "$mod")" && go mod download )
        done
      ) &
      downloads=$!
      # The package build prints nothing, so a count of what it has compiled.
      while sleep 30; do
        echo "go-cache: $(find /cache/go/build -name '*-d' | wc -l) compiled outputs, $(du -sh /cache/go/build | cut -f1)"
      done &
      progress=$!
      # || true: under errexit a failing trap fails the step, and the ticker is
      # usually gone by now.
      trap 'kill "$progress" 2>/dev/null || true' EXIT
      # Through make, so the settings are the ones the readers build with.
      make go-compile-all
      echo "go-cache: compiled in $(( $(date +%s) - s ))s"
      if ! wait "$downloads"; then
        echo "go-cache: a module download failed; readers would find modules missing" >&2
        exit 1
      fi
      kill "$progress" 2>/dev/null || true
      du -sh /cache/go/build /cache/go/mod

  # Copies go-cache's disk to GCS for the steps that still build in docker, which
  # restore it in the global prologue. Streamed as the disk lays it out, so
  # nothing is unpacked here. Only a branch build stores: a PR's copy would only
  # ever be read by that PR.
  - name: go-cache-store
    when: GIT_REF_TYPE != 'PR' && GIT_REF_TYPE != 'TAG'
    depends: [go-cache]
    timeout: 30m
    jobSize: small
    requests: {cpu: 1500m, memory: 548Mi}
    cache:
      - {name: go, mode: read, path: /cache/go}
    commands: |
      cd /cache/go
      artifact cache store "go-cache-build-${CI_GIT_BRANCH}" build & build=$!
      artifact cache store "go-cache-mod-${CI_GIT_BRANCH}" mod & mods=$!
      wait "$build"
      wait "$mods"

  - name: check-python
    env:
      - name: NATIVE_PYTHON
        value: "true"
    jobSize: small
    requests: {cpu: 2000m, memory: 1Gi}
    useGoBuild: true
    changes:
      in:
        - ^networking-calico/
        # bin/uv's recipe.
        - ^Makefile$
        - ^lib\.Makefile$
        - ^metadata\.mk$
        - ^\.argoci/modules/10-prerequisites\.yaml$
    commands: |
      make -C networking-calico fmtpy
      make -C networking-calico flake8
      make check-dirty

  # Grep-speed checks, so one step rather than three.
  - name: check-language-dockerfiles
    jobSize: small
    requests: {cpu: 2250m, memory: 548Mi}
    useGoBuild: true
    changes:
      in:
        - ^.*$
      # Listed rather than `^\.`, which would exclude this module's own file too.
      exclude:
        - ^libbpf/
        - ^\.git
        - ^\.claude/
    commands: |
      make check-language
      make check-dockerfiles
      make check-mockery-config

  - name: check-protobufs
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    requests: {cpu: 1500m, memory: 2Gi}
    useGoBuild: true
    changes:
      in:
        - ^.*\.pb\.go$
        - ^.*\.proto$
        - ^Makefile$
        - ^lib\.Makefile$
        - ^metadata\.mk$
        - ^\.argoci/modules/10-prerequisites\.yaml$
    commands: |
      make protobuf fix-changed
      make check-dirty

  - name: check-manifests
    requests: {cpu: 2750m, memory: 2.5Gi}
    services: [docker]
    changes:
      in:
        - ^api/
        - ^manifests/
        - ^charts/
        - ^libcalico-go/lib/apis/
        - ^libcalico-go/config/
        - ^libcalico-go/Makefile$
        - ^felix/config/
        - ^felix/docs/
        - ^felix/Makefile$
        - ^goldmane/
        - ^kube-controllers/pkg/apis/migration/
        - ^operator/api/
        - ^operator/pkg/crds/
        - ^operator/pkg/admission/
        - ^Makefile$
        - ^lib\.Makefile$
        - ^metadata\.mk$
        - ^\.argoci/modules/10-prerequisites\.yaml$
    commands: |
      make -C lib gen-files
      make -C api gen-files
      make -C libcalico-go gen-files
      make -C felix gen-files
      make -C goldmane gen-files
      make -C kube-controllers gen-files
      make -C operator gen-files
      make gen-manifests
      make fix-changed
      make check-ocp-no-crds
      make check-dirty

  # A chart can change what it renders without any committed manifest changing,
  # which a diff of the tree cannot see.
  - name: check-helm-charts
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    jobSize: small
    requests: {cpu: 2000m, memory: 5.5Gi}
    useGoBuild: true
    changes:
      in:
        - ^charts/
        - ^Makefile$
        - ^lib\.Makefile$
        - ^metadata\.mk$
        - ^\.argoci/modules/10-prerequisites\.yaml$
    commands: |
      make test-charts

  # Regenerating the patches must be a no-op. metadata.mk is in the trigger
  # because `go mod tidy`'s output depends on the toolchain.
  - name: check-thirdparty-dep-patches
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    requests: {cpu: 2000m, memory: 2Gi}
    useGoBuild: true
    changes:
      in:
        - ^hack/thirdparty/
        - ^istio/
        - ^third_party/envoy-gateway/
        - ^third_party/envoy-ratelimit/
        - ^Makefile$
        - ^lib\.Makefile$
        - ^metadata\.mk$
        - ^\.argoci/modules/10-prerequisites\.yaml$
      exclude:
        - (^|/)\.gitignore$
        - (^|/)README\.md$
        - (^|/)LICENSE$
    commands: |
      make check-thirdparty-dep-patches
      make check-dirty

  # The calico binary, and the cgo and race builds and libbpf the Felix lanes
  # take. It stages the image's build context rather than building the image:
  # the image goes through buildkit, so nothing here needs docker.
  - name: build-calico-binary
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    useGoBuild: true
    jobSize: large
    requests: {cpu: 7000m, memory: 8Gi}
    changes:
      dependsOn: [cmd]
      in: ['^\.argoci/modules/10-prerequisites\.yaml$', '^\.argoci/scripts/stage-calico-image$']
    goCache: read
    cache:
      - {name: calico-build, mode: write, path: /cache/calico-build}
    commands: |
      make -C cmd/calico build build-cgo build-race bin/LICENSE
      make -C pod2daemon build
      test -f felix/bpf-gpl/libbpf/src/amd64/libbpf.a || make -C felix libbpf
      LIBBPF_VERSION=$(grep -E '^LIBBPF_VERSION[[:space:]]*=' metadata.mk | cut -d'=' -f2 | tr -d '[:space:]')
      # tar only warns on a missing path.
      test -d felix/bpf-gpl/libbpf || { echo "libbpf clone missing at felix/bpf-gpl/libbpf" >&2; exit 1; }
      test -f "felix/bpf-gpl/.libbpf-${LIBBPF_VERSION}" || { echo "libbpf version marker felix/bpf-gpl/.libbpf-${LIBBPF_VERSION} missing" >&2; exit 1; }
      out=/cache/calico-build
      cp cmd/calico/bin/calico-cgo-amd64 cmd/calico/bin/calico-race-amd64 "$out/"
      # Uncompressed: the go-build image has no zstd.
      tar -cf "$out/libbpf-amd64.tar" -C felix/bpf-gpl libbpf ".libbpf-${LIBBPF_VERSION}"
      .argoci/scripts/stage-calico-image "$out/image"

  - name: build-calico-image
    depends: [build-calico-binary]
    changes:
      dependsOn: [cmd]
      in: ['^\.argoci/modules/10-prerequisites\.yaml$', '^\.argoci/scripts/stage-calico-image$']
    cache:
      - {name: calico-build, mode: read, path: /cache/calico-build}
      - {name: calico-image, mode: write, path: /cache/calico-image}
    buildkit:
      context: /cache/calico-build/image
      buildArgsFile: build-args
      tag: calico/calico:latest-amd64
      tar: /cache/calico-image/calico.tar

  # Tagged by a hash of the recipe, so an unchanged one is a pull rather than a
  # ~20 minute emulated build.
  - name: build-nft-rpms
    services: [docker]
    timeout: 1h
    requests: {cpu: 2000m, memory: 1Gi}
    matrix:
      - name: amd64
        env: [{name: ARCH, value: amd64}]
      - name: arm64
        env: [{name: ARCH, value: arm64}]
      - name: ppc64le
        env: [{name: ARCH, value: ppc64le}]
      - name: s390x
        env: [{name: ARCH, value: s390x}]
    changes:
      in:
        - '^hack/rpms/nftables/'
        - '^\.argoci/modules/10-prerequisites\.yaml$'
    commands: |
      mkdir -p logs
      export BUILD_LOG="logs/build-nft-rpms-${ARCH}.log"
      .argoci/scripts/build-nft-rpms.sh "${ARCH}"
    epilogue: |
      cd "${CI_HOME}/${CI_GIT_DIR}"
      artifact push job logs --destination logs || true

  # Published on merge because later builds pull it. A step here rather than a
  # workflow of its own because it reads this workflow's cached build.
  - name: push-nft-rpms
    services: [docker]
    timeout: 1h
    requests: {cpu: 1500m, memory: 1.5Gi}
    depends: [build-nft-rpms]
    when: GIT_REF_TYPE == 'MERGE' && (GIT_BRANCH == 'master' || GIT_BRANCH =~ '^release-')
    matrix:
      - name: amd64
        env: [{name: ARCH, value: amd64}]
      - name: arm64
        env: [{name: ARCH, value: arm64}]
      - name: ppc64le
        env: [{name: ARCH, value: ppc64le}]
      - name: s390x
        env: [{name: ARCH, value: s390x}]
    changes:
      in:
        - '^hack/rpms/nftables/'
        - '^\.argoci/modules/10-prerequisites\.yaml$'
    commands: |
      export DOCKER_USER="$DOCKERHUB_USERNAME"
      export DOCKER_TOKEN="$DOCKERHUB_PASSWORD"
      mkdir -p logs
      export BUILD_LOG="logs/push-nft-rpms-${ARCH}.log"
      .argoci/scripts/push-nft-rpms.sh "${ARCH}"
    epilogue: |
      cd "${CI_HOME}/${CI_GIT_DIR}"
      artifact push job logs --destination logs || true

  - name: build-node-image
    services: [docker]
    timeout: 1h
    requests: {cpu: 4000m, memory: 5Gi}
    depends: [build-nft-rpms]
    changes:
      dependsOn: [node]
      in:
        - '^node/'
        - '^\.argoci/modules/10-prerequisites\.yaml$'
    commands: |
      # Resolves the Dockerfile's nft-rpms build context locally, so BuildKit
      # does not go back to the registry for it.
      .argoci/scripts/load-nft-rpms.sh amd64
      make -C node image
      docker save calico/node:latest-amd64 -o /tmp/node-image.tar
      zstd -3 -T${GOMAXPROCS:-1} --rm /tmp/node-image.tar
      artifact push workflow /tmp/node-image.tar.zst

  # TypeScript, so there is no Go import graph to gate on.
  - name: build-whisker-image
    services: [docker]
    timeout: 1h
    requests: {cpu: 2000m, memory: 1.75Gi}
    changes:
      in:
        - '^whisker/'
        - '^\.argoci/modules/10-prerequisites\.yaml$'
    commands: |
      make -C whisker image
      docker save calico/whisker:latest-amd64 -o /tmp/whisker-image.tar
      zstd -3 -T${GOMAXPROCS:-1} --rm /tmp/whisker-image.tar
      artifact push workflow /tmp/whisker-image.tar.zst

  # The operator binary twice, once per set of image refs compiled into it: the
  # kind lanes install localhost:5000/calico/<name>:test-build, Windows FV the
  # docker.io refs. Each is staged as a buildkit context, so nothing needs docker.
  - name: build-operator-binary
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    useGoBuild: true
    jobSize: large
    requests: {cpu: 7000m, memory: 8Gi}
    changes: &operator-image-changes
      dependsOn: [operator]
      in:
        - '^operator/'
        - '^\.argoci/modules/10-prerequisites\.yaml$'
        - '^\.argoci/scripts/stage-operator-image$'
    goCache: read
    cache:
      - {name: operator-build, mode: write, path: /cache/operator-build}
    commands: |
      for flavor in kind:localhost:5000 dockerio:docker.io; do
        # The refs are ldflags, which make cannot see, so each build relinks.
        rm -f operator/build/_output/bin/operator-amd64
        make -C operator build CALICO_VERSION=test-build CALICO_REGISTRY="${flavor#*:}" CALICO_IMAGE_PATH=calico
        .argoci/scripts/stage-operator-image "/cache/operator-build/${flavor%%:*}" operator/build/_output/bin/operator-amd64
      done

  - name: build-operator-image-tar
    depends: [build-operator-binary]
    changes: *operator-image-changes
    cache:
      - {name: operator-build, mode: read, path: /cache/operator-build}
      - {name: "operator-image-${FLAVOR}", mode: write, path: /cache/operator-image}
    buildkit:
      context: "/cache/operator-build/${FLAVOR}"
      buildArgsFile: build-args
      tag: "${REF}"
      tar: /cache/operator-image/operator.tar
    matrix:
      - name: kind
        env: [{name: FLAVOR, value: kind}, {name: REF, value: "localhost:5000/calico/operator:test-build"}]
      - name: dockerio
        env: [{name: FLAVOR, value: dockerio}, {name: REF, value: "calico/operator:test-build"}]

  - name: build-operator-image
    depends: [build-operator-image-tar]
    changes: *operator-image-changes
    requests: {cpu: 2000m, memory: 1Gi}
    cache:
      - {name: operator-image-kind, mode: read, path: /cache/operator-image-kind}
      - {name: operator-image-dockerio, mode: read, path: /cache/operator-image-dockerio}
    commands: |
      zstd -3 -T${GOMAXPROCS:-1} /cache/operator-image-kind/operator.tar -o /tmp/operator-image.tar.zst
      zstd -3 -T${GOMAXPROCS:-1} /cache/operator-image-dockerio/operator.tar -o /tmp/operator-image-dockerio.tar.zst
      artifact push workflow /tmp/operator-image.tar.zst
      artifact push workflow /tmp/operator-image-dockerio.tar.zst

  # Windows FV installs these rather than building its own. Nothing else builds
  # them, so this is also where a break in them shows up.
  - name: build-windows-binaries
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    useGoBuild: true
    jobSize: large
    requests: {cpu: 7000m, memory: 8Gi}
    changes: &windows-image-changes
      dependsOn: [node, cni-plugin]
      in:
        - '^\.argoci/modules/10-prerequisites\.yaml$'
        - '^\.argoci/scripts/stage-windows-image$'
    goCache: read
    cache:
      - {name: windows-build, mode: write, path: /cache/windows-build}
    commands: |
      make -C node build-windows-archive
      .argoci/scripts/stage-windows-image node node-windows /cache/windows-build/node
      .argoci/scripts/stage-windows-image cni-plugin cni-windows /cache/windows-build/cni-plugin

  - name: build-windows-image-tar
    depends: [build-windows-binaries]
    changes: *windows-image-changes
    cache:
      - {name: windows-build, mode: read, path: /cache/windows-build}
      - {name: "windows-${COMPONENT}-${WINVER}", mode: write, path: /cache/windows-image}
    buildkit:
      context: "/cache/windows-build/${COMPONENT}"
      buildArgsFile: "build-args-${WINVER}"
      platform: windows/amd64
      # Windows FV retags the imported image from this ref.
      tag: "${IMAGE}:latest"
      tar: /cache/windows-image/image.tar
    matrix:
      - {name: node-ltsc2019, env: [{name: COMPONENT, value: node}, {name: IMAGE, value: node-windows}, {name: WINVER, value: ltsc2019}]}
      - {name: node-ltsc2022, env: [{name: COMPONENT, value: node}, {name: IMAGE, value: node-windows}, {name: WINVER, value: ltsc2022}]}
      - {name: node-ltsc2025, env: [{name: COMPONENT, value: node}, {name: IMAGE, value: node-windows}, {name: WINVER, value: ltsc2025}]}
      - {name: cni-ltsc2019, env: [{name: COMPONENT, value: cni-plugin}, {name: IMAGE, value: cni-windows}, {name: WINVER, value: ltsc2019}]}
      - {name: cni-ltsc2022, env: [{name: COMPONENT, value: cni-plugin}, {name: IMAGE, value: cni-windows}, {name: WINVER, value: ltsc2022}]}
      - {name: cni-ltsc2025, env: [{name: COMPONENT, value: cni-plugin}, {name: IMAGE, value: cni-windows}, {name: WINVER, value: ltsc2025}]}

  # Named as the images' consumers look for them.
  - name: build-windows-images
    depends: [build-windows-image-tar]
    changes: *windows-image-changes
    requests: {cpu: 2000m, memory: 1Gi}
    cache:
      - {name: windows-build, mode: read, path: /cache/windows-build}
      - {name: windows-node-ltsc2019, mode: read, path: /cache/windows-node-ltsc2019}
      - {name: windows-node-ltsc2022, mode: read, path: /cache/windows-node-ltsc2022}
      - {name: windows-node-ltsc2025, mode: read, path: /cache/windows-node-ltsc2025}
      - {name: windows-cni-plugin-ltsc2019, mode: read, path: /cache/windows-cni-plugin-ltsc2019}
      - {name: windows-cni-plugin-ltsc2022, mode: read, path: /cache/windows-cni-plugin-ltsc2022}
      - {name: windows-cni-plugin-ltsc2025, mode: read, path: /cache/windows-cni-plugin-ltsc2025}
    commands: |
      for component in node cni-plugin; do
        prefix=$(cat "/cache/windows-build/${component}/tar-prefix")
        mkdir -p "${component}/dist/windows"
        for version in ltsc2019 ltsc2022 ltsc2025; do
          ln -s "/cache/windows-${component}-${version}/image.tar" "${component}/dist/windows/${prefix}-${version}.tar"
        done
      done
      tar --dereference --use-compress-program="zstd -3" -cf /tmp/windows-images.tar.zst \
        node/dist/windows/*.tar cni-plugin/dist/windows/*.tar
      artifact push workflow /tmp/windows-images.tar.zst

  # The third-party images' binaries, and a build context per image. The images
  # go through buildkit, so nothing here needs docker.
  - name: build-third-party-binaries
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    useGoBuild: true
    timeout: 1h
    jobSize: large
    requests: {cpu: 7000m, memory: 8Gi}
    changes: &third-party-changes
      dependsOn: [third_party]
      in:
        - '^third_party/'
        - '^\.argoci/scripts/(stage-third-party-images|merge-image-tars)$'
        - '^\.argoci/modules/10-prerequisites\.yaml$'
    cache:
      - {name: third-party-build, mode: write, path: /cache/third-party-build}
    commands: |
      make -C third_party/envoy-gateway build
      make -C third_party/envoy-ratelimit build
      make -C third_party/cni-plugins build
      make bin/crane
      .argoci/scripts/stage-third-party-images /cache/third-party-build

  - name: build-envoy-gateway-image
    depends: [build-third-party-binaries]
    changes: *third-party-changes
    cache:
      - {name: third-party-build, mode: read, path: /cache/third-party-build}
      - {name: envoy-gateway-image, mode: write, path: /cache/envoy-gateway-image}
    buildkit:
      context: /cache/third-party-build/envoy-gateway
      buildArgsFile: build-args
      tag: calico/envoy-gateway:latest-amd64
      tar: /cache/envoy-gateway-image/image.tar

  - name: build-envoy-proxy-image
    depends: [build-third-party-binaries]
    changes: *third-party-changes
    cache:
      - {name: third-party-build, mode: read, path: /cache/third-party-build}
      - {name: envoy-proxy-image, mode: write, path: /cache/envoy-proxy-image}
    buildkit:
      context: /cache/third-party-build/envoy-proxy
      buildArgsFile: build-args
      tag: calico/envoy-proxy:latest-amd64
      tar: /cache/envoy-proxy-image/image.tar

  - name: build-envoy-ratelimit-image
    depends: [build-third-party-binaries]
    changes: *third-party-changes
    cache:
      - {name: third-party-build, mode: read, path: /cache/third-party-build}
      - {name: envoy-ratelimit-image, mode: write, path: /cache/envoy-ratelimit-image}
    buildkit:
      context: /cache/third-party-build/envoy-ratelimit
      buildArgsFile: build-args
      tag: calico/envoy-ratelimit:latest-amd64
      tar: /cache/envoy-ratelimit-image/image.tar

  - name: build-cni-plugins-image
    depends: [build-third-party-binaries]
    changes: *third-party-changes
    cache:
      - {name: third-party-build, mode: read, path: /cache/third-party-build}
      - {name: cni-plugins-image, mode: write, path: /cache/cni-plugins-image}
    buildkit:
      context: /cache/third-party-build/cni-plugins
      buildArgsFile: build-args
      tag: calico/third-party-cni-plugins:latest-amd64
      tar: /cache/cni-plugins-image/image.tar

  # One tarball, since every kind lane wants all four.
  - name: build-third-party-images
    depends: [build-envoy-gateway-image, build-envoy-proxy-image, build-envoy-ratelimit-image, build-cni-plugins-image]
    changes: *third-party-changes
    requests: {cpu: 2000m, memory: 1Gi}
    cache:
      - {name: envoy-gateway-image, mode: read, path: /cache/envoy-gateway-image}
      - {name: envoy-proxy-image, mode: read, path: /cache/envoy-proxy-image}
      - {name: envoy-ratelimit-image, mode: read, path: /cache/envoy-ratelimit-image}
      - {name: cni-plugins-image, mode: read, path: /cache/cni-plugins-image}
    commands: |
      .argoci/scripts/merge-image-tars /tmp/third-party-images.tar \
        /cache/envoy-gateway-image/image.tar \
        /cache/envoy-proxy-image/image.tar \
        /cache/envoy-ratelimit-image/image.tar \
        /cache/cni-plugins-image/image.tar
      zstd -3 -T${GOMAXPROCS:-1} --rm /tmp/third-party-images.tar
      artifact push workflow /tmp/third-party-images.tar.zst

  # Built here for the VM lanes, which have no module proxy: the binaries import
  # most of Kubernetes, and a VM downloads all of it from the public proxy. libbpf
  # comes from the calico image's build rather than a clone from GitHub.
  - name: build-e2e-binaries
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    useGoBuild: true
    timeout: 1h
    jobSize: large
    requests: {cpu: 7000m, memory: 8Gi}
    depends: [build-calico-binary]
    changes:
      dependsOn: [e2e]
      in: ['^\.argoci/modules/10-prerequisites\.yaml$']
    goCache: read
    cache:
      - {name: calico-build, mode: read, path: /cache/calico-build}
    commands: |
      tar -xf /cache/calico-build/libbpf-amd64.tar -C felix/bpf-gpl
      make -C e2e build
      make bin/ginkgo
      make -C e2e/images/rapidclient build
      # Uncompressed: the go-build image has no zstd.
      tar -cf /tmp/e2e-binaries.tar e2e/bin bin/ginkgo e2e/images/rapidclient/bin
      artifact push workflow /tmp/e2e-binaries.tar

  # Fetched here, in a pod, so the PR read token never reaches the e2e VMs.
  - name: sandcat-pr-context
    jobSize: small
    requests: {cpu: 500m, memory: 548Mi}
    secretBundles:
      - name: sandcat-download
        keys:
          - name: SANDCAT_BIN_DOWNLOAD_TOKEN
      - name: sandcat-nightly
        keys:
          - name: GH_TOKEN
            as: SANDCAT_PR_READ_TOKEN
    commands: |
      .argoci/scripts/sandcat/sandcat.sh publish-pr-context || true

  - name: check-sandcat-scripts
    jobSize: small
    requests: {cpu: 1500m, memory: 548Mi}
    changes:
      in:
        - ^\.argoci/scripts/sandcat/
        - ^\.argoci/scripts/global_epilogue\.sh$
        - ^\.argoci/scripts/merge_junit\.py$
        - ^Makefile$
    commands: |
      set -e
      ./.argoci/scripts/sandcat/test_scripts/sandcat-inline-env.sh
      ./.argoci/scripts/sandcat/test_scripts/with-inline-diag.sh
      ./.argoci/scripts/sandcat/test_scripts/sandcat-build-failure.sh
      ./.argoci/scripts/sandcat/test_scripts/sandcat-analyze.sh
      ./.argoci/scripts/sandcat/test_scripts/sandcat-download.sh
      ./.argoci/scripts/sandcat/test_scripts/sandcat-pr-context.sh
      ./.argoci/scripts/sandcat/test_scripts/epilogue-sandcat.sh
