# apiserver `make ci`.
version: condensed-module

defaults:
  timeout: 30m
  # In the build image, with NATIVE_GO_BUILD running each recipe in place rather
  # than in a nested container.
  useGoBuild: true

steps:
  - name: apiserver-ci
    env:
      - name: NATIVE_GO_BUILD
        value: "true"
    depends: [check-go]
    requests: {cpu: 4500m, memory: 6Gi}
    goCache: read
    commands: |
      cd apiserver
      make ci
    reports: [apiserver/report:test-results]
