# Parses every e2e workflow and shellchecks every script it dispatches to, so a
# typo in one surfaces here rather than hours into a nightly run.
#
version: condensed-module

defaults:
  timeout: 5m
  # It fetches yq and shellcheck itself and runs neither a build nor a
  # container, so the host-level image is all it needs.

steps:
  - name: e2e-validation
    jobSize: small
    requests: {cpu: 1000m, memory: 768Mi}
    commands: |
      ./.argoci/scripts/test_scripts/e2e-validation.sh
