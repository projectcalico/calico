# Parses every e2e workflow and shellchecks the scripts they run.
version: condensed-module

defaults:
  timeout: 5m

steps:
  - name: e2e-validation
    jobSize: small
    requests: {cpu: 1750m, memory: 548Mi}
    commands: |
      . hack/ensure-go.sh
      ./.argoci/scripts/test_scripts/e2e-validation.sh
