# Which workflows run on which events. The crons in .argoci/cron/ register on
# merge to the default branch.
version: v2

# Fork PRs from non-writers get no CI either way; this gives a maintainer a
# per-commit checkbox to release the run rather than withholding it silently.
requireApproval: true

# The calico/go-build tag `useGoBuild` steps run. It must match the GO_BUILD_VER
# metadata.mk resolves to, and CI fails when the two differ.
goBuildVersion: 1.27.4-llvm22.1.8-k8s1.38.0-beta.0-1

# useGoBuild steps check out where the go-build container mounts the repo: a
# package's source path is in its Go build cache key, so go-cache and its readers
# share entries only at one path.
goBuildCheckoutDir: /go/src/github.com/projectcalico/calico

# What createVM/runOnVM steps run. It must drive the machine as the node's own
# account, the one that can attach the cache disk.
vmToolImage: calico/scratch-utils:v0.8

# New PRs start on `basic-ci`, which skips the costly VM suites. The label holds
# a pending status, so removing it to run the full suite is what unblocks merge.
tiers:
  - name: basic
    allowMerge: false
    default: true

workflows:
  # Always runs, so its status can be a required check; gating happens inside.
  - name: calico
    workflowFile: .argoci/ciworkflow.yaml
    runWhen:
      alwaysRunOnPR: true
      alwaysRunOnMerge: true

  # Separate workflows, so a publish failing doesn't colour the build's status.
  - name: fossa-scan
    workflowFile: .argoci/publish/fossa-scan.yaml
    runWhen:
      alwaysRunOnMerge: true

  # Also a promotion button, for packaging a branch or PR.
  - name: openstack-packages
    workflowFile: .argoci/publish/openstack-packages.yaml
    runWhen:
      alwaysRunOnMerge: true

  - name: e2e-images
    workflowFile: .argoci/publish/e2e-images.yaml
    runWhen:
      alwaysRunOnMerge: true

  - name: e2e-openstack-image
    workflowFile: .argoci/publish/e2e-openstack-image.yaml
    runWhen:
      alwaysRunOnMerge: true
