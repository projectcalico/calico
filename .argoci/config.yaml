# Which workflows run on which events. The crons in .argoci/cron/ register on
# merge to the default branch.
version: v2

# Fork PRs from non-writers get no CI either way; this gives a maintainer a
# per-commit checkbox to release the run rather than withholding it silently.
requireApproval: true

# The calico/go-build tag `useGoBuild` steps run. It must match the GO_BUILD_VER
# metadata.mk resolves to, and CI fails when the two differ.
goBuildVersion: 1.27.2-llvm21.1.8

# The step that hands a run the toolchain images it built, when a PR changes
# them before their tags are published. See .argoci/modules/10-toolchain.yaml.
toolchainFrom: toolchain

workflows:
  # Always runs, so its status can be a required check; gating happens inside.
  - name: calico
    workflowFile: .argoci/ciworkflow.yaml
    runWhen:
      alwaysRunOnPR: true
      alwaysRunOnMerge: true

  # Separate workflows, so a publish failing doesn't colour the build's status.
  - name: fossa-scan
    workflowFile: .argoci/publish/fossa-scan.yaml
    runWhen:
      alwaysRunOnMerge: true

  # Also a promotion button, for packaging a branch or PR.
  - name: openstack-packages
    workflowFile: .argoci/publish/openstack-packages.yaml
    runWhen:
      alwaysRunOnMerge: true

  - name: e2e-images
    workflowFile: .argoci/publish/e2e-images.yaml
    runWhen:
      alwaysRunOnMerge: true

  # Each step builds only a tag not yet published.
  - name: toolchain-images
    workflowFile: .argoci/publish/toolchain-images.yaml
    runWhen:
      alwaysRunOnMerge: true
