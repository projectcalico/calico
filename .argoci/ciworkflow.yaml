# One workflow rather than one per component: `depends:` and the artifact
# namespace are both workflow-scoped, so producers and consumers must share one.
# A workflow that doesn't run posts no commit status, so a gated one could never
# be a required check.
#
# Argo workflow objects live in etcd (~1.5MB). Gated-out steps never reach the
# object, but a change matching every module fires everything — measure before
# adding many more:
#   argoci-expand -o yaml -changed metadata.mk .argoci/ciworkflow.yaml | wc -c
version: condensed
generateName: calico-

# Bounds the DAG itself, catching a hang outside any step's own deadline.
timeout: 4h

# Where the component names in each `dependsOn:` below come from. Generated from
# the live import graph, so a gate cannot fall behind what it gates.
dependencies: .argoci/depstree.yaml

# The Makefiles address the tree by its GOPATH location, which is a path inside
# the build image rather than anywhere the checkout can land. A step running the
# build image directly has to put the tree there itself; one shelling out to a
# nested container gets the same path from the bind mount, and ignores this.
globalPrologue: |
  mkdir -p /go/src/github.com/projectcalico
  ln -sfn "${CI_HOME}/${CI_GIT_DIR}" /go/src/github.com/projectcalico/calico

defaults:
  # Carries the host-level tooling the steps shell out to and nothing else — a
  # quarter of the pull of a general-purpose runner, which every step pays.
  # A step doing its work in-process names the build image instead.
  image: gcr.io/tigera-cc-dev/ci-base/calico-ci:v0.2

  # medium is the only spot jobSize. Preemption fails the run outright, with no
  # retry, so anything long or flaky wants `large`.
  jobSize: medium

  # An unset timeout means run-forever. A module overrides this when its work
  # justifies more.
  timeout: 1h

  # Modules merge collections with these rather than replacing them, and the
  # merge is a union — a step cannot drop what it inherits. So `docker` is
  # declared by the modules that shell out to a nested container, not here.
  services:
    - goproxy
  secretBundles:
    - docker-hub

includes:
  # Ungated: each check inside carries its own, as its Semaphore block does.
  - path: .argoci/modules/10-prerequisites.yaml

  # Each module is gated on its own file as well as its component, so editing a
  # module retests what it builds. Match the path exactly — a bare `^\.argoci/`
  # would fire every component on any CI edit.
  - path: .argoci/modules/20-lib.yaml
    changes:
      in:
        - ^lib/
        - ^\.argoci/modules/20-lib\.yaml$

  - path: .argoci/modules/20-api.yaml
    changes:
      in:
        - ^api/
        - ^test/
        - ^metadata\.mk$
        - ^lib\.Makefile$
        - ^\.argoci/modules/20-api\.yaml$
      exclude:
        - (^|/)\.gitignore$
        - (^|/)README\.md$
        - (^|/)LICENSE$

  # Leaf components: one `make ci` each, so the gate is the component in the
  # generated table plus the module's own file.
  - path: .argoci/modules/20-calicoctl.yaml
    changes:
      dependsOn: [calicoctl]
      in: ['^\.argoci/modules/20-calicoctl\.yaml$']

  - path: .argoci/modules/20-confd.yaml
    changes:
      dependsOn: [confd]
      in: ['^\.argoci/modules/20-confd\.yaml$']

  - path: .argoci/modules/20-pod2daemon.yaml
    changes:
      dependsOn: [pod2daemon]
      in: ['^\.argoci/modules/20-pod2daemon\.yaml$']

  - path: .argoci/modules/20-app-policy.yaml
    changes:
      dependsOn: [app-policy]
      in: ['^\.argoci/modules/20-app-policy\.yaml$']

  - path: .argoci/modules/20-goldmane.yaml
    changes:
      dependsOn: [goldmane]
      in: ['^\.argoci/modules/20-goldmane\.yaml$']

  - path: .argoci/modules/20-guardian.yaml
    changes:
      dependsOn: [guardian]
      in: ['^\.argoci/modules/20-guardian\.yaml$']

  - path: .argoci/modules/20-libcalico-go.yaml
    changes:
      dependsOn: [libcalico-go]
      in: ['^\.argoci/modules/20-libcalico-go\.yaml$']

  - path: .argoci/modules/20-apiserver.yaml
    changes:
      dependsOn: [apiserver]
      in: ['^\.argoci/modules/20-apiserver\.yaml$']

  - path: .argoci/modules/20-whisker-backend.yaml
    changes:
      dependsOn: [whisker-backend]
      in: ['^\.argoci/modules/20-whisker-backend\.yaml$']

  - path: .argoci/modules/20-webhooks.yaml
    changes:
      dependsOn: [webhooks, api, apiserver]
      in: ['^\.argoci/modules/20-webhooks\.yaml$']

  - path: .argoci/modules/20-tools.yaml
    changes:
      dependsOn: [hack, api, libcalico-go]
      in: ['^\.argoci/modules/20-tools\.yaml$']

  - path: .argoci/modules/20-whisker.yaml
    changes:
      in:
        - ^whisker/
        - ^metadata\.mk$
        - ^lib\.Makefile$
        - ^\.argoci/modules/20-whisker\.yaml$
      exclude:
        - (^|/)\.gitignore$
        - (^|/)README\.md$
        - (^|/)LICENSE$
