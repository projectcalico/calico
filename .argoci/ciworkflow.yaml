# Root of Calico's per-PR/merge CI, composed from per-component modules under
# .argoci/modules/. One workflow, one GitHub check, one artifact namespace, one
# auto-cancel unit — the same shape as the Semaphore pipeline this replaces, with
# the 60 blocks split across files for maintainability rather than glued into one.
#
# WHY ONE WORKFLOW AND NOT ONE PER COMPONENT:
#   - `depends:` only resolves within a workflow, so the producer/consumer graph
#     (calico image -> Felix/Typha/CNI/node/e2e/...) has to live in one.
#   - CI_ARTIFACT_STORAGE is keyed on {{workflow.name}}, so one workflow means
#     producers and consumers already share a namespace with no new mechanism.
#   - A workflow whose runWhen says "no" posts no GitHub status at all, so
#     per-component checks could never be required — a PR not touching that
#     component would be permanently unmergeable.
#
# Components are gated per-include instead, which is what keeps a small PR small.
# A module gated out takes its dependents with it (the cascade), so a consumer
# never runs against a producer that was skipped.
#
# SIZE WATCH: an Argo Workflow object lives in etcd (~1.5MB default limit) and
# gated-out steps never reach it, so day to day this stays small. A PR touching
# metadata.mk or lib.Makefile fires nearly everything — measure the expanded
# object on such a change before adding many more modules:
#   hack/argoci-expand -o yaml -changed metadata.mk .argoci/ciworkflow.yaml | wc -c
version: condensed
generateName: calico-

# Semaphore capped the whole pipeline at 4h. This is the equivalent ceiling; it
# bounds the DAG itself, catching a hang outside any step's own deadline.
timeout: 4h

globalPrologue: |
  # Every make target in this repo runs inside calico/go-build, so the pull has
  # to be authenticated or Docker Hub rate-limits it.
  echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

  # lib.Makefile's DOCKER_RUN forwards GOCACHE/GOPATH/GOOS/GOARCH/GOFLAGS into
  # the build container but NOT GOPROXY, so the Athens proxy the `goproxy`
  # service points us at would go unused: the module download happens in the
  # nested container, not this one. EXTRA_DOCKER_ARGS is spliced into every
  # `docker run`, which is the supported way to add it back.
  export EXTRA_DOCKER_ARGS="-e GOPROXY=${GOPROXY}"

defaults:
  # medium is the only jobSize on spot nodes. Preemption fails the run outright
  # (ArgoCI has no retry), so a module whose steps prove flaky should override
  # this with `large`, which pins spot: false.
  jobSize: medium

  # Semaphore bounded every job at 1h whether or not anyone wrote it down;
  # ArgoCI's unset timeout means run-forever. This restores that floor for any
  # module that does not set its own. A module whose Semaphore block declared
  # an execution_time_limit overrides this in its own `defaults:`.
  timeout: 1h

  # Modules layer their own defaults over these: scalars replace, collections
  # (services, secretBundles, env, scratchVolumes) merge — so a module adding a
  # service keeps docker and goproxy rather than displacing them.
  services:
    # docker: every component shells out to `docker run calico/go-build`.
    #   The nested container bind-mounts the repo, and that path is resolved by
    #   the dind daemon, not this container — it only works because the docker
    #   service shares /tmp /src /root /go /dockershare between the two. The
    #   checkout lands in /src/calico, inside the shared /src, so leave
    #   workingDir alone.
    - docker
    - goproxy
  secretBundles:
    - docker-hub

includes:
  # One module per Semaphore block. `changes:` here gates every step in the
  # file at once, so a component's trigger lives at its include rather than being
  # repeated on each of its steps.
  #
  # Patterns are regexes matched with an unanchored substring match — anchor
  # every one with ^ or it fires on unrelated paths.
  #
  # Migrated from blocks/20-lib.yml. Semaphore's trigger was change_in(['/lib/'])
  # only; matched here exactly so the two can be compared A/B. Sibling blocks
  # also list metadata.mk and lib.Makefile, and lib arguably should too — logged
  # as a follow-up rather than changed during the port.
  - path: .argoci/modules/lib.yaml
    changes:
      in:
        - ^lib/
