# PR and merge CI. One workflow, not one per component, because `depends:` and
# artifacts are both workflow-scoped.
#
# Argo keeps the whole workflow in etcd (~1.5MB); measure after adding modules:
#   argoci-expand -o yaml -changed metadata.mk .argoci/ciworkflow.yaml | wc -c
version: condensed
generateName: calico-

# Catches a hang outside any step's own timeout.
timeout: 4h

# Generated from the Go import graph; every `dependsOn:` name resolves here.
dependencies: .argoci/depstree.yaml

# A promotion runs at the source run's commit, so an old build republishes
# itself rather than master.
promotions:
  - name: push-images
    workflowFile: .argoci/promotions/push-images.yaml
    description: Republish one component's images at this commit
    parameters:
      - name: COMPONENT
        description: Which component's images to push
        required: true
        options:
          - calico
          - node
          - cni-plugin
          - third-party-cni-plugins
          - mock-node
          - whisker
          - operator
          - istio
          - envoy

  # Runs by itself on merge; the button is for packaging a branch or PR.
  - name: openstack-packages
    workflowFile: .argoci/publish/openstack-packages.yaml
    description: Build and publish the OpenStack packages for this ref

  - name: hashrelease
    workflowFile: .argoci/promotions/hashrelease.yaml
    description: Build and publish a hashrelease from this build

  - name: publish-release
    workflowFile: .argoci/promotions/publish-release.yaml
    description: Publish an official release from this build

# The Makefiles expect the tree at its GOPATH location inside the build image.
#
# A VM cannot reach the in-cluster module proxy that a pod's GOPROXY names, so it
# uses the public one — falling back to the source repositories on any error,
# since go does not retry a download that breaks mid-stream.
globalPrologue: |
  mkdir -p /go/src/github.com/projectcalico
  ln -sfn "${CI_HOME}/${CI_GIT_DIR}" /go/src/github.com/projectcalico/calico
  export GOPROXY="${GOPROXY:-https://proxy.golang.org|direct}"

defaults:
  # Only the host tooling steps shell out to, since every step pulls it. A step
  # working in-process names the build image instead.
  image: gcr.io/tigera-cc-dev/ci-base/calico-ci:v0.2

  jobSize: medium

  # Sustained use rather than peak: a request never caps a step.
  requests: {cpu: 1500m, memory: 2Gi}

  # Unset would mean no limit at all.
  timeout: 1h

  # Names every cloud resource a lane creates, so the exit-handler sweep deletes
  # only ours.
  env:
    - name: ARGOCI_RESOURCE_PREFIX
      value: argoci

  # Merged into every step and never droppable, so `docker` belongs on the
  # modules that need it rather than here.
  services:
    - goproxy
  secretBundles:
    - docker-hub

includes:
  # Each check inside carries its own gate.
  - path: .argoci/modules/10-prerequisites.yaml

  # Ungated: the sweep must run on every build.
  - path: .argoci/modules/99-cleanup.yaml

  # Each module is also gated on its own file, so editing one retests it. Match
  # it exactly — a bare `^\.argoci/` would fire everything on any CI edit.
  - path: .argoci/modules/20-lib.yaml
    changes:
      in:
        - ^lib/
        - ^\.argoci/modules/20-lib\.yaml$

  - path: .argoci/modules/20-api.yaml
    changes:
      in:
        - ^api/
        - ^test/
        - ^metadata\.mk$
        - ^lib\.Makefile$
        - ^\.argoci/modules/20-api\.yaml$
      exclude:
        - (^|/)\.gitignore$
        - (^|/)README\.md$
        - (^|/)LICENSE$

  - path: .argoci/modules/20-calicoctl.yaml
    changes:
      dependsOn: [calicoctl]
      in: ['^\.argoci/modules/20-calicoctl\.yaml$']

  - path: .argoci/modules/20-confd.yaml
    changes:
      dependsOn: [confd]
      in: ['^\.argoci/modules/20-confd\.yaml$']

  - path: .argoci/modules/20-pod2daemon.yaml
    changes:
      dependsOn: [pod2daemon]
      in: ['^\.argoci/modules/20-pod2daemon\.yaml$']

  - path: .argoci/modules/20-app-policy.yaml
    changes:
      dependsOn: [app-policy]
      in: ['^\.argoci/modules/20-app-policy\.yaml$']

  - path: .argoci/modules/20-goldmane.yaml
    changes:
      dependsOn: [goldmane]
      in: ['^\.argoci/modules/20-goldmane\.yaml$']

  - path: .argoci/modules/20-guardian.yaml
    changes:
      dependsOn: [guardian]
      in: ['^\.argoci/modules/20-guardian\.yaml$']

  - path: .argoci/modules/20-libcalico-go.yaml
    changes:
      dependsOn: [libcalico-go]
      in: ['^\.argoci/modules/20-libcalico-go\.yaml$']

  - path: .argoci/modules/20-apiserver.yaml
    changes:
      dependsOn: [apiserver]
      in: ['^\.argoci/modules/20-apiserver\.yaml$']

  - path: .argoci/modules/20-whisker-backend.yaml
    changes:
      dependsOn: [whisker-backend]
      in: ['^\.argoci/modules/20-whisker-backend\.yaml$']

  - path: .argoci/modules/20-webhooks.yaml
    changes:
      dependsOn: [webhooks, api, apiserver]
      in: ['^\.argoci/modules/20-webhooks\.yaml$']

  - path: .argoci/modules/20-tools.yaml
    changes:
      dependsOn: [hack, api, libcalico-go]
      in: ['^\.argoci/modules/20-tools\.yaml$']

  - path: .argoci/modules/20-whisker.yaml
    changes:
      in:
        - ^whisker/
        - ^metadata\.mk$
        - ^lib\.Makefile$
        - ^\.argoci/modules/20-whisker\.yaml$
      exclude:
        - (^|/)\.gitignore$
        - (^|/)README\.md$
        - (^|/)LICENSE$

  - path: .argoci/modules/20-cmd-calico.yaml
    changes:
      dependsOn: [cmd]
      in: ['^\.argoci/modules/20-cmd-calico\.yaml$']

  - path: .argoci/modules/20-e2e-ut.yaml
    changes:
      dependsOn: [e2e]
      in: ['^\.argoci/modules/20-e2e-ut\.yaml$']

  # The drift check reads the workflow definitions, so editing one re-runs it.
  - path: .argoci/modules/20-e2e-test-sets.yaml
    changes:
      dependsOn: [e2e]
      in:
        - ^e2e/config/
        - ^\.argoci/cron/
        - ^\.argoci/ciworkflow\.yaml$
        - ^\.semaphore/semaphore\.yml\.d/blocks/
        - ^\.argoci/modules/20-e2e-test-sets\.yaml$

  - path: .argoci/modules/20-e2e-validation.yaml
    changes:
      in:
        - ^\.argoci/cron/
        - ^\.argoci/scripts/
        - ^\.argoci/scripts/test_scripts/
        - ^\.argoci/modules/20-e2e-validation\.yaml$

  - path: .argoci/modules/30-key-cert-provisioner.yaml
    changes:
      dependsOn: [key-cert-provisioner]
      in: ['^\.argoci/modules/30-key-cert-provisioner\.yaml$']

  - path: .argoci/modules/60-mock-node.yaml
    changes:
      dependsOn: [test-tools/mocknode]
      in: ['^\.argoci/modules/60-mock-node\.yaml$']

  - path: .argoci/modules/90-release.yaml
    changes:
      dependsOn: [release]
      in: ['^\.argoci/modules/90-release\.yaml$']

  # Literal paths: the generated `third_party` entry would fire all four on a
  # change to any one.
  - path: .argoci/modules/20-envoy-gateway.yaml
    changes:
      in:
        - ^third_party/envoy-gateway/
        - ^metadata\.mk$
        - ^lib\.Makefile$
        - ^\.argoci/modules/20-envoy-gateway\.yaml$
      exclude:
        - (^|/)\.gitignore$
        - (^|/)README\.md$
        - (^|/)LICENSE$

  - path: .argoci/modules/20-envoy-proxy.yaml
    changes:
      in:
        - ^third_party/envoy-proxy/
        - ^metadata\.mk$
        - ^lib\.Makefile$
        - ^\.argoci/modules/20-envoy-proxy\.yaml$
      exclude:
        - (^|/)\.gitignore$
        - (^|/)README\.md$
        - (^|/)LICENSE$

  - path: .argoci/modules/20-envoy-ratelimit.yaml
    changes:
      in:
        - ^third_party/envoy-ratelimit/
        - ^metadata\.mk$
        - ^lib\.Makefile$
        - ^\.argoci/modules/20-envoy-ratelimit\.yaml$
      exclude:
        - (^|/)\.gitignore$
        - (^|/)README\.md$
        - (^|/)LICENSE$

  - path: .argoci/modules/20-third-party-cni-plugins.yaml
    changes:
      in:
        - ^third_party/cni-plugins/
        - ^metadata\.mk$
        - ^lib\.Makefile$
        - ^\.argoci/modules/20-third-party-cni-plugins\.yaml$
      exclude:
        - (^|/)\.gitignore$
        - (^|/)README\.md$
        - (^|/)LICENSE$

  - path: .argoci/modules/20-e2e-images.yaml
    changes:
      in:
        - ^e2e/images/
        - ^metadata\.mk$
        - ^lib\.Makefile$
        - ^\.argoci/modules/20-e2e-images\.yaml$
      exclude:
        - (^|/)\.gitignore$
        - (^|/)README\.md$
        - (^|/)LICENSE$

  - path: .argoci/modules/10-check-images.yaml
    changes:
      in:
        - ^charts/
        - ^manifests/
        - ^\.argoci/modules/10-check-images\.yaml$

  # The chart is what the FV installs the operator from, so it belongs in the
  # trigger even though no Go file references it.
  - path: .argoci/modules/20-operator.yaml
    changes:
      dependsOn: [operator]
      in:
        - ^charts/tigera-operator/
        - ^\.argoci/modules/20-operator\.yaml$

  - path: .argoci/modules/20-node.yaml
    changes:
      dependsOn: [node]
      in: ['^\.argoci/modules/20-node\.yaml$']

  # The system tests install the whole DaemonSet, so every component in it
  # triggers them.
  - path: .argoci/modules/20-node-kind.yaml
    changes:
      dependsOn: [node, typha, apiserver, cni-plugin, pod2daemon, calicoctl,
                  kube-controllers, goldmane, whisker-backend, cmd]
      in:
        - ^whisker/
        - ^\.semaphore/vms/
        - ^\.argoci/scripts/vm-fleet-setup\.sh$
        - ^\.argoci/modules/20-node-kind\.yaml$

  # `felix/nftables` is that package's own import closure, far narrower than the
  # whole `felix` component.
  - path: .argoci/modules/45-nft-bench.yaml
    changes:
      dependsOn: [felix/nftables]
      in:
        - ^hack/perf/
        - ^\.argoci/modules/45-nft-bench\.yaml$

  - path: .argoci/modules/20-gateway-conformance.yaml
    changes:
      in:
        - ^e2e/cmd/gateway/
        - ^hack/test/certs/
        - ^hack/test/kind/gateway-setup\.sh$
        - ^third_party/envoy-gateway/
        - ^third_party/envoy-proxy/
        - ^third_party/envoy-ratelimit/
        - ^\.argoci/modules/20-gateway-conformance\.yaml$
      exclude:
        - (^|/)\.gitignore$
        - (^|/)README\.md$
        - (^|/)LICENSE$

  # The FV lanes run Typha alongside Felix, and the fleet scripts drive them all.
  - path: .argoci/modules/20-felix.yaml
    changes:
      dependsOn: [felix, typha]
      in:
        - ^\.semaphore/vms/
        - ^\.argoci/scripts/vm-fleet-setup\.sh$
        - ^process/testing/aso/
        - ^process/testing/util/
        - ^process/testing/winfv-felix/
        - ^\.argoci/modules/20-felix\.yaml$

  - path: .argoci/modules/40-openstack.yaml
    changes:
      in:
        - ^networking-calico/
        - ^metadata\.mk$
        - ^lib\.Makefile$
        - ^\.argoci/modules/40-openstack\.yaml$

  - path: .argoci/modules/20-e2e-gcp.yaml
    changes:
      dependsOn: [e2e]
      in:
        - ^\.argoci/scripts/
        - ^\.argoci/modules/20-e2e-gcp\.yaml$
      exclude:
        - (^|/)README\.md$
        - (^|/)DESIGN\.md$

  - path: .argoci/modules/20-kube-controllers.yaml
    changes:
      dependsOn: [kube-controllers]
      in: ['^\.argoci/modules/20-kube-controllers\.yaml$']

  - path: .argoci/modules/20-typha.yaml
    changes:
      dependsOn: [typha]
      in: ['^\.argoci/modules/20-typha\.yaml$']

  - path: .argoci/modules/20-cni-plugin.yaml
    changes:
      dependsOn: [cni-plugin]
      in: ['^\.argoci/modules/20-cni-plugin\.yaml$']

  # The FV drivers are shell and PowerShell rather than Go, so the generated
  # component does not reach them and they are listed here.
  - path: .argoci/modules/20-cni-plugin-windows.yaml
    changes:
      dependsOn: [cni-plugin]
      in:
        - ^process/testing/aso/
        - ^process/testing/util/
        - ^process/testing/winfv-cni-plugin/
        - ^\.argoci/modules/20-cni-plugin-windows\.yaml$

  # No generated component: the tree holds Dockerfiles and a Makefile, and the
  # sources they build come from upstream.
  - path: .argoci/modules/20-istio.yaml
    changes:
      in:
        - ^istio/
        - ^hack/test/certs/
        - ^metadata\.mk$
        - ^lib\.Makefile$
        - ^\.argoci/modules/20-istio\.yaml$

  - path: .argoci/modules/10-check-operator-images.yaml
    changes:
      dependsOn: [release]
      in:
        - (^|/)Makefile$
        - ^\.argoci/modules/10-check-operator-images\.yaml$

  # `whisker` is listed as a path rather than a component: it is TypeScript, so
  # there is no import graph to derive one from.
  - path: .argoci/modules/20-e2e.yaml
    changes:
      dependsOn: [e2e, node, typha, apiserver, cni-plugin, pod2daemon, calicoctl,
                  kube-controllers, goldmane, whisker-backend, cmd, operator]
      in:
        - ^whisker/
        - ^\.argoci/modules/20-e2e\.yaml$

  - path: .argoci/modules/20-manifest-install.yaml
    changes:
      dependsOn: [third_party, cni-plugin]
      in:
        - ^manifests/
        - ^charts/calico/
        - ^hack/test/kind/
        - ^e2e/config/
        - ^Makefile$
        - ^\.argoci/modules/20-manifest-install\.yaml$

  - path: .argoci/modules/20-kubevirt-live-migration.yaml
    changes:
      dependsOn: [felix, cni-plugin, confd, node, e2e, libcalico-go, operator]
      in:
        - ^e2e/pkg/
        - ^\.argoci/modules/20-kubevirt-live-migration\.yaml$
