# srv serves on its named port http (80) and on 8080 and 9090. cli is the
# client the CNPs name; oth is untouched by them and proves srv stays up.
apiVersion: v1
kind: Pod
metadata:
  name: srv
  labels: {app: srv}
spec:
  containers:
  - name: srv
    image: registry.k8s.io/e2e-test-images/agnhost:2.47
    args: [porter]
    env:
    - {name: SERVE_PORT_80, value: ok80}
    - {name: SERVE_PORT_8080, value: ok8080}
    - {name: SERVE_PORT_9090, value: ok9090}
    ports:
    - {name: http, containerPort: 80}
    - {name: p8080, containerPort: 8080}
    - {name: p9090, containerPort: 9090}
---
apiVersion: v1
kind: Pod
metadata:
  name: cli
  labels: {app: cli}
spec:
  containers:
  - {name: cli, image: registry.k8s.io/e2e-test-images/agnhost:2.47, args: [pause]}
---
apiVersion: v1
kind: Pod
metadata:
  name: oth
  labels: {app: oth}
spec:
  containers:
  - {name: oth, image: registry.k8s.io/e2e-test-images/agnhost:2.47, args: [pause]}
---
apiVersion: v1
kind: Service
metadata:
  name: srv
spec:
  selector: {app: srv}
  ports:
  - {name: http, port: 80, targetPort: 80}
  - {name: p8080, port: 8080, targetPort: 8080}
  - {name: p9090, port: 9090, targetPort: 9090}
