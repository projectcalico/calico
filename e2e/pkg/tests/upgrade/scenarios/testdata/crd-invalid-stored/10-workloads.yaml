# A valid control policy over a probed target: stored invalid objects must not
# change how valid policy is enforced across the upgrade.
apiVersion: v1
kind: Pod
metadata:
  name: target
  labels: {app: crdv-target}
spec:
  containers:
  - name: target
    image: registry.k8s.io/e2e-test-images/agnhost:2.47
    args: [porter]
    env: [{name: SERVE_PORT_80, value: ok80}]
    ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: target
spec:
  selector: {app: crdv-target}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  labels: {role: ok}
spec:
  containers:
  - {name: client, image: registry.k8s.io/e2e-test-images/agnhost:2.47, args: [pause]}
---
apiVersion: v1
kind: Pod
metadata:
  name: blocked
  labels: {role: blocked}
spec:
  containers:
  - {name: blocked, image: registry.k8s.io/e2e-test-images/agnhost:2.47, args: [pause]}
---
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: control
spec:
  order: 500
  selector: app == 'crdv-target'
  types: [Ingress]
  ingress:
  - {action: Deny, source: {selector: "role == 'blocked'"}}
  - {action: Allow}
