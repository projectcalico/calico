# gcp/bpf.yaml - test selection for the GCP kubeadm lane: sig-calico on a
# VXLAN cluster running the BPF dataplane.

extends: ../base.yaml

include:
  - sig-calico

exclude:
  labels:
    - label: RequiresAWS
      reason: "requires AWS-specific infrastructure (VPC routing layout, etc.)"

    - label: RequiresBGPMesh
      reason: "requires BGP routing, but this cluster uses VXLAN"

    - label: NoEncap
      reason: "requires non-encapsulated routing, but this cluster uses VXLAN"

    - label: Feature:Istio
      reason: "Calico policy not enforced with Istio ambient on BPF dataplane"

    - label: RequiresXtables
      reason: "requires iptables or nftables dataplane, but this cluster uses BPF"

    - label: RequiresCalicoAPIServer
      reason: "this job runs with USE_API_SERVER=false (v3 CRD mode, no aggregated Calico API server)"

    - label: Feature:KubeVirt
      reason: "e2e infra integration with Banzai not ready, currently run manually"
