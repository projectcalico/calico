#
# bpf: BPF/VPP dataplane, unencapsulated routing, external node, on KOPS.
#
# Selection scope comes from pipeline.yaml; this file adds only what this
# lane's cluster shape rules out.

extends: pipeline.yaml

exclude:
  labels:
    - label: RequiresXtables
      reason: "BPF/VPP dataplane; these specs exercise iptables/nftables behaviour that does not exist here"
    - label: Feature:HostPorts
      reason: "hostPort is not reachable on kops' node security groups"
  namePatterns:
    - group: "kops clusters do not expose the API server to the pod network"
      patterns:
        - 'v1.should.proxy.through.a.service'
        - 'DNS.should.resolve'
        - 'DNS.should.provide'
        - 'IPAM.StrictAffinity'
        - 'EndpointSlices.pointing.to.API.Server'
