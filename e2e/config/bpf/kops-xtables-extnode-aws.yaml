#
# bpf: xtables dataplane, unencapsulated routing, external node, AWS, on KOPS.
#
# Selection scope comes from pipeline.yaml; this file adds only what this
# lane's cluster shape rules out.

extends: [pipeline.yaml, ../platform/kops.yaml]

exclude:
  labels:
    - label: Dataplane:BPF
      reason: "not a BPF dataplane; maglev needs BPF and only self-skips on a missing external node, so it would fail rather than skip"
    - label: Feature:AutoHEPs
      reason: "ENABLE_AUTOHEP is not set on this lane, so no automatic host endpoints exist"
