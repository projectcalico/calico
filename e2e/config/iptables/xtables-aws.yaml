#
# iptables: xtables dataplane, unencapsulated routing, no external node, AWS,
# WireGuard on.
#
# Selection scope comes from pipeline.yaml; this file adds only what this
# lane's cluster shape rules out.

extends: pipeline.yaml

enable:
  - label: Feature:Wireguard
    reason: "ENABLE_WIREGUARD is set on this lane"

exclude:
  labels:
    - label: RequiresV3CRDs
      reason: "aggregated API server lane; the BGP mesh specs cut kube-apiserver off from calico-apiserver and cannot restore the mesh"
    - label: Dataplane:BPF
      reason: "not a BPF dataplane; maglev needs BPF and only self-skips on a missing external node, so it would fail rather than skip"
    - label: ExternalNode
      reason: "no external node on this lane (needs EXT_IP/EXT_KEY/EXT_USER)"
