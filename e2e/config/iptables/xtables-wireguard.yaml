#
# iptables: xtables dataplane, encapsulated, no external node, WireGuard on,
# manifest install.
#
# Selection scope comes from pipeline.yaml; this file adds only what this
# lane's cluster shape rules out.

extends: xtables.yaml

enable:
  - label: Feature:Wireguard
    reason: "ENABLE_WIREGUARD is set on this lane"

exclude:
  labels:
    - label: NoEncap
      reason: "cluster uses encapsulation; these specs require unencapsulated routing"
    - label: RequiresBGPMesh
      reason: "cluster routes over an overlay, so disabling the BGP mesh does not sever connectivity as these specs expect"
    - label: RequiresGoldmane
      reason: "manifest install; goldmane/whisker ship enabled in the operator chart but the MANIFEST_FILE installers do not include them"
    - label: RequiresOperator
      reason: "manifest install (no tigera-operator), so a CR this test creates would never be reconciled"
