#
# iptables: xtables dataplane, unencapsulated routing, no external node, manifest
# install, etcd datastore with no aggregated Calico API server.
#
# Selection scope comes from pipeline.yaml; this file adds only what this
# lane's cluster shape rules out. It repeats xtables-manifest.yaml's exclusions rather
# than extending it, because that lane also excludes RequiresV3CRDs and an inherited
# exclusion can't be undone here.

extends: pipeline.yaml

exclude:
  labels:
    - label: RequiresCalicoAPIServer
      reason: "etcd datastore install (no aggregated Calico API server), so read-path tier RBAC is not enforced"
    - label: Dataplane:BPF
      reason: "not a BPF dataplane; maglev needs BPF and only self-skips on a missing external node, so it would fail rather than skip"
    - label: ExternalNode
      reason: "no external node on this lane (needs EXT_IP/EXT_KEY/EXT_USER)"
    - label: RequiresAWS
      reason: "not an AWS lane; these specs need AWS VPC routing"
    - label: RequiresGoldmane
      reason: "manifest install; goldmane/whisker ship enabled in the operator chart but the MANIFEST_FILE installers do not include them"
    - label: RequiresOperator
      reason: "manifest install (no tigera-operator), so a CR this test creates would never be reconciled"
