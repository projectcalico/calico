#
# iptables: xtables dataplane, AWS VPC CNI and IPAM, v3 CRD mode, no external node, on EKS.
#
# Selection scope comes from pipeline.yaml; this file adds only what this
# lane's cluster shape rules out.

extends: [pipeline.yaml, ../platform/eks.yaml]

exclude:
  labels:
    - label: Dataplane:BPF
      reason: "not a BPF dataplane; maglev needs BPF and only self-skips on a missing external node, so it would fail rather than skip"
    - label: ExternalNode
      reason: "no external node on this lane (needs EXT_IP/EXT_KEY/EXT_USER)"
    - label: Feature:AutoHEPs
      reason: "ENABLE_AUTOHEP is not set on this lane, so no automatic host endpoints exist"
    - label: Feature:Istio
      reason: "Istio ambient policy enforcement is not configured on this lane"
    - label: NoEncap
      reason: "requires Calico-managed routing, but this cluster runs the AWS VPC CNI"
    - label: RequiresBGP
      reason: "Calico runs policy-only behind the AWS VPC CNI, so BIRD is not running"
    - label: RequiresCalicoAPIServer
      reason: "v3 CRD mode (USE_API_SERVER=false): no aggregated Calico API server, so read-path tier RBAC is not enforced"

  namePatterns:
    - group: "requires Calico IPAM, but this cluster uses AWS VPC IPAM"
      patterns:
        - 'IPAM.StrictAffinity'
        - 'IPAM.GC'

    - group: "NodePort traffic is blocked by the EKS node security group"
      patterns:
        - 'scenario-7:'
        - 'scenario-12:'

    - group: "needs the multi-mode rapidclient server image, which is only side-loaded into kind and gcp-kubeadm clusters"
      patterns:
        - 'Packet.Size.Verification'
