# kind/felix-routing.yaml - test selection for the Felix-routing kind e2e CI
# job.
#
# Used by `make e2e-test` with KIND_CALICO_API_GROUP=crd.projectcalico.org/v1,
# which deploys the aggregated Calico API server. RequiresCalicoAPIServer tests
# run here (and not in the BIRD job, which runs in v3 CRD mode). The BGPPeer
# tests are excluded -- see the reason on that exclusion below.

extends: ../base.yaml

include:
  - Conformance && sig-calico
  - Conformance && sig-network
  - RequiresCalicoAPIServer

exclude:
  labels:
    - label: ExternalNode
      reason: "requires a non-cluster node with EXT_IP/EXT_KEY/EXT_USER configured"

    - label: Feature:BGPPeer
      reason: >-
        most of the Feature:BGPPeer tests disable the BGP mesh and expect that to cause loss of
        connectivity - but that is only true when BGP is required for cluster routing, which is not
        true in this lane; hence we exclude the Feature:BGPPeer tests.
