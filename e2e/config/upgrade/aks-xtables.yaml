#
# upgrade: xtables dataplane, unencapsulated routing, no external node, on AKS.
#
# Selection scope comes from pipeline.yaml; this file adds only what this
# lane's cluster shape rules out.

extends: pipeline.yaml

exclude:
  labels:
    - label: ExternalNode
      reason: "no external node on this lane (needs EXT_IP/EXT_KEY/EXT_USER)"
    - label: Feature:MTU
      reason: "AKS enforces its own MTU; these specs assert Calico's"
  namePatterns:
    - group: "AKS load balancer does not hairpin traffic originating in-cluster"
      patterns:
        - 'outside.the.cluster'
        - 'external.to.nodeport'
        - 'StrictAffinity'
        - 'allow.ingress.access.from.updated.pod'
