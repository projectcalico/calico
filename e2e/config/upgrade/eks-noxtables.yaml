#
# upgrade: BPF/VPP dataplane, unencapsulated routing, no external node, on EKS.
#
# Selection scope comes from pipeline.yaml; this file adds only what this
# lane's cluster shape rules out.

extends: pipeline.yaml

exclude:
  labels:
    - label: ExternalNode
      reason: "no external node on this lane (needs EXT_IP/EXT_KEY/EXT_USER)"
    - label: RequiresXtables
      reason: "BPF/VPP dataplane; these specs exercise iptables/nftables behaviour that does not exist here"
  namePatterns:
    - group: "EKS control plane cannot reach the pod network"
      link: "https://docs.tigera.io/calico/latest/getting-started/kubernetes/managed-public-cloud/eks"
      patterns:
        - 'both.pod.and.service.Proxy\b'
        - 'proxy.through.a.service.and.a.pod'
        - 'replica.with.a.public.image'
        - 'DNS.for.ExternalName.services'
        - 'DNS.for.pods.for.Hostname'
        - 'DNS.for.pods.for.Subdomain'
        - 'DNS.for.services'
        - 'DNS.for.the.cluster'
        - 'DNS.qualified.names.for.services'
