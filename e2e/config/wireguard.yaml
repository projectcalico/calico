#
# WireGuard lanes on a managed control plane: the encryption specs only.
#
# Narrow on purpose. Widening one of these to a full suite means working out
# which specs a vendored-CNI cluster can pass, and that needs a manual run per
# platform. The kubeadm lanes use iptables/xtables-wireguard.yaml instead.

extends: base.yaml

include:
  - Feature:Wireguard

enable:
  - label: Feature:Wireguard
    reason: "ENABLE_WIREGUARD is set on these lanes"
