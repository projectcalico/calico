# maglev.yaml - the Maglev load-balancing tests, and nothing else.
#
# Used by the dedicated Maglev job in bpf.yml (and its ArgoCI twin). Maglev
# needs a cluster with the BPF dataplane and DSR, an external node, every node
# on a single VPC subnet, and encapsulation off; the job supplies that stack.
# Without it the backend selection can't be made deterministic and the tests
# fail even when nothing is wrong. See felix/design/bpf-services.md -> Maglev.
#
# The `include` is required rather than optional: with no filter of any kind,
# the upstream Kubernetes framework applies a default skip of
# `\[Flaky\]|\[Feature:.+\]` (test/e2e/framework/test_context.go), which
# suppresses [Feature:Maglev]. Naming the feature here is what selects it.

include:
  - Feature:Maglev
