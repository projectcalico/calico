# gke.yaml - test selection for GKE runs.
#
# Extends base.yaml. GKE runs its own CNI plugin with host-local IPAM, so tests
# needing Calico IPAM or Calico BGP are excluded. A run serving the aggregated
# Calico API server would need its own gke-aapis.yaml.

extends: base.yaml

exclude:
  labels:
    - label: RequiresCalicoAPIServer
      reason: "the projectcalico.org/v3 CRDs are served directly, with no aggregated Calico API server"

    - label: RequiresBGPMesh
      reason: "requires Calico BGP, but this cluster runs the GKE CNI plugin with BGP disabled"

    - label: Feature:BGPPeer
      reason: "requires Calico BGP, but this cluster runs the GKE CNI plugin with BGP disabled"

    - label: NoEncap
      reason: "requires Calico-managed routing, but this cluster runs the GKE CNI plugin"

    - label: Feature:Istio
      reason: "Istio ambient policy enforcement is not configured on this cluster"

  namePatterns:
    - group: "requires Calico IPAM, but this cluster uses host-local IPAM"
      patterns:
        - IPAM.StrictAffinity
        - IPAM.GC

    - group: "GKE enables the DenyServiceExternalIPs admission plugin, so the suite cannot create a Service with an external IP"
      patterns:
        - "scenario-0EL0:"
        - "scenario-0EL1:"
        - "scenario-0EC0:"
        - "scenario-0EC1:"
        - "scenario-0EC2:"

    - group: "expects NodePort traffic to be SNATed to a Calico tunnel address, but this cluster routes pod traffic through the GKE CNI plugin"
      patterns:
        - "scenario-7:"
        - "scenario-12:"

    - group: "needs the multi-mode rapidclient server image, which is only side-loaded into kind and gcp-kubeadm clusters"
      patterns:
        - Packet.Size.Verification
