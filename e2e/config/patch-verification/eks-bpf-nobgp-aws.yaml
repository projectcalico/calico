#
# patch-verification: BPF dataplane, unencapsulated routing, no Calico BGP, no external node, AWS, on EKS.
#
# Selection scope comes from pipeline.yaml; this file adds only what this
# lane's cluster shape rules out.

extends: [pipeline.yaml, ../platform/eks.yaml]

exclude:
  labels:
    - label: ExternalNode
      reason: "no external node on this lane (needs EXT_IP/EXT_KEY/EXT_USER)"
    - label: Feature:AutoHEPs
      reason: "ENABLE_AUTOHEP is not set on this lane, so no automatic host endpoints exist"
    - label: RequiresBGP
      reason: "Calico is not doing BGP here (Felix routing, or the provider's own CNI with Calico policy-only), so BIRD is not running"
    - label: RequiresXtables
      reason: "BPF/VPP dataplane; these specs exercise iptables/nftables behaviour that does not exist here"
