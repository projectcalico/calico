#
# patch-verification pipeline: test selection scope.
#
# Conformance from both SIGs, plus tier RBAC: enough to
# show a patch release did not regress the basics, without the full suite's
# runtime. `Conformance && sig-calico` is the 21 framework.ConformanceIt specs --
# policy, tiers, tiered RBAC, host endpoints, workload ingress/egress.
#
# Note the two SIG terms are separate include entries, i.e. OR'd. They cannot be
# AND'd: SIGDescribe adds exactly one sig- label, so `sig-network && sig-calico`
# matches nothing at all.
#
# Abstract parent -- no cell points at this file directly. The sibling
# configs extend it and subtract what their cluster shape cannot run.

extends: ../base.yaml

include:
  - Conformance && sig-network
  - Conformance && sig-calico
  - Feature:Tiered-RBAC

exclude:
  labels:
    - label: Feature:KubeVirt
      reason: "needs a KubeVirt install; only the kubevirt lanes carry it"
