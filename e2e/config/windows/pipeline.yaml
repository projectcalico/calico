#
# windows pipeline: test selection scope.
#
# Only the Calico specs that can run against Windows nodes.
#
# Abstract parent -- no cell points at this file directly. The sibling
# configs extend it and subtract what their cluster shape cannot run.

extends: ../base.yaml

include:
  - sig-calico && RunsOnWindows

exclude:
  labels:
    - label: Feature:KubeVirt
      reason: "needs a KubeVirt install; only the kubevirt lanes carry it"
