#
# IPv6-only clusters: labels that need IPv4 node addresses.
#
# Composition-only: carries no include scope. Reference it alongside a lane
# config, e.g. `extends: [kops-xtables-encap-nobgp-extnode-aws.yaml, ../platform/ipv6-only.yaml]`.

exclude:
  labels:
    - label: RequiresIPv4
      reason: "nodes have no IPv4 addresses"
