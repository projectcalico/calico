# aks.yaml - test selection for AKS runs.
#
# Extends base.yaml. AKS runs the Azure CNI and its IPAM, so tests needing
# Calico IPAM or Calico BGP are excluded. A run serving the aggregated Calico
# API server would need its own aks-aapis.yaml.

extends: base.yaml

exclude:
  labels:
    - label: RequiresCalicoAPIServer
      reason: "the projectcalico.org/v3 CRDs are served directly, with no aggregated Calico API server"

    - label: RequiresBGPMesh
      reason: "requires Calico BGP, but this cluster runs the Azure CNI with BGP disabled"

    - label: NoEncap
      reason: "requires Calico-managed routing, but this cluster runs the Azure CNI"

    - label: Feature:Istio
      reason: "Istio ambient policy enforcement is not configured on this cluster"

  namePatterns:
    - group: "requires Calico IPAM, but this cluster uses Azure IPAM"
      patterns:
        - IPAM.StrictAffinity
        - IPAM.GC
