#
# Universal CI exclusions, extended by every other config in this tree.
#
# Deliberately minimal. Keep lane-specific exclusions in the pipeline configs; a
# lane whose cluster does provide what a label needs cancels an exclusion here with
# `enable:`.
#
# No `include:` here: a child can broaden an include list but never narrow it, so
# each pipeline declares its own scope.

exclude:
  labels:
    - label: Slow
      reason: "long-running tests not suitable for CI"

    - label: Disruptive
      reason: "breaks cluster state for other parallel tests"

    - label: Feature:SCTPConnectivity
      reason: "no lane installs the SCTP kernel module, so these cannot connect"

    - label: Feature:Wireguard
      reason: "needs a cluster provisioned with WireGuard; the lanes that have one enable this label"

    - label: Feature:AutoHEPs
      reason: "serial specs that provision host endpoints on every node; the autohep lanes enable this label"
