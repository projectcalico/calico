#
# Universal CI exclusions, extended by every other config in this tree.
#
# Deliberately minimal. merge() only appends, so a label excluded here can never
# be re-included by a child -- keep lane-specific and feature-gating exclusions
# in the pipeline configs instead.
#
# No `include:` here for the same reason: a child can broaden an include list but
# never narrow it, so each pipeline declares its own scope.

exclude:
  labels:
    - label: Slow
      reason: "long-running tests not suitable for CI"

    - label: Disruptive
      reason: "breaks cluster state for other parallel tests"
    - label: Feature:SCTPConnectivity
      reason: "no lane installs the SCTP kernel module, so these cannot connect"
    - label: Feature:Wireguard
      reason: "needs a cluster provisioned with WireGuard; no config lane enables it"
