#
# nftables: xtables dataplane, encapsulated, no Calico BGP, v3 CRD mode, no external node, auto host endpoints.
#
# Selection scope comes from pipeline.yaml; this file adds only what this
# lane's cluster shape rules out.

extends: pipeline.yaml

enable:
  - label: Feature:AutoHEPs
    reason: "this lane exists to cover auto host endpoints"

exclude:
  labels:
    - label: Dataplane:BPF
      reason: "not a BPF dataplane; maglev needs BPF and only self-skips on a missing external node, so it would fail rather than skip"
    - label: ExternalNode
      reason: "no external node on this lane (needs EXT_IP/EXT_KEY/EXT_USER)"
    - label: NoEncap
      reason: "cluster uses encapsulation; these specs require unencapsulated routing"
    - label: RequiresAWS
      reason: "not an AWS lane; these specs need AWS VPC routing"
    - label: RequiresBGP
      reason: "Calico is not doing BGP here (Felix routing, or the provider's own CNI with Calico policy-only), so BIRD is not running"
    - label: RequiresBGPMesh
      reason: "cluster routes over an overlay, so disabling the BGP mesh does not sever connectivity as these specs expect"
    - label: RequiresCalicoAPIServer
      reason: "v3 CRD mode (USE_API_SERVER=false): no aggregated Calico API server, so read-path tier RBAC is not enforced"
