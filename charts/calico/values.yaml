# The Calico version to use when generating manifests.
version: master

# Configure the images to use when generating manifests.
# If a new image is added, update manifests/generate.sh
calico:
  image: calico
  registry: quay.io/calico
node:
  image: node
  registry: quay.io/calico
typha:
  enabled: false
flannel:
  image: docker.io/flannel/flannel
  tag: v0.24.4
flannelMigration:
  image: flannel-migration
  registry: quay.io/calico

# Some defaults used in the templates.
useV3CRDs: false
includeCRDs: true

# Enables the Calico authorization webhook, which enforces tier-based RBAC on reads
# (GET/LIST/WATCH) of tiered policy resources. Self-hosted clusters only: it requires
# --authorization-config on the kube-apiserver, which managed control planes do not expose.
# See webhooks/config/README.md for the install procedure.
authzWebhookEnabled: false

# Pins the calico-webhooks Service's spec.clusterIP. Leave empty to let Kubernetes
# allocate a ClusterIP normally. Set this where the kube-apiserver's authorization
# config has to name the webhook's address before the Service exists (e.g. kind
# clusters, where --authorization-config is written to disk before cluster bringup).
authzWebhookClusterIP: ""
imagePullPolicy: IfNotPresent
mtu: "1440"
ipam: "calico-ipam"
etcd:
  endpoints: "http://<ETCD_IP>:<ETCD_PORT>"
  tls:
    crt: null
    ca: null
    key: null
